name: BFF Accessibility (Playwright + axe-core)

# Regression checks for the BFF web views (issue #529, slice 2). Brings up the
# same stack as scripts/dev.sh (docker compose infra + API + BFF, `demo` profile)
# and scans the representative journeys with axe-core on Chromium.
# Fails on critical/serious WCAG 2.x A/AA violations; the rest is only reported.
# Passing this job is NOT a conformance claim (see docs/ACCESSIBILITY.md).
on:
  pull_request:
    branches: [develop]
    paths:
      - 'bff/**'
      - 'scripts/dev.sh'
      - 'docs/ACCESSIBILITY.md'
      - '.github/workflows/bff-accessibility.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes the run in progress.
concurrency:
  group: bff-accessibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        # Read-only cache outside the default branch; also validates the wrapper JAR.
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      - name: Set up Node.js (accessibility suite)
        # Node for bff/e2e-a11y only; the BFF stylesheet build uses the Gradle-provisioned Node.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.11.1'
          cache: npm
          cache-dependency-path: bff/e2e-a11y/package-lock.json

      - name: Create ephemeral .env
        # scripts/dev.sh requires a .env. Values are generated for this run only and
        # die with the runner; the demo profile brings its own demo-only secrets.
        run: |
          grep -vE '^(MYSQL_ROOT_PASSWORD|MYSQL_APP_PASSWORD)=' .env.example > .env
          {
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "MYSQL_APP_PASSWORD=$(openssl rand -hex 16)"
          } >> .env

      - name: Warm up Gradle build
        # Compiles API and BFF (and builds the Tailwind CSS) first, so the health
        # timeouts of dev.sh only have to cover the Spring Boot startup.
        run: ./gradlew --no-daemon :api:app:classes :bff:classes

      - name: Start stack (infra + API + BFF, demo profile)
        env:
          SPRING_PROFILES_ACTIVE: demo
          DEV_HEALTH_TIMEOUT: '300'
        run: ./scripts/dev.sh start

      - name: Install accessibility suite
        working-directory: bff/e2e-a11y
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run accessibility checks
        working-directory: bff/e2e-a11y
        env:
          BASE_URL: http://localhost:8080
        run: npx playwright test

      - name: Upload report and service logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bff-accessibility-report
          path: |
            bff/e2e-a11y/playwright-report/
            bff/e2e-a11y/test-results/
            .dev-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop stack
        if: always()
        run: ./scripts/dev.sh stop
