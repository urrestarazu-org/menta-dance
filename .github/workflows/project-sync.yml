name: Project Board Sync

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

jobs:
  set-in-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Move linked issues to "In review"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const projectId = "PVT_kwDOEOjBNM4BgdHU";
            const statusFieldId = "PVTSSF_lADOEOjBNM4BgdHUzhd8t1g";
            const inReviewOptionId = "2fa5876f";

            const prBody = context.payload.pull_request.body || "";
            const closesRegex = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\b:?\s+#(\d+)/gi;
            const issueNumbers = [...prBody.matchAll(closesRegex)].map(m => Number(m[3]));

            if (issueNumbers.length === 0) {
              core.info("No linked issues found via closing keywords in the PR body.");
              return;
            }

            for (const issueNumber of issueNumbers) {
              const issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });

              const addResult = await github.graphql(
                `mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                    item { id }
                  }
                }`,
                { projectId, contentId: issue.data.node_id }
              );
              const itemId = addResult.addProjectV2ItemById.item.id;

              await github.graphql(
                `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                    value: { singleSelectOptionId: $optionId }
                  }) { projectV2Item { id } }
                }`,
                { projectId, itemId, fieldId: statusFieldId, optionId: inReviewOptionId }
              );

              core.info(`Issue #${issueNumber} -> In review`);
            }
