# SDD Project Config — menta-dance

# Generated by `gentle-ai sdd-init` on 2026-07-25; Android sections refreshed on 2026-10-27.
# Do not edit stack/conventions; update via `sdd-init` after a stack change.
schema: spec-driven

context: |
  Project: menta-dance — dance academy SaaS (Virtual online courses + Physical in-person classes).
  Detected at: /Users/ale/repositorios/menta-dance (git remote: menta-dance)
  Stack: Java 21 + Spring Boot 3.5.14 monorepo (Gradle Kotlin DSL), modular monolith.
  Architecture: domain <- application <- infrastructure (Clean Architecture, ArchUnit-enforced).
  Persistence: MySQL 8.0 schema `menta` (Flyway, prefix-per-module tables), Redis 7.4 (`maxmemory-policy noeviction`).
  Observability: OTel Collector 0.131 + Loki 3.5.3 + Grafana 11.5.2; `correlationId`, 90-day retention.
  Web (BFF): Java + Spring Boot + Thymeleaf (`bff/`).
  Mobile (Android): Kotlin 2.4.21 + AGP 9.4.1 + Compose BOM 2026.09.00 (Material3) + Hilt 2.60.1 (KSP) + Navigation Compose + OkHttp 5.5.0 + kotlinx-serialization; `android/` is a live Gradle module (compileSdk 37, minSdk 26 per ADR-0046, JVM 21), direct API client (ADR-0035), Clean Architecture `presentation/domain/data/di`.
  Tooling: Gradle wrapper (Kotlin DSL), dependency locking, configuration cache, parallel builds.
  Quality: Checkstyle 13.8.0 (`config/checkstyle/google_checks.xml` — Google Java Style adapted to 4-space indentation to match existing codebase; LineLength=120, full Google ruleset otherwise), JaCoCo 0.8.12, SonarCloud (declared in CI), ArchUnit 1.3.0 (api:* only, except `shared`).
  CI: GitHub Actions on `ubuntu-latest`, Temurin JDK 21, gradle cache.
  Style: Spanish for narrative docs (AGENTS.md, docs/, ADRs); English for code identifiers/comments by default.
  Git Flow: `main` (protected, PRs only), `develop` (default), `feature/*`, `release/*`, `hotfix/*`. Conventional Commits; NO AI attribution in commits.

modules:
  backend:
    type: monorepo-modular-monolith
    toolchain: java-21
    framework: spring-boot-3.5.14
    build: gradle-kotlin-dsl-wrapper
    modules:
      - api:shared       # Cross-module contracts only (no infrastructure, no Spring, no JPA)
      - api:auth         # Authentication + user management (Spring Security + JWT 0.12.6 + Redis)
      - api:billing      # Payments (Mercado Pago adapter, idempotent, HMAC webhook)
      - api:virtual      # Online courses (modules, lessons, videos)
      - api:physical     # In-person classes (schedules, attendance, check-in)
      - api:app          # Assembly — orchestration only, NO domain logic
      - bff              # Web (Spring Boot + Thymeleaf, separate Gradle module)
  mobile:
    module: android            # included in settings.gradle.kts; plugins applied via version catalog
    language: kotlin-2.4.21
    agp: 9.4.1
    framework: jetpack-compose-bom-2026.09.00
    di: hilt-2.60.1            # KSP processor (ksp 2.3.12)
    navigation: navigation-compose-2.10.2
    networking: okhttp-5.5.0 + kotlinx-serialization-json-1.11.0
    architecture: clean (presentation/domain/data/di); domain free of android/androidx imports
    status: active (login, session, token refresh, encrypted refresh-token store; unit tests green)

testing_capability:
  runner: junit5            # Spring Boot starter test; JUnit Platform 1.12.2 forced
  build_command: ./gradlew build
  test_command: ./gradlew test
  archunit_command: ./gradlew test --tests "*ArchitectureTest"
  coverage_command: ./gradlew jacocoTestReport
  coverage_verification_command: ./gradlew jacocoTestCoverageVerification
  linter_command: ./gradlew checkstyleMain checkstyleTest
  contract_command: ./gradlew verifyLocalInfrastructureContract
  quality_gate: ./gradlew check
  android:
    test_command: ./gradlew :android:testDebugUnitTest   # `:android:test` also works (runs all variants); 125 tests / 12 classes green on 2026-10-27
    test_results: android/build/test-results/testDebugUnitTest/*.xml
    single_test_command: ./gradlew :android:testDebugUnitTest --tests "com.menta.android.domain.usecase.LoginUseCaseTest"
    instrumented_build_command: ./gradlew :android:assembleDebugAndroidTest   # what CI runs (compile + package only)
    instrumented_test_command: ./gradlew :android:connectedDebugAndroidTest  # requires device/emulator; not run in CI
    linter_command: ./gradlew :android:lintDebug          # AGP lint; no lint.xml/baseline, no ktlint/detekt configured
    build_command: ./gradlew :android:assembleDebug
    ci_command: ./gradlew build :android:assembleDebugAndroidTest   # per pr-develop.yml / pr-main.yml
    runner: junit4
    coverage: unavailable
    mocking: none               # fakes only (FakeSessionRepository, AuthTestFixtures); no mockk/mockito on Android
    flow_testing: kotlinx-coroutines-test (MainDispatcherRule); no turbine
    formatter: none
  test_layers:
    unit: junit5 + mockito                    # Spring Boot starter test
    architecture: archunit-1.3.0              # api:* only, except shared
    coverage: jacoco-0.8.12
    e2e: playwright                           # declared in docs, not wired into Gradle yet
    load: gatling                             # declared in docs, not wired into Gradle yet
    manual: bruno collection (`bruno/`)        # versioned, manual invocation
    android_unit: junit4-4.13.2 + kotlinx-coroutines-test + okhttp mockwebserver3 + hand-written fakes (no mockk/turbine/robolectric)
    android_architecture: DomainPurityTest (source-scan for android/androidx imports in domain/; no ArchUnit on Android)
    android_instrumented: androidx.test (core-ktx, runner, ext-junit) — androidTest/EncryptedRefreshTokenStoreTest; needs device/emulator, CI only assembles it
    android_ui: none            # no Compose UI test libs (ui-test-junit4), no Espresso, no screenshot tests
  coverage_policy:
    profile_100:
      - com.menta.auth.domain.*
      - com.menta.auth.application.*
      - com.menta.billing.domain.*
      - com.menta.billing.application.*
    profile_80:
      - com.menta.virtual.*
      - com.menta.physical.*
    profile_0:
      - "DTOs, configs, JPA repository interfaces"
    current_minimum: 0.00         # Phase 0 scaffolding; no implementation yet
    phase1_target: 0.50          # Per api/auth/build.gradle.kts TODO
    android: none                 # no JaCoCo wired for :android; JaCoCo/coverage gates are JVM-modules only

strict_tdd: true
strict_tdd_mode: discipline_target
strict_tdd_android: |
  Android has a working unit-test runner (JUnit4 via `:android:testDebugUnitTest`), so strict TDD is
  applicable there: write the failing JVM unit test first. Use fakes (src/test/.../testing/) and
  MainDispatcherRule; Compose UI tests are NOT available until ui-test-junit4 is added.
strict_tdd_notes: |
  The project enforces strict architecture discipline (100/80/0 coverage profile +
  ArchUnit) but does NOT use a red-green-refactor test harness. sdd-apply tasks
  should still be written test-first by default ("failing test before code"),
  but treat it as a workflow expectation, not a Gradle-enforced gate.

rules:
  proposal:
    - Include rollback plan for risky changes (auth, billing, schema)
    - Reference ArchUnit rule ids when crossing module boundaries
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Decompose by module (auth, billing, virtual, physical, shared)
  design:
    - Include sequence diagrams for complex flows (payments, auth refresh, webhooks)
    - Document inter-module contracts as Java interfaces in `api:shared`
    - Respect ADR-0021 (clean architecture mandatory): domain is framework-free
  tasks:
    - Group by phase and module, use hierarchical numbering (1.1, 1.2, ...)
    - Keep tasks completable in one session
    - Each task lists the file(s) it owns and which ArchUnit rule(s) it satisfies
  apply:
    guidelines:
      - Follow Clean Architecture order: domain first, then application, then infrastructure
      - Never cross module boundaries via JPA, SQL JOINs, or HTTP
      - Use ports from `api:shared` ONLY for cross-module reads
      - Domain layer: no Spring, no JPA, no framework imports (ArchUnit enforced)
      - Spanish comments allowed only in `package-info.java`
    tdd: true
    android_test_command: ./gradlew :android:testDebugUnitTest   # use for any change under android/
    test_command: ./gradlew test
    coverage_command: ./gradlew jacocoTestReport
    archunit_command: ./gradlew test --tests "*ArchitectureTest"
  verify:
    test_command: ./gradlew test
    android_test_command: ./gradlew :android:testDebugUnitTest
    android_lint_command: ./gradlew :android:lintDebug
    build_command: ./gradlew build
    coverage_threshold: 0                   # Placeholder until Phase 1 lifts it
    archunit_command: ./gradlew test --tests "*ArchitectureTest"
    contract_command: ./gradlew verifyLocalInfrastructureContract
  archive:
    - Warn before merging destructive deltas
    - Reference ArchUnit rule ids when a change crosses modules

git_flow:
  default_branch: develop
  protected_branch: main
  branches:
    - feature/*
    - release/*
    - hotfix/*
  commit_style: conventional-commits
  no_ai_attribution: true            # PRs merge via squash once CI green

