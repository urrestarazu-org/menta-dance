  pending_skills:
    - phase1_android                            # Android plugins re-enable, RegisterUserUseCaseImpl mapping, billings test wiring
    - phase2_real_tests                         # Lift application/domain test coverage above 0.00 target
    - phase3_e2e_load                           # Wire Playwright + Gatling into Gradle
  open_questions:
    - When do we uncomment the Android Gradle plugins? (Decide before Phase 1 module wiring.)
    - Should the BFF keep Thymeleaf, or move to React + Thymeleaf-like SSR? (Repository says Thymeleaf, ADR not yet written.)
