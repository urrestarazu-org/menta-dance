spring:
  application:
    name: menta-dance-bff

  # Session configuration
  session:
    store-type: redis
    redis:
      namespace: spring:session
    timeout: 30m

  # Redis configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Thymeleaf configuration
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

# Server configuration
server:
  port: 8080
  servlet:
    context-path: /

# API backend URL
menta:
  api:
    base-url: http://localhost:8081
  auth:
    base-url: ${AUTH_API_BASE_URL:http://localhost:8081}
    timeout: 5s

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    root: INFO
    com.menta: DEBUG
