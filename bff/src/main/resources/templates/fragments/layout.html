<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<!--
  Common page shell. Adopt it by replacing the whole <html> element:

    <html xmlns:th="http://www.thymeleaf.org"
          th:replace="~{fragments/layout :: page('Page title', ~{::main-content})}">
    <body>
      <th:block th:fragment="main-content"> ...page content... </th:block>
    </body>
    </html>

  `landing(title, content)` is the same shell without the centered container,
  for pages whose sections span the full width (the home hero).

  `title` is shown as "<title> - Menta Dance"; `content` is placed inside
  <main id="main">.
-->
<html lang="es" th:fragment="page(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Menta Dance'">Menta Dance</title>
    <th:block th:replace="~{fragments/head :: assets}"></th:block>
</head>
<body class="flex min-h-screen flex-col">
<a href="#main"
   class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-10 focus:rounded focus:bg-white focus:px-4 focus:py-2">Saltar al contenido</a>
<th:block th:replace="~{fragments/site :: header}"></th:block>
<main id="main" tabindex="-1" class="container-page flex-1 py-10 focus:outline-none" th:insert="${content}">Contenido</main>
<th:block th:replace="~{fragments/site :: footer}"></th:block>
</body>
</html>

<!-- Same shell without the page container: the content brings its own full-width sections (home). -->
<html lang="es" th:fragment="landing(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Menta Dance'">Menta Dance</title>
    <th:block th:replace="~{fragments/head :: assets}"></th:block>
</head>
<body class="flex min-h-screen flex-col">
<a href="#main"
   class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-10 focus:rounded focus:bg-white focus:px-4 focus:py-2">Saltar al contenido</a>
<th:block th:replace="~{fragments/site :: header}"></th:block>
<main id="main" tabindex="-1" class="flex-1 focus:outline-none" th:insert="${content}">Contenido</main>
<th:block th:replace="~{fragments/site :: footer}"></th:block>
</body>
</html>
