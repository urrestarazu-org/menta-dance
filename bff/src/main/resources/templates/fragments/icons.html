<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Inline icons (#849). Outline style, 24x24, drawn with currentColor so they follow the text colour. They are
  always decorative: aria-hidden and not focusable, the text next to them carries the meaning. Never use one
  as the only content of a link or button.

  icon(name, cls): `name` is one of arrow-left, arrow-up, arrow-down, plus, pencil, clock, modules, lessons,
  video, warning, check-circle, exclamation-circle, info-circle; `cls` are the Tailwind classes for the size
  (e.g. 'h-4 w-4'). An unknown name draws an empty icon.

    <th:block th:replace="~{fragments/icons :: icon('plus', 'h-4 w-4')}"></th:block>
-->
<svg th:fragment="icon(name, cls)" th:class="${cls}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true" focusable="false" th:switch="${name}">
    <path th:case="'arrow-left'" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
    <path th:case="'arrow-up'" d="M5 15l7-7 7 7"/>
    <path th:case="'arrow-down'" d="M19 9l-7 7-7-7"/>
    <path th:case="'plus'" d="M12 4v16m8-8H4"/>
    <path th:case="'pencil'" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
    <path th:case="'clock'" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
    <path th:case="'modules'" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
    <g th:case="'lessons'">
        <path d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
        <path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </g>
    <path th:case="'video'" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
    <path th:case="'warning'" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
    <path th:case="'check-circle'" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
    <path th:case="'exclamation-circle'" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    <path th:case="'info-circle'" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
</svg>
</body>
</html>
