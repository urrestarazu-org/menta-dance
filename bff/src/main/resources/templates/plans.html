<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Planes', ~{::main-content})}">
<body>
<th:block th:fragment="main-content">
<h1 class="mb-6">Planes</h1>

<ul class="grid gap-4 sm:grid-cols-2">
    <li th:each="plan : ${plans}" class="card">
        <h2 th:text="${plan.name()}">Plan</h2>
        <p th:if="${plan.featured()}" class="mt-2"><span class="badge badge-success">Destacado</span></p>
        <p class="mt-2" th:text="${plan.description()}">Descripción del plan</p>
        <p class="mt-4 font-semibold">
            <span th:text="${#numbers.formatDecimal(plan.price(), 1, 'POINT', 2, 'COMMA')} + ' ' + ${plan.currency()}">0,00 ARS</span>
            ·
            <span th:text="'cada ' + ${plan.durationDays()} + (${plan.durationDays()} == 1 ? ' día' : ' días')">cada 30 días</span>
        </p>
    </li>
</ul>
</th:block>
</body>
</html>
