<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Tu cotización', ~{::main-content})}">
<body>
<th:block th:fragment="main-content">
<nav class="mb-6"><a th:href="@{/classes}">Clases presenciales</a></nav>

<h1 class="mb-2">Tu cotización</h1>
<h2 class="mb-4" th:text="${quote.courseTitle()}">Clase</h2>

<ul class="card mb-6 space-y-2">
    <li th:text="${quote.modalityLabel()}">Mensualidad: todas las clases del mes</li>
    <li th:if="${quote.sessionLabel() != null}">Clase: <span th:text="${quote.sessionLabel()}">lunes 12 de octubre a las 18:00</span></li>
    <li th:text="'Sesiones del período: ' + ${quote.sessionCount()}">Sesiones del período: 4</li>
    <li>Importe: <strong th:text="${quote.amountLabel()}">$ 12.500,00</strong></li>
    <li>Válida hasta: <span th:text="${quote.expiresLabel()}">sábado 10 de octubre a las 10:00</span></li>
</ul>

<div th:if="${quote.unavailable()}" class="mb-6">
    <div th:replace="~{fragments/components :: alert('error', 'Sin lugares disponibles: por ahora no podés pagar esta cotización.')}"></div>
</div>

<div th:unless="${quote.unavailable()}" class="mb-6 flex flex-wrap gap-3">
    <form th:action="@{/compras}" method="post">
        <input type="hidden" name="quoteId" th:value="${quote.quoteId()}">
        <input type="hidden" name="courseId" th:value="${quote.courseId()}">
        <input type="hidden" name="idempotencyKey" th:value="${quote.idempotencyKey()}">
        <button type="submit" class="btn btn-primary">Pagar con Mercado Pago</button>
    </form>

    <form th:action="@{/compras/transferencia}" method="post">
        <input type="hidden" name="quoteId" th:value="${quote.quoteId()}">
        <input type="hidden" name="courseId" th:value="${quote.courseId()}">
        <input type="hidden" name="idempotencyKey" th:value="${quote.transferIdempotencyKey()}">
        <button type="submit" class="btn btn-secondary">Pagar por transferencia bancaria</button>
    </form>
</div>

<p><a th:href="@{/classes/{id}(id=${quote.courseId()})}">Volver a la clase</a></p>
</th:block>
</body>
</html>
