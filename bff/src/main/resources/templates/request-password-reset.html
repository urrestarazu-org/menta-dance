<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - Menta Dance</title>
</head>
<body>
<h1>Recuperar contraseña</h1>

<p>Ingresá el email de tu cuenta y, si existe, te enviamos un enlace para elegir una contraseña nueva.</p>

<p th:if="${formError}" th:text="${formError}" role="alert">Error</p>

<form th:action="@{/recuperar-contrasena}" th:object="${form}" method="post" novalidate>
    <div>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" th:value="*{email}" required autofocus/>
        <p th:each="message : ${#fields.errors('email')}" th:text="${message}">Error del email</p>
    </div>

    <button type="submit">Enviar enlace</button>
</form>

<p><a th:href="@{/login}">Volver a iniciar sesión</a></p>
</body>
</html>
