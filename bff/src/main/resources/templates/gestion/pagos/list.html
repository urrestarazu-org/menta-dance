<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/management :: page('Pagos', 'payments', ~{::main-content})}">
<body>
<th:block th:fragment="main-content">
<h1 class="mb-6">Pagos</h1>

<div th:if="${paymentsSaved}" class="mb-4">
    <div th:replace="~{fragments/components :: alert('success', ${paymentsSaved})}"></div>
</div>
<div th:if="${paymentsError}" class="mb-4">
    <div th:replace="~{fragments/components :: alert('error', ${paymentsError})}"></div>
</div>
<div th:if="${payments.unavailable()}" class="mb-4">
    <div th:replace="~{fragments/components :: alert('error', ${unavailableMessage})}"></div>
</div>
<div th:if="${payments.empty()}" class="mb-4">
    <div th:replace="~{fragments/components :: alert('info', 'No hay pagos pendientes de verificación.')}"></div>
</div>

<div th:unless="${payments.rows().isEmpty()}" class="overflow-x-auto" role="region" aria-label="Listado de pagos pendientes" tabindex="0">
    <table class="w-full text-left">
        <caption class="mb-2 text-left font-semibold">
            Pagos pendientes de verificación (<span th:text="${payments.totalElements()}">0</span> en total)
        </caption>
        <thead>
        <tr class="border-b border-brand-deep/30">
            <th scope="col" class="p-3 font-semibold">Alumno</th>
            <th scope="col" class="p-3 font-semibold">Monto</th>
            <th scope="col" class="p-3 font-semibold">Fecha</th>
            <th scope="col" class="p-3 font-semibold">Medio</th>
            <th scope="col" class="p-3 font-semibold">Modalidad</th>
            <th scope="col" class="p-3 font-semibold">Detalle</th>
        </tr>
        </thead>
        <tbody class="divide-y divide-brand-deep/15">
        <tr th:each="row : ${payments.rows()}">
            <td class="p-3" th:text="${row.studentLabel()}">5b6f7c8e</td>
            <td class="p-3 whitespace-nowrap" th:text="${row.amountLabel()}">25.000,00 ARS</td>
            <td class="p-3 whitespace-nowrap">
                <time th:datetime="${row.createdAt()}" th:text="${row.createdLabel()}">20 de noviembre de 2026, 23:30</time>
            </td>
            <td class="p-3" th:text="${row.methodLabel()}">Transferencia</td>
            <td class="p-3" th:text="${row.modalityLabel()}">Presencial</td>
            <td class="p-3">
                <a th:href="@{/gestion/pagos/{id}(id=${row.paymentId()})}">Ver<span class="sr-only" th:text="| el pago de ${row.studentLabel()}|"> el pago de 5b6f7c8e</span></a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<nav th:if="${payments.paginated()}" aria-label="Paginación de pagos" class="mt-6">
    <ul class="m-0 flex list-none flex-wrap items-center gap-6 p-0">
        <li>
            <a th:if="${payments.hasPrevious()}" rel="prev"
               th:href="@{/gestion/pagos(page=${payments.page() - 1},size=${payments.size()})}">Anterior</a>
            <a th:unless="${payments.hasPrevious()}" role="link" aria-disabled="true"
               class="cursor-not-allowed text-brand-deep/70 no-underline">Anterior</a>
        </li>
        <li><span aria-current="page" th:text="|Página ${payments.page() + 1} de ${payments.totalPages()}|">Página 1 de 3</span></li>
        <li>
            <a th:if="${payments.hasNext()}" rel="next"
               th:href="@{/gestion/pagos(page=${payments.page() + 1},size=${payments.size()})}">Siguiente</a>
            <a th:unless="${payments.hasNext()}" role="link" aria-disabled="true"
               class="cursor-not-allowed text-brand-deep/70 no-underline">Siguiente</a>
        </li>
    </ul>
</nav>
</th:block>
</body>
</html>
