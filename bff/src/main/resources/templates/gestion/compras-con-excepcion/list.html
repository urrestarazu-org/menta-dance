<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/management :: page('Compras con excepción', 'exception-purchases', ~{::main-content})}">
<body>
<th:block th:fragment="main-content">
<h1 class="mb-6">Compras con excepción</h1>

<div th:if="${purchasesSaved}" class="mb-4">
    <div th:replace="~{fragments/components :: alert('success', ${purchasesSaved})}"></div>
</div>
<div th:if="${purchasesError}" class="mb-4">
    <div th:replace="~{fragments/components :: alert('error', ${purchasesError})}"></div>
</div>
<div th:if="${purchases.unavailable()}" class="mb-4">
    <div th:replace="~{fragments/components :: alert('error', ${unavailableMessage})}"></div>
</div>
<div th:if="${purchases.empty()}" class="mb-4">
    <div th:replace="~{fragments/components :: alert('info', 'No hay compras con excepción para resolver.')}"></div>
</div>

<div th:unless="${purchases.rows().isEmpty()}" class="overflow-x-auto" role="region" aria-label="Listado de compras con excepción" tabindex="0">
    <table class="w-full text-left">
        <caption class="mb-2 text-left font-semibold">
            Compras con excepción (<span th:text="${purchases.totalElements()}">0</span> en total)
        </caption>
        <thead>
        <tr class="border-b border-brand-deep/30">
            <th scope="col" class="p-3 font-semibold">Alumno</th>
            <th scope="col" class="p-3 font-semibold">Modalidad</th>
            <th scope="col" class="p-3 font-semibold">Monto</th>
            <th scope="col" class="p-3 font-semibold">Fecha</th>
            <th scope="col" class="p-3 font-semibold">Sesiones afectadas</th>
            <th scope="col" class="p-3 font-semibold">Estado</th>
            <th scope="col" class="p-3 font-semibold">Resolución</th>
        </tr>
        </thead>
        <tbody class="divide-y divide-brand-deep/15">
        <tr th:each="row, iter : ${purchases.rows()}"
            th:with="active=${resolvingPurchaseId != null and resolvingPurchaseId == row.purchaseId()},
                     resolutionId='resolve-resolution-' + ${iter.index}, noteId='resolve-note-' + ${iter.index}">
            <td class="p-3" th:text="${row.studentLabel()}">5b6f7c8e</td>
            <td class="p-3" th:text="${row.modalityLabel()}">Presencial</td>
            <td class="p-3 whitespace-nowrap" th:text="${row.amountLabel()}">25.000,00 ARS</td>
            <td class="p-3 whitespace-nowrap">
                <time th:datetime="${row.createdAt()}" th:text="${row.createdLabel()}">20 de noviembre de 2026, 23:30</time>
            </td>
            <td class="p-3" th:text="${row.sessionCount()}">2</td>
            <td class="p-3"><span class="badge badge-neutral" th:text="${row.statusLabel()}">En excepción</span></td>
            <td class="p-3">
                <details th:open="${active}">
                    <summary>Resolver<span class="sr-only" th:text="| la compra de ${row.studentLabel()}|"> la compra de 5b6f7c8e</span></summary>
                    <form th:action="@{/gestion/compras-con-excepcion/{id}/resolver(id=${row.purchaseId()},page=${purchases.page()},size=${purchases.size()})}"
                          th:object="${resolveForm}" method="post" novalidate class="mt-3 space-y-4">
                        <th:block th:if="${active}">
                            <div th:replace="~{fragments/components :: errorSummary(${ {'resolution':resolutionId,'note':noteId} })}"></div>
                        </th:block>
                        <div th:replace="~{fragments/components :: selectField(${resolutionId}, 'Resolución', 'resolution', ${ {'REFUNDED':'Reembolsada','COMPENSATED':'Compensada'} }, ${active ? resolveForm.resolution : null}, 'Elegí una resolución', null, ${active ? #fields.errors('resolution') : null})}"></div>
                        <div th:replace="~{fragments/components :: limitedTextareaField(${noteId}, 'Nota de la resolución', 'note', ${active ? resolveForm.note : null}, 3, 500, 'Queda en el registro de auditoría. Hasta 500 caracteres.', ${active ? #fields.errors('note') : null})}"></div>
                        <button type="submit" class="btn btn-primary">Resolver compra</button>
                    </form>
                </details>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<nav th:if="${purchases.paginated()}" aria-label="Paginación de compras con excepción" class="mt-6">
    <ul class="m-0 flex list-none flex-wrap items-center gap-6 p-0">
        <li>
            <a th:if="${purchases.hasPrevious()}" rel="prev"
               th:href="@{/gestion/compras-con-excepcion(page=${purchases.page() - 1},size=${purchases.size()})}">Anterior</a>
            <a th:unless="${purchases.hasPrevious()}" role="link" aria-disabled="true"
               class="cursor-not-allowed text-brand-deep/70 no-underline">Anterior</a>
        </li>
        <li><span aria-current="page" th:text="|Página ${purchases.page() + 1} de ${purchases.totalPages()}|">Página 1 de 3</span></li>
        <li>
            <a th:if="${purchases.hasNext()}" rel="next"
               th:href="@{/gestion/compras-con-excepcion(page=${purchases.page() + 1},size=${purchases.size()})}">Siguiente</a>
            <a th:unless="${purchases.hasNext()}" role="link" aria-disabled="true"
               class="cursor-not-allowed text-brand-deep/70 no-underline">Siguiente</a>
        </li>
    </ul>
</nav>
</th:block>
</body>
</html>
