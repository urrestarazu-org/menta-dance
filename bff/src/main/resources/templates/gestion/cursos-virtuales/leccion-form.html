<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/management :: page(${editing} ? 'Editar lección' : 'Nueva lección', 'cursos-virtuales', ~{::main-content})}">
<body>
<th:block th:fragment="main-content">
<div>
    <h1 class="mb-6" th:text="${editing} ? 'Editar lección' : 'Nueva lección'">Nueva lección</h1>

    <div th:if="${formError}" class="mb-4">
        <div th:replace="~{fragments/components :: alert('error', ${formError})}"></div>
    </div>

    <form th:action="${editing} ? @{/gestion/cursos-virtuales/{id}/modulos/{module}/lecciones/{lesson}/editar(id=${courseId},module=${moduleId},lesson=${lessonId})} : @{/gestion/cursos-virtuales/{id}/modulos/{module}/lecciones(id=${courseId},module=${moduleId})}"
          th:object="${form}" method="post" novalidate class="card space-y-4">
        <div th:replace="~{fragments/components :: errorSummary(${ {'title':'title', 'description':'description', 'videoId':'videoId', 'videoIdManual':'videoIdManual', 'durationMinutes':'durationMinutes'} })}"></div>

        <div th:replace="~{fragments/components :: field('title', 'Título', 'text', 'title', 'off', *{title}, null, ${!#fields.hasErrors('*')}, ${#fields.errors('title')})}"></div>
        <div th:replace="~{fragments/components :: limitedTextareaField('description', 'Descripción', 'description', *{description}, 6, 5000, 'Hasta 5000 caracteres.', ${#fields.errors('description')})}"></div>
        <!--/*
          Video of the lesson (#843). The library list is a plain <select>, so picking and saving work without
          JavaScript; the state of each video is in the text of its option. The preview and the warning below it are
          rendered by the server for the video that is selected when the page is shown (they do not change on their
          own when another option is picked: the label of every option already carries the state). The text field
          for a pasted identifier lives in a <details>, collapsed unless the list is down or it has something to
          show, and the pasted identifier wins over the picked one.
        */-->
        <div class="field">
            <th:block th:if="${videos.available()}">
                <label class="field-label" for="videoId">Video de la lección (opcional)</label>
                <select class="field-input" id="videoId" name="videoId"
                        th:attr="aria-invalid=${#fields.hasErrors('videoId')} ? 'true' : null,
                                 aria-describedby='videoId-help videoId-status'">
                    <option value="" th:if="${!videos.hasSelection() or !editing}">Sin video por ahora</option>
                    <option th:each="option : ${videos.options()}" th:value="${option.videoId()}"
                            th:text="${option.label()}" th:selected="${option.videoId() == videos.selectedId()}">Abrazo — Listo, con MP4</option>
                </select>
                <div th:replace="~{fragments/components :: fieldHelp('videoId', ${editing and videos.hasSelection()} ? 'Si no elegís otro video, no se cambia el video asignado.' : 'Elegí un video ya cargado; podés dejarlo para después.', ${#fields.errors('videoId')})}"></div>
                <p class="mt-1 text-sm" th:if="${videos.truncated()}"
                   th:text="|Se muestran los 100 videos más recientes de los ${videos.totalElements()} de la biblioteca. Si no está el que buscás, pegá su identificador abajo.|">Se muestran los 100 videos más recientes de los 250 de la biblioteca.</p>
                <div id="videoId-status" class="mt-3 flex flex-wrap items-start gap-4">
                    <th:block th:if="${videos.hasSelection()}">
                        <img th:if="${videos.selected().thumbnailUrl() != null}" class="preview-image"
                             th:src="${videos.selected().thumbnailUrl()}" alt="" width="160" height="90" loading="lazy"/>
                        <th:block th:if="${videos.selected().thumbnailUrl() == null and videos.selected().missingInLibrary()}">
                            <div th:replace="~{fragments/admin :: previewNotice('danger', 'warning', 'Este video ya no existe en la biblioteca.')}"></div>
                        </th:block>
                        <th:block th:if="${videos.selected().thumbnailUrl() == null and !videos.selected().missingInLibrary()}">
                            <div th:replace="~{fragments/admin :: previewNotice('neutral', 'video', 'Sin miniatura')}"></div>
                        </th:block>
                        <div class="min-w-[15rem] flex-1 space-y-2">
                            <p><span class="font-medium">Video elegido:</span> <span class="break-words" th:text="${videos.selected().label()}">Abrazo — Listo, con MP4</span></p>
                            <div th:if="${videos.selected().warning() != null}">
                                <div th:replace="~{fragments/components :: alert('warning', ${videos.selected().warning()})}"></div>
                            </div>
                        </div>
                    </th:block>
                    <th:block th:unless="${videos.hasSelection()}">
                        <div th:replace="~{fragments/admin :: previewNotice('warning', 'video', 'Esta lección no tiene video asociado por el momento.')}"></div>
                    </th:block>
                </div>
            </th:block>
            <th:block th:if="${videos.unavailable()}">
                <div th:replace="~{fragments/components :: alert('warning', 'No pudimos cargar la lista de videos. Podés guardar la lección igual: pegá el identificador del video en el campo de abajo o dejalo vacío.')}"></div>
                <div th:if="${form.resolvedVideoId() == null}" class="mt-3">
                    <div th:replace="~{fragments/admin :: previewNotice('warning', 'video', 'Esta lección no tiene video asociado por el momento.')}"></div>
                </div>
            </th:block>
            <details class="mt-3" th:open="${videos.unavailable() or #fields.hasErrors('videoIdManual') or (form.videoIdManual != null and !form.videoIdManual.isEmpty())}">
                <summary class="cursor-pointer py-2 font-medium">Pegar un identificador</summary>
                <div th:replace="~{fragments/components :: optionalField('videoIdManual', 'Identificador del video (opcional)', 'text', 'videoIdManual', 'off', ${videos.unavailable()} ? ${form.resolvedVideoId()} : *{videoIdManual}, ${editing} ? 'Si lo dejás vacío no se cambia el video asignado.' : 'Es el identificador de un video ya cargado; podés dejarlo para después.', false, ${#fields.errors('videoIdManual')})}"></div>
            </details>
        </div>
        <div th:replace="~{fragments/components :: optionalField('durationMinutes', 'Duración (minutos)', 'number', 'durationMinutes', 'off', *{durationMinutes}, 'Un número entero de 0 a 9999.', false, ${#fields.errors('durationMinutes')})}"></div>
        <div th:replace="~{fragments/components :: checkboxField('free', 'Lección gratuita: se puede ver sin suscripción', 'free', *{free}, null, null)}"></div>

        <div class="flex items-center gap-4">
            <button type="submit" class="btn btn-primary" th:text="${editing} ? 'Guardar cambios' : 'Crear lección'">Crear lección</button>
            <a th:href="@{/gestion/cursos-virtuales/{id}/estructura(id=${courseId})}">Cancelar</a>
        </div>
    </form>
</div>
</th:block>
</body>
</html>
