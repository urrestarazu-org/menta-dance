<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/management :: page('Cursos virtuales', 'cursos-virtuales', ~{::main-content})}">
<body>
<th:block th:fragment="main-content">
<div class="mb-6 flex flex-wrap items-center justify-between gap-4">
    <h1>Cursos virtuales</h1>
    <a class="btn btn-primary" th:href="@{/gestion/cursos-virtuales/nuevo}">Nuevo curso</a>
</div>

<div th:if="${virtualCourseSaved}" class="mb-4">
    <div th:replace="~{fragments/components :: alert('success', ${virtualCourseSaved})}"></div>
</div>

<div th:if="${courses.unavailable()}" class="mb-4">
    <div th:replace="~{fragments/components :: alert('error', ${unavailableMessage})}"></div>
</div>
<div th:if="${courses.empty()}" class="mb-4">
    <div th:replace="~{fragments/components :: alert('info', 'Todavía no hay cursos virtuales.')}"></div>
</div>

<div th:unless="${courses.rows().isEmpty()}" class="overflow-x-auto" role="region" aria-label="Listado de cursos virtuales" tabindex="0">
    <table class="w-full text-left">
        <caption class="mb-2 text-left font-semibold">
            Cursos virtuales (<span th:text="${courses.rows().size()}">0</span>)
        </caption>
        <thead>
        <tr class="border-b border-brand-deep/30">
            <th scope="col" class="p-3 font-semibold">Curso</th>
            <th scope="col" class="p-3 font-semibold">Categoría</th>
            <th scope="col" class="p-3 font-semibold">Nivel</th>
            <th scope="col" class="p-3 font-semibold">Estado</th>
            <th scope="col" class="p-3 font-semibold">Acceso</th>
            <th scope="col" class="p-3 font-semibold">Acciones</th>
        </tr>
        </thead>
        <tbody class="divide-y divide-brand-deep/15">
        <tr th:each="row : ${courses.rows()}">
            <th scope="row" class="p-3 font-medium" th:text="${row.title()}">Tango base</th>
            <td class="p-3" th:text="${row.category()}">Tango</td>
            <td class="p-3" th:text="${row.levelLabel()}">Principiante</td>
            <td class="p-3">
                <span class="badge badge-neutral" th:text="${row.statusLabel()}">Borrador</span>
            </td>
            <td class="p-3" th:text="${row.premium()} ? 'Premium' : 'Gratuito'">Gratuito</td>
            <td class="p-3 whitespace-nowrap">
                <a th:href="@{/gestion/cursos-virtuales/{id}/editar(id=${row.courseId()})}">Editar<span class="sr-only" th:text="| el curso ${row.title()}|"> el curso Tango base</span></a>
                ·
                <a th:href="@{/gestion/cursos-virtuales/{id}/estructura(id=${row.courseId()})}">Estructura<span class="sr-only" th:text="| del curso ${row.title()}|"> del curso Tango base</span></a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</th:block>
</body>
</html>
