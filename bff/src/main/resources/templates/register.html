<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - Menta Dance</title>
</head>
<body>
<h1>Crear cuenta</h1>

<p th:if="${formError}" th:text="${formError}" role="alert">Error</p>

<form th:action="@{/registro}" th:object="${form}" method="post" novalidate>
    <div>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" th:value="*{email}" required autofocus/>
        <p th:each="message : ${#fields.errors('email')}" th:text="${message}">Error del email</p>
    </div>

    <div>
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required/>
        <small>Al menos 8 caracteres, una mayúscula y un número.</small>
        <p th:each="message : ${#fields.errors('password')}" th:text="${message}">Error de la contraseña</p>
    </div>

    <button type="submit">Crear cuenta</button>
</form>

<p>¿Ya tenés cuenta? <a th:href="@{/login}">Iniciá sesión</a></p>
<p>¿No te llegó el correo de activación? <a th:href="@{/reenviar-activacion}">Reenviar activación</a></p>
</body>
</html>
