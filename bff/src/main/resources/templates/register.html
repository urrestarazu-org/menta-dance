<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: auth('Crear cuenta', ~{::main-content}, 'Creá tu cuenta para empezar a bailar, con clases online y presenciales.')}">
<body>
<th:block th:fragment="main-content">
<div class="mx-auto max-w-sm">
    <h1 class="mb-6">Crear cuenta</h1>

    <div th:if="${formError}" class="mb-4">
        <div th:replace="~{fragments/components :: alert('error', ${formError})}"></div>
    </div>

    <form th:action="@{/registro}" th:object="${form}" method="post" novalidate class="card space-y-4">
        <div th:replace="~{fragments/components :: field('firstName', 'Nombre', 'text', 'firstName', 'given-name', *{firstName}, null, true, ${#fields.errors('firstName')})}"></div>
        <div th:replace="~{fragments/components :: field('lastName', 'Apellido', 'text', 'lastName', 'family-name', *{lastName}, null, false, ${#fields.errors('lastName')})}"></div>
        <div th:replace="~{fragments/components :: field('email', 'Email', 'email', 'email', 'username', *{email}, null, false, ${#fields.errors('email')})}"></div>
        <div th:replace="~{fragments/components :: field('phone', 'Teléfono', 'tel', 'phone', 'tel', *{phone}, 'Con código de país, por ejemplo +54 9 11 0000 0000', false, ${#fields.errors('phone')})}"></div>
        <div th:replace="~{fragments/components :: optionalField('birthDate', 'Fecha de nacimiento (opcional)', 'date', 'birthDate', 'bday', *{birthDate}, 'Elegila en el calendario. Si escribís la fecha, usá el formato AAAA-MM-DD.', false, ${#fields.errors('birthDate')})}"></div>
        <div th:replace="~{fragments/components :: field('password', 'Contraseña', 'password', 'password', 'new-password', null, 'Al menos 8 caracteres, una mayúscula y un número.', false, ${#fields.errors('password')})}"></div>
        <div th:replace="~{fragments/components :: field('passwordConfirmation', 'Repetí la contraseña', 'password', 'passwordConfirmation', 'new-password', null, null, false, ${#fields.errors('passwordConfirmed')})}"></div>

        <button type="submit" class="btn btn-primary w-full">Crear cuenta</button>
    </form>

    <p class="mt-6">¿Ya tenés cuenta? <a th:href="@{/login}">Iniciá sesión</a></p>
    <p class="mt-2">¿No te llegó el correo de activación? <a th:href="@{/reenviar-activacion}">Reenviar activación</a></p>
</div>
</th:block>
</body>
</html>
