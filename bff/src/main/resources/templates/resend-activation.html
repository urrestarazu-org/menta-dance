<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Reenviar activación', ~{::main-content})}">
<body>
<th:block th:fragment="main-content">
<div class="mx-auto max-w-sm">
    <h1 class="mb-6">Reenviar activación</h1>

    <p class="mb-4">Ingresá el email con el que te registraste y, si la cuenta está pendiente de activación,
        te enviamos un nuevo enlace.</p>

    <div th:if="${formError}" class="mb-4">
        <div th:replace="~{fragments/components :: alert('error', ${formError})}"></div>
    </div>

    <form th:action="@{/reenviar-activacion}" th:object="${form}" method="post" novalidate class="card space-y-4">
        <div th:replace="~{fragments/components :: field('email', 'Email:', 'email', 'email', 'username', *{email}, null, true, ${#fields.errors('email')})}"></div>

        <button type="submit" class="btn btn-primary w-full">Reenviar activación</button>
    </form>

    <p class="mt-6"><a th:href="@{/login}">Volver a iniciar sesión</a></p>
</div>
</th:block>
</body>
</html>
