<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Nueva contraseña - Menta Dance</title>
</head>
<body>
<h1>Elegí una contraseña nueva</h1>

<p th:if="${formError}" th:text="${formError}" role="alert">Error</p>

<div th:if="${invalidToken}">
    <p role="alert">El enlace de recuperación es inválido, venció o ya fue utilizado.</p>
    <p>Podés pedir uno nuevo: <a th:href="@{/recuperar-contrasena}">Recuperar contraseña</a>.</p>
</div>

<form th:unless="${invalidToken}" th:action="@{/restablecer-contrasena}" th:object="${form}" method="post" novalidate>
    <input type="hidden" name="token" th:value="*{token}"/>

    <div>
        <label for="password">Contraseña nueva:</label>
        <input type="password" id="password" name="password" required autofocus autocomplete="new-password"/>
        <small>Al menos 8 caracteres, una mayúscula y un número.</small>
        <p th:each="message : ${#fields.errors('password')}" th:text="${message}">Error de la contraseña</p>
    </div>

    <div>
        <label for="passwordConfirmation">Repetí la contraseña:</label>
        <input type="password" id="passwordConfirmation" name="passwordConfirmation" required
               autocomplete="new-password"/>
        <p th:each="message : ${#fields.errors('passwordConfirmed')}" th:text="${message}">Error de confirmación</p>
    </div>

    <button type="submit">Cambiar contraseña</button>
</form>
</body>
</html>
