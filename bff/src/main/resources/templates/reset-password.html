<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: auth('Nueva contraseña', ~{::main-content}, 'Academia de danza con clases online y presenciales.')}">
<body>
<th:block th:fragment="main-content">
<div class="mx-auto max-w-sm">
    <h1 class="mb-6">Elegí una contraseña nueva</h1>

    <div th:if="${formError}" class="mb-4">
        <div th:replace="~{fragments/components :: alert('error', ${formError})}"></div>
    </div>

    <div th:if="${invalidToken}">
        <div class="mb-4">
            <div th:replace="~{fragments/components :: alert('error', 'El enlace de recuperación es inválido, venció o ya fue utilizado.')}"></div>
        </div>
        <p>Podés pedir uno nuevo: <a th:href="@{/recuperar-contrasena}">Recuperar contraseña</a>.</p>
    </div>

    <form th:unless="${invalidToken}" th:action="@{/restablecer-contrasena}" th:object="${form}" method="post" novalidate class="card space-y-4">
        <input type="hidden" name="token" th:value="*{token}"/>

        <div th:replace="~{fragments/components :: field('password', 'Contraseña nueva', 'password', 'password', 'new-password', null, 'Al menos 8 caracteres, una mayúscula y un número.', true, ${#fields.errors('password')})}"></div>
        <div th:replace="~{fragments/components :: field('passwordConfirmation', 'Repetí la contraseña', 'password', 'passwordConfirmation', 'new-password', null, null, false, ${#fields.errors('passwordConfirmed')})}"></div>

        <button type="submit" class="btn btn-primary w-full">Cambiar contraseña</button>
    </form>
</div>
</th:block>
</body>
</html>
