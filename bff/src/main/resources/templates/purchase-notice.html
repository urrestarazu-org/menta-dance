<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(${title}, ~{::main-content})}">
<body>
<th:block th:fragment="main-content">
<nav aria-label="Ruta de navegación" class="mb-6"><a th:href="@{${breadcrumbHref != null ? breadcrumbHref : '/classes'}}" th:text="${breadcrumbLabel != null ? breadcrumbLabel : 'Clases presenciales'}">Clases presenciales</a></nav>

<h1 class="mb-6" th:text="${title}">Compra</h1>
<div class="mb-6">
    <div th:replace="~{fragments/components :: alert(${failure} ? 'error' : 'info', ${message})}"></div>
</div>

<section th:if="${not #lists.isEmpty(assignedSessions)}" id="assigned-sessions" aria-labelledby="assigned-sessions-title" class="mb-6">
    <h2 id="assigned-sessions-title" class="mb-3">Tus próximas sesiones</h2>
    <ul class="card space-y-2">
        <li th:each="row : ${assignedSessions}">
            <strong th:text="${row.courseName}">Salsa</strong> -
            <span th:text="${row.momentLabel}">lunes 19 de octubre a las 18:00</span>
        </li>
    </ul>
</section>

<p><a class="btn btn-primary" th:href="@{${linkHref}}" th:text="${linkLabel}">Volver</a></p>
</th:block>
</body>
</html>
