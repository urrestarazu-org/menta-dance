<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Menta Dance'">Compra - Menta Dance</title>
</head>
<body>
<nav><a th:href="@{/classes}">Clases presenciales</a></nav>

<h1 th:text="${title}">Compra</h1>
<p th:text="${message}">Mensaje</p>

<section th:if="${not #lists.isEmpty(assignedSessions)}" id="assigned-sessions">
    <h2>Tus próximas sesiones</h2>
    <ul>
        <li th:each="row : ${assignedSessions}">
            <strong th:text="${row.courseName}">Salsa</strong> -
            <span th:text="${row.momentLabel}">lunes 19 de octubre a las 18:00</span>
        </li>
    </ul>
</section>

<p><a th:href="@{${linkHref}}" th:text="${linkLabel}">Volver</a></p>
</body>
</html>
