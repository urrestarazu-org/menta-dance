<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Error', ~{::main-content})}">
<body>
<th:block th:fragment="main-content">
<div class="mx-auto max-w-sm">
    <h1 class="mb-6">Error</h1>

    <div class="card space-y-2" role="alert">
        <p th:if="${status}" th:text="'Status: ' + ${status}">Status</p>
        <p th:if="${error}" th:text="'Error: ' + ${error}">Error</p>
        <p th:if="${message}" th:text="'Message: ' + ${message}">Message</p>
    </div>

    <p class="mt-6"><a th:href="@{/}">Go to Home</a></p>
</div>
</th:block>
</body>
</html>
