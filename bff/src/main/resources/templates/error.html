<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Error', ~{::main-content})}">
<body>
<th:block th:fragment="main-content">
<div class="mx-auto max-w-sm">
    <div class="mb-6">
        <video class="brand-motion" aria-hidden="true" autoplay muted loop playsinline preload="metadata" width="480" height="270"
               th:poster="@{/images/brand/menta-wordmark.png}">
            <source th:src="@{/images/brand/menta-animado.mp4}" type="video/mp4">
        </video>
        <img class="brand-still" th:src="@{/images/brand/menta-wordmark.png}" alt="Menta Dance" width="600" height="341">
    </div>

    <h1 class="mb-6">No pudimos mostrar la página</h1>

    <div class="card space-y-2" role="alert">
        <p th:if="${status == 404}">No encontramos la página que buscás.</p>
        <p th:unless="${status == 404}">Algo salió mal de nuestro lado. Intentá nuevamente en unos minutos.</p>
        <p class="text-sm" th:if="${status}" th:text="'Código: ' + ${status}">Código: 500</p>
    </div>

    <p class="mt-6"><a class="btn btn-primary" th:href="@{/}">Volver al inicio</a></p>
</div>
</th:block>
</body>
</html>
