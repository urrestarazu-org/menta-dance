<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Menta Dance</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        .error { background-color: #ffebee; color: #c62828; padding: 10px; border-radius: 4px; margin-bottom: 20px; }
        .info { background-color: #e8f5e9; color: #2e7d32; padding: 10px; border-radius: 4px; margin-bottom: 20px; }
        input { width: 100%; padding: 8px; margin: 5px 0 15px 0; }
        button { width: 100%; padding: 10px; background-color: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #1565c0; }
    </style>
</head>
<body>
<h1>Iniciar Sesión</h1>

<div th:if="${error}" class="error">
    <p th:text="${errorMessage}">Error message</p>
</div>

<div th:if="${logout}" class="info">
    <p th:text="${logoutMessage}">Logout message</p>
</div>

<form th:action="@{/login}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <div>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required autofocus/>
    </div>

    <div>
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required/>
    </div>

    <button type="submit">Iniciar Sesión</button>
</form>
</body>
</html>
