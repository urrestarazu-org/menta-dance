<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Menta Dance</title>
    <th:block th:replace="~{fragments/head :: assets}"></th:block>
</head>
<body class="mx-auto max-w-sm px-4 py-12">
<h1 class="mb-6">Iniciar Sesión</h1>

<div th:if="${error}" class="mb-4 rounded border border-red-800 bg-red-50 p-3 text-red-900" role="alert">
    <p th:text="${error}">Error message</p>
    <p th:if="${resendActivationLink}"><a th:href="@{/reenviar-activacion}">Reenviar el correo de activación</a></p>
</div>

<div th:if="${logout}" class="mb-4 rounded border border-brand-action bg-brand-light/40 p-3 text-brand-deep" role="status">
    <p th:text="${logout}">Logout message</p>
</div>

<div th:if="${resetNotice}" class="mb-4 rounded border border-brand-action bg-brand-light/40 p-3 text-brand-deep" role="status">
    <p th:text="${resetNotice}">Reset notice</p>
</div>

<form th:action="@{/login}" method="post" class="space-y-4">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <div>
        <label for="email" class="block font-medium">Email:</label>
        <input type="email" id="email" name="email" class="mt-1 block w-full rounded border-brand-deep" required autofocus/>
    </div>

    <div>
        <label for="password" class="block font-medium">Contraseña:</label>
        <input type="password" id="password" name="password" class="mt-1 block w-full rounded border-brand-deep" required/>
    </div>

    <button type="submit"
            class="w-full rounded bg-brand-action px-4 py-2 font-semibold text-white hover:bg-brand-deep">Iniciar Sesión</button>
</form>

<p class="mt-6"><a th:href="@{/recuperar-contrasena}">¿Olvidaste tu contraseña?</a></p>
</body>
</html>
