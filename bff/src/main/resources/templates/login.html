<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: auth('Iniciar Sesión', ~{::main-content}, 'Iniciá sesión para continuar con tus clases. Nuevas clases y coreografías te esperan.')}">
<body>
<th:block th:fragment="main-content">
<div class="mx-auto max-w-sm">
    <h1 class="mb-6">Iniciar Sesión</h1>

    <div th:if="${error}" class="alert alert-error mb-4" role="alert">
        <p th:text="${error}">Error message</p>
        <p th:if="${resendActivationLink}"><a th:href="@{/reenviar-activacion}">Reenviar el correo de activación</a></p>
    </div>

    <div th:if="${logout}" class="mb-4">
        <div th:replace="~{fragments/components :: alert('success', ${logout})}"></div>
    </div>

    <div th:if="${resetNotice}" class="mb-4">
        <div th:replace="~{fragments/components :: alert('success', ${resetNotice})}"></div>
    </div>

    <form th:action="@{/login}" method="post" class="card space-y-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div th:replace="~{fragments/components :: field('email', 'Email:', 'email', 'email', 'username', null, null, true, null)}"></div>
        <div th:replace="~{fragments/components :: field('password', 'Contraseña:', 'password', 'password', 'current-password', null, null, false, null)}"></div>

        <button type="submit" class="btn btn-primary w-full">Iniciar Sesión</button>
    </form>

    <p class="mt-6"><a th:href="@{/recuperar-contrasena}">¿Olvidaste tu contraseña?</a></p>
</div>
</th:block>
</body>
</html>
