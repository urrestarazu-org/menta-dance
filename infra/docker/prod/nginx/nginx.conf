# Nginx de producción (VPS DonWeb, #589 / ADR-0045).
#
# Reutiliza conf.d/ de infra/docker/nginx (upstreams, headers, locations del BFF) y agrega
# lo propio de producción: renovación del certificado por webroot, el host de la API y los
# servidores por defecto. Los certificados los emite y renueva certbot en el host; el
# contenedor solo los lee de /etc/letsencrypt (solo lectura).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    # Los enlaces del correo llevan un token de un solo uso en el path
    # (/activar/<token>, /restablecer-contrasena/<token>). Se redacta antes de escribir el
    # log para que el secreto no quede en el access log ni en el Referer.
    map $request $request_redacted {
        default "$request";
        "~^(?<verb>\S+) /(?<flow>activar|restablecer-contrasena)/\S*(?<proto> \S+)?$" "$verb /$flow/[REDACTED]$proto";
    }

    map $http_referer $referer_redacted {
        default "$http_referer";
        "~^(?<ref_base>[^?#]*/(?:activar|restablecer-contrasena))/.*$" "$ref_base/[REDACTED]";
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request_redacted" '
                    '$status $body_bytes_sent "$referer_redacted" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;

    keepalive_timeout 65;
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 60s;

    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/manifest+json
        application/wasm
        image/svg+xml
        font/woff2;

    include /etc/nginx/conf.d/upstreams.conf;

    # Rate limiting (credential stuffing y card-testing); ver infra/docker/nginx/conf/nginx.conf.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=billing:30m rate=5r/s;

    # Techo volumétrico del login web (ADR-0035): la clave se anula fuera de POST.
    map $request_method $login_post_key {
        POST    $binary_remote_addr;
        default '';
    }

    limit_req_zone $login_post_key zone=login:10m rate=2r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- Puerto 80 ---------------------------------------------------------------------------

    # Cualquier host que no sea el nuestro (escaneos por IP, dominios ajenos): se corta la conexión.
    # Excepción: /health, que usan el healthcheck del contenedor y el deploy (#593) contra
    # 127.0.0.1, un Host que no es ninguno de los nuestros.
    server {
        listen 80 default_server;
        server_name _;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 444;
        }
    }

    server {
        listen 80;
        server_name mentadance.com www.mentadance.com api.mentadance.com;

        # Desafío HTTP-01 de Let's Encrypt (certbot --webroot). La carpeta es la del host,
        # montada en solo lectura: certbot escribe, Nginx solo sirve.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- Puerto 443 --------------------------------------------------------------------------

    # Sin SNI conocido no se presenta ningún certificado.
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    # Parámetros TLS compartidos por los tres servidores HTTPS.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # www → apex
    server {
        listen 443 ssl;
        http2 on;
        server_name www.mentadance.com;

        # Un solo certificado cubre mentadance.com, www y api (certbot --cert-name mentadance.com).
        ssl_certificate /etc/letsencrypt/live/mentadance.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mentadance.com/privkey.pem;

        return 301 https://mentadance.com$request_uri;
    }

    # Web (BFF)
    server {
        listen 443 ssl;
        http2 on;
        server_name mentadance.com;

        ssl_certificate /etc/letsencrypt/live/mentadance.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mentadance.com/privkey.pem;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_hide_header X-Powered-By;
        include /etc/nginx/conf.d/security_headers.conf;

        include /etc/nginx/conf.d/locations.conf;
    }

    # API (app Android). Todo el tráfico va a la API; Actuator queda cerrado salvo /actuator/health.
    server {
        listen 443 ssl;
        http2 on;
        server_name api.mentadance.com;

        ssl_certificate /etc/letsencrypt/live/mentadance.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mentadance.com/privkey.pem;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_hide_header X-Powered-By;
        include /etc/nginx/conf.d/security_headers.conf;

        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location = /actuator/health {
            proxy_pass http://api/actuator/health;
            include /etc/nginx/conf.d/proxy_params.conf;
            access_log off;
        }

        location /actuator/ {
            return 404;
        }

        location ~ ^/api/v1/users/register {
            limit_req zone=auth burst=10 nodelay;
            limit_req_status 429;
            error_page 429 = @rate_limited;
            proxy_pass http://api;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location ~ ^/api/v1/auth/ {
            limit_req zone=auth burst=20 nodelay;
            limit_req_status 429;
            error_page 429 = @rate_limited;
            proxy_pass http://api;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location ~ ^/api/v1/billing/ {
            limit_req zone=billing burst=10;
            limit_req_status 429;
            error_page 429 = @rate_limited;
            proxy_pass http://api;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location @rate_limited {
            add_header Retry-After 1 always;
            return 429;
        }

        location / {
            proxy_pass http://api;
            include /etc/nginx/conf.d/proxy_params.conf;
        }
    }
}
