# Location blocks compartidos entre servidor HTTP y HTTPS
# Usar: include /etc/nginx/conf.d/locations.conf;

# Health endpoint de Nginx (interno, para healthcheck Docker)
location = /health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
}

# API REST (para Android, futuros clientes) con rate limiting
location /api/auth/ {
    limit_req zone=auth burst=20 nodelay;
    proxy_pass http://api;
    include /etc/nginx/conf.d/proxy_params.conf;
}

location /api/billing/ {
    limit_req zone=billing burst=10;
    proxy_pass http://api;
    include /etc/nginx/conf.d/proxy_params.conf;
}

location /api/ {
    proxy_pass http://api;
    include /etc/nginx/conf.d/proxy_params.conf;
}

# Health endpoint de API (sin logging)
location = /api/actuator/health {
    proxy_pass http://api/actuator/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    access_log off;
}

# Actuator info endpoint (solo health e info, bloqueamos el resto)
location = /api/actuator/info {
    proxy_pass http://api/actuator/info;
    include /etc/nginx/conf.d/proxy_params.conf;
}

# Bloquear todos los demás endpoints de Actuator (seguridad)
location ~ ^/api/actuator/(env|heapdump|loggers|metrics|threaddump) {
    return 403 "Forbidden\n";
    add_header Content-Type text/plain;
}

# BFF Web (Thymeleaf)
location / {
    proxy_pass http://bff;
    include /etc/nginx/conf.d/proxy_params.conf;
}

# Health endpoint de BFF (sin logging)
location = /actuator/health {
    proxy_pass http://bff/actuator/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    access_log off;
}

# Cache agresivo para estáticos (CSS, JS, imágenes)
# TODO: Implementar cache busting con hashed assets (Webpack/Vite)
location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
    proxy_pass http://bff;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # Cache headers
    expires 30d;
    add_header Cache-Control "public, immutable";

    # Deshabilitar logs para estáticos (reduce ruido)
    access_log off;
}

# Favicon (sin logging)
location = /favicon.ico {
    proxy_pass http://bff/favicon.ico;
    access_log off;
    log_not_found off;
}

# robots.txt (sin logging)
location = /robots.txt {
    proxy_pass http://bff/robots.txt;
    access_log off;
    log_not_found off;
}
