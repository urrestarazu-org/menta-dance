# Parámetros comunes de proxy para evitar repetición
# Usar: include /etc/nginx/conf.d/proxy_params.conf;

# HTTP/1.1 requerido para upgrades de WebSocket
proxy_http_version 1.1;

# Headers de proxy (preservan IP real del cliente a través del reverse proxy)
proxy_set_header Host $host;  # Hostname original del request
proxy_set_header X-Real-IP $remote_addr;  # IP del cliente
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Chain de IPs (multi-proxy)
proxy_set_header X-Forwarded-Proto $scheme;  # http o https
proxy_set_header X-Forwarded-Host $host;  # Host original

# Headers de seguridad
proxy_hide_header X-Powered-By;

# Timeouts
proxy_connect_timeout 60s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# Upgrade de WebSocket mediante map en nginx.conf
# Connection usa $connection_upgrade definido en nginx.conf
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Buffering deshabilitado para streaming SSE/WebSocket
# Evita que los eventos SSE se acumulen en el buffer
proxy_buffering off;
proxy_cache off;
