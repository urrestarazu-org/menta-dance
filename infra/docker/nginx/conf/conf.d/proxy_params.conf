# Parámetros comunes de proxy para evitar repetición
# Usar: include /etc/nginx/conf.d/proxy_params.conf;

proxy_http_version 1.1;

# Headers de proxy (preservan IP real del cliente)
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

# Headers de seguridad
proxy_hide_header X-Powered-By;

# Timeouts
proxy_connect_timeout 60s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# WebSocket/SSE support (conditional upgrade via map in nginx.conf)
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Buffering deshabilitado para SSE/WebSocket support
proxy_buffering off;
proxy_cache off;
