worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Ocultar versión de Nginx en headers de error (seguridad)
    server_tokens off;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Optimizaciones TCP
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;

    # Timeouts
    keepalive_timeout 65;
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 60s;

    # Límite de tamaño de cuerpo (10M general, relajar en locations específicas si hace falta)
    client_max_body_size 10M;

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/manifest+json
        application/wasm
        image/svg+xml
        font/woff2;

    # Incluir upstreams
    include /etc/nginx/conf.d/upstreams.conf;

    # Rate limiting zones (defensa contra credential stuffing y card-testing)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=billing:30m rate=5r/s;

    # HTTP → HTTPS redirect (deshabilitado por defecto para desarrollo)
    # Descomentar en producción con SSL
    # server {
    #     listen 80;
    #     server_name mentadance.com www.mentadance.com;
    #     return 301 https://$host$request_uri;
    # }

    # www → non-www redirect (deshabilitado por defecto)
    # Descomentar en producción con SSL
    # server {
    #     listen 443 ssl http2;
    #     server_name www.mentadance.com;
    #
    #     ssl_certificate /etc/nginx/certs/mentadance.com-fullchain.crt;
    #     ssl_certificate_key /etc/nginx/certs/mentadance.com.key;
    #
    #     return 301 https://mentadance.com$request_uri;
    # }

    # Servidor HTTP principal (desarrollo)
    server {
        listen 80;
        server_name localhost mentadance.com www.mentadance.com;

        # Security headers (HTTP)
        include /etc/nginx/conf.d/security_headers.conf;

        # Location blocks compartidos
        include /etc/nginx/conf.d/locations.conf;
    }

    # Servidor HTTPS (producción)
    # Descomentar y configurar cuando se tengan certificados SSL
    # server {
    #     listen 443 ssl http2;
    #     server_name mentadance.com;
    #
    #     # Certificados SSL (actualizar rutas según certificados reales)
    #     ssl_certificate /etc/nginx/certs/mentadance.com-fullchain.crt;
    #     ssl_certificate_key /etc/nginx/certs/mentadance.com.key;
    #
    #     # SSL/TLS moderno y seguro
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     # OCSP Stapling (opcional, requiere bundle cert)
    #     # ssl_stapling on;
    #     # ssl_stapling_verify on;
    #     # ssl_trusted_certificate /etc/nginx/certs/mentadance.com-bundle.crt;
    #
    #     # Security headers HTTPS (con HSTS)
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    #     include /etc/nginx/conf.d/security_headers.conf;
    #
    #     # Content Security Policy (ajustar según necesidades)
    #     # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;
    #
    #     # Location blocks compartidos (mismo que HTTP)
    #     include /etc/nginx/conf.d/locations.conf;
    # }
}
