worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Ocultar versión de Nginx en headers de error (seguridad)
    server_tokens off;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Optimizaciones TCP
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;

    # Timeouts
    keepalive_timeout 65;
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 60s;

    # Límite de tamaño de cuerpo (10M general, relajar en locations específicas si hace falta)
    client_max_body_size 10M;

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/manifest+json
        application/wasm
        image/svg+xml
        font/woff2;

    # Incluir upstreams
    include /etc/nginx/conf.d/upstreams.conf;

    # Rate limiting zones (defensa contra credential stuffing y card-testing)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=billing:30m rate=5r/s;

    # TLS and HTTP-to-HTTPS redirects are defined in nginx.production.conf.
    # Local development intentionally runs without certificates.

    # Servidor HTTP principal (solo desarrollo local con localhost)
    server {
        listen 80;
        server_name localhost;

        # Security headers (HTTP)
        include /etc/nginx/conf.d/security_headers.conf;

        # Location blocks compartidos
        include /etc/nginx/conf.d/locations.conf;
    }

}
