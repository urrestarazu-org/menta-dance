spring:
  application:
    name: menta-dance-api

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/menta}
    username: ${MYSQL_APP_USER:menta_app}
    password: ${MYSQL_APP_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: menta

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${SMTP_TIMEOUT_MS:5000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT_MS:5000}

# Auth module configuration (ADR-0025, ADR-0026)
auth:
  # Base64-encoded HMAC-SHA256 secret. MUST be at least 32 bytes raw (256-bit).
  # Override via .env in production. The default is a dev-only placeholder so
  # tests can construct JwtService without external config.
  jwt:
    base64-secret: ${AUTH_JWT_BASE64_SECRET:ZGV2LW9ubHktc2VjcmV0LXdpdGgtMzItYnl0ZXMtbWluaW11bS0zMmJ5dGVzLW1pbmltdW0tMzJieXRlcw==}
  access-token-ttl-seconds: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:900}
  # Peers allowed to declare the originating client (ADR-0035). Only NGINX and
  # the BFF forward on a client's behalf; a request from anywhere else has its
  # forwarded headers ignored in favour of the observed peer address.
  #
  # The Docker-wide default below is a development convenience, NOT a safe
  # production value: it trusts every container on the bridge network. Narrow
  # it per environment to the actual proxy addresses.
  trusted-proxy-cidrs: ${AUTH_TRUSTED_PROXY_CIDRS:172.16.0.0/12}
  activation:
    # Deprecated in favour of auth.trusted-proxy-cidrs (ADR-0035); still read as
    # a fallback so existing deployments keep working.
    trusted-proxy-cidrs: ${AUTH_ACTIVATION_TRUSTED_PROXY_CIDRS:172.16.0.0/12}
    # ISO-8601 duration for a freshly-issued activation token TTL
    # (design.md decision #3: 24h default, configurable).
    token-ttl: ${AUTH_ACTIVATION_TOKEN_TTL:PT24H}
    public-base-url: ${AUTH_ACTIVATION_PUBLIC_BASE_URL:http://localhost:8080}
    from-address: ${AUTH_ACTIVATION_FROM_ADDRESS:no-reply@menta.local}
    # Dedicated AES-256-GCM key for the short-lived activation delivery envelope.
    # The fallback is development-only; production profiles reject it at startup.
    delivery-key: ${AUTH_ACTIVATION_DELIVERY_KEY:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=}
    delivery-key-version: ${AUTH_ACTIVATION_DELIVERY_KEY_VERSION:1}
    rate-limit:
      email-max-attempts: ${AUTH_ACTIVATION_RATE_LIMIT_EMAIL_MAX_ATTEMPTS:3}
      client-max-attempts: ${AUTH_ACTIVATION_RATE_LIMIT_CLIENT_MAX_ATTEMPTS:10}
      window-seconds: ${AUTH_ACTIVATION_RATE_LIMIT_WINDOW_SECONDS:900}
  password-reset:
    # ISO-8601: el enlace vence a la hora (US-AUTH-005/006).
    token-ttl: ${AUTH_PASSWORD_RESET_TOKEN_TTL:PT1H}
    public-base-url: ${AUTH_PASSWORD_RESET_PUBLIC_BASE_URL:http://localhost:8080}
    from-address: ${AUTH_PASSWORD_RESET_FROM_ADDRESS:no-reply@menta.local}
    # Clave AES-256-GCM DEDICADA, distinta de la de activación: rotar o
    # comprometer una no debe afectar al otro flujo. El fallback es sólo para
    # desarrollo; los perfiles de producción lo rechazan al arrancar.
    delivery-key: ${AUTH_PASSWORD_RESET_DELIVERY_KEY:YmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmI=}
    delivery-key-version: ${AUTH_PASSWORD_RESET_DELIVERY_KEY_VERSION:1}
    request-rate-limit:
      # US-AUTH-005: 3 solicitudes/hora por email, 10/hora por IP.
      email-max-attempts: ${AUTH_PASSWORD_RESET_REQUEST_EMAIL_MAX:3}
      client-max-attempts: ${AUTH_PASSWORD_RESET_REQUEST_CLIENT_MAX:10}
      window-seconds: ${AUTH_PASSWORD_RESET_REQUEST_WINDOW_SECONDS:3600}
    attempt-rate-limit:
      # US-AUTH-006: 10 intentos/hora por IP. Sin dimensión por email: el
      # endpoint recibe un token, no un email.
      client-max-attempts: ${AUTH_PASSWORD_RESET_ATTEMPT_CLIENT_MAX:10}
      window-seconds: ${AUTH_PASSWORD_RESET_ATTEMPT_WINDOW_SECONDS:3600}
  login:
    rate-limit:
      # Presupuestos SEMÁNTICOS: cuentan fallos de autenticación, no requests.
      # El techo volumétrico vive en NGINX (ADR-0035, PR3); acá sólo llega lo
      # que esta capa puede juzgar — si las credenciales realmente fallaron.
      #
      # Un login exitoso no consume nada y limpia el contador del email, así
      # que estos números sólo los alcanza quien está fallando de verdad.
      email-max-failures: ${AUTH_LOGIN_RATE_LIMIT_EMAIL_MAX_FAILURES:10}
      # Más alto que el de email: detecta password spraying sin castigar a una
      # NAT compartida (oficina, escuela, carrier) donde varias personas
      # legítimas se equivocan dentro de la misma ventana.
      client-max-failures: ${AUTH_LOGIN_RATE_LIMIT_CLIENT_MAX_FAILURES:50}
      window-seconds: ${AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS:900}
  outbox:
    reconcile-batch-size: ${AUTH_OUTBOX_RECONCILE_BATCH_SIZE:100}
    reconcile-rate-ms: ${AUTH_OUTBOX_RECONCILE_RATE_MS:5000}
    reconcile-backoff-seconds: ${AUTH_OUTBOX_RECONCILE_BACKOFF_SECONDS:30}
    degraded-window-seconds: ${AUTH_OUTBOX_DEGRADED_WINDOW_SECONDS:30}

# Billing module configuration (US-BILLING-012)
billing:
  subscription:
    expiry:
      # Real off switch (design A16) — rate-ms alone cannot disable a @Scheduled job.
      enabled: ${BILLING_SUBSCRIPTION_EXPIRY_ENABLED:true}
      rate-ms: ${BILLING_SUBSCRIPTION_EXPIRY_RATE_MS:60000}
      batch-size: ${BILLING_SUBSCRIPTION_EXPIRY_BATCH_SIZE:100}

server:
  port: 8081
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    com.menta: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
