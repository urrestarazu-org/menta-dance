spring:
  # Datasource configuration provided by @DynamicPropertySource in test
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 5000
      leak-detection-threshold: 60000
      max-lifetime: 580000
      # Disable validation on borrow to avoid connection issues during shutdown
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        show_sql: false
        # Prevent schema drop exceptions during test shutdown
        jakarta:
          persistence:
            schema-generation:
              scripts:
                action: none
    # Disable Open Session in View to avoid connection leaks
    open-in-view: false

  # Disable Flyway for integration tests (using ddl-auto instead)
  flyway:
    enabled: false

  # Disable Redis for tests
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# SubscriptionExpiryReconciler's @Scheduled(fixedRateString=...) has no initialDelayString, so
# Spring runs its first tick almost immediately at context startup regardless of how high
# rate-ms is set — a huge rate-ms only spaces out SUBSEQUENT ticks, it never suppresses the
# first one. Under CI's heavier load that first tick can land inside a test method's own
# window instead of safely before it, racing real writes against tests that manually simulate
# a race (see SubscriptionOptimisticLockingIntegrationTest). Default the reconciler off for
# every integration test; SubscriptionExpirySweepIntegrationTest re-enables it explicitly,
# since proving the real sweep is its whole point.
billing:
  subscription:
    expiry:
      enabled: false

# Same defect, same reasoning, different job (#172). The reconciler's first tick calls the VOID
# tokenBlacklistPort.writeHeartbeat(), and TokenBlacklistPort is a @MockBean in nearly every
# integration context here. Mockito's ongoing-stubbing state is per-mock, not per-thread, so a
# scheduler thread landing between a test's own invocation on that mock and the when(...)
# wrapping it makes Mockito believe the void method is the one being stubbed — the failure then
# surfaces as CannotStubVoidMethodWithReturnValue from a @BeforeEach that never mentioned the
# reconciler. Raising auth.outbox.reconcile-rate-ms cannot help, for the reason spelled out above.
#
# This switches off OutboxBlacklistReconcilerTrigger only. The reconciler itself stays in the
# context: AuthRevocationIntegrationTest autowires it and drives processBatch() by hand, so
# removing the worker along with its schedule would break that test's startup outright.
auth:
  outbox:
    reconcile:
      enabled: false

# Logging for integration tests
logging:
  level:
    root: WARN
    com.menta: INFO
    org.hibernate.SQL: WARN
    org.springframework.orm.jpa: WARN
    org.springframework.transaction: WARN
    com.zaxxer.hikari: WARN
