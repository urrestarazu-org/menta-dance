openapi: 3.1.0

# Contrato HTTP de la superficie Billing v1.
#
# Escrito y versionado a mano, mismo criterio que auth-v1.yaml: el diff se
# revisa en el PR igual que la colección Bruno.
#
# Sólo describe endpoints IMPLEMENTADOS. El resto del contrato de
# docs/06-BILLING-API.md (pagos, pricing presencial y conciliación) no está
# acá porque todavía no existe.

info:
  title: Menta Dance — Billing API
  version: "1.0.0"
  description: |
    Catálogo público de planes de suscripción (US-BILLING-001), inicio de
    Checkout Pro (US-BILLING-010) y confirmación de pago por webhook de
    Mercado Pago (US-BILLING-002).

    ## Errores

    Todos los errores usan `application/problem+json` (RFC 9457) con un
    miembro adicional `code` estable. Los clientes deben discriminar por
    `code`, no por `detail`.

    ## No enumeración

    `GET /plans/{planId}` no distingue un plan inexistente de uno inactivo —
    ambos responden el mismo `404 PLAN_NOT_FOUND`.

servers:
  - url: http://localhost:8081
    description: Desarrollo local
  - url: https://api.mentadance.com
    description: Producción

tags:
  - name: Planes
    description: Catálogo público de planes de suscripción.
  - name: Suscripciones
    description: Inicio de checkout y cancelación autogestionada de la propia suscripción.
  - name: Gestión de suscripciones
    description: Cancelación administrativa de la suscripción de un alumno (ADMIN).
  - name: Webhooks
    description: Notificaciones asíncronas de proveedores de pago.

paths:
  /api/v1/billing/plans:
    get:
      tags: [Planes]
      summary: Listar planes activos
      description: |
        Devuelve únicamente planes con `status = ACTIVE`, ordenados por
        precio ascendente. Sin planes activos, responde `200` con una lista
        vacía — nunca `404`.
      operationId: listPlans
      security: []
      responses:
        '200':
          description: Lista de planes activos (posiblemente vacía).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanListResponse'
        '429':
          $ref: '#/components/responses/PlanRateLimited'
        '503':
          $ref: '#/components/responses/BillingDegraded'

  /api/v1/billing/plans/{planId}:
    get:
      tags: [Planes]
      summary: Detalle de un plan
      description: |
        Devuelve el detalle completo de un plan sólo si existe y está
        `ACTIVE`. Un `planId` inexistente y uno inactivo responden
        idénticamente `404` — el motivo real no es distinguible.
      operationId: getPlan
      security: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle completo del plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDetailResponse'
        '404':
          description: Plan inexistente o inactivo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                no_encontrado:
                  value:
                    type: https://menta.dance/problems/plan_not_found
                    title: Not Found
                    status: 404
                    detail: Plan no encontrado o no disponible.
                    code: PLAN_NOT_FOUND
        '429':
          $ref: '#/components/responses/PlanRateLimited'
        '503':
          $ref: '#/components/responses/BillingDegraded'

  /api/v1/billing/subscriptions:
    post:
      tags: [Suscripciones]
      summary: Iniciar Checkout Pro para una suscripción
      description: |
        Crea localmente un pago y una suscripción `PENDING` antes de pedir la
        preferencia a Mercado Pago. El usuario siempre se obtiene del access
        token, nunca del body. Repetir la misma `idempotencyKey` para ese
        usuario devuelve el checkout original y no crea un segundo cobro.

        `checkoutUrl` sólo sirve para navegar al Checkout Pro. La confirmación
        financiera llega exclusivamente por el webhook firmado.
      operationId: createSubscriptionCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionCheckoutRequest'
      responses:
        '201':
          description: Suscripción pendiente y preferencia de Checkout Pro creadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionCheckoutResponse'
        '400':
          description: Body inválido o `planId` mal formado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Falta un access token válido.
        '409':
          description: El usuario ya tiene un checkout pendiente o una suscripción activa.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                subscription_already_active:
                  value:
                    type: https://menta.dance/problems/subscription_already_active
                    title: Conflict
                    status: 409
                    detail: Ya tenés una suscripción vigente.
                    code: SUBSCRIPTION_ALREADY_ACTIVE
                    currentEndDate: '2026-09-17T12:00:00Z'
        '422':
          description: El plan no está disponible o no acepta el medio de pago.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                plan_not_available:
                  value:
                    type: https://menta.dance/problems/plan_not_available
                    title: Unprocessable Entity
                    status: 422
                    detail: El plan no está disponible para suscribirse.
                    code: PLAN_NOT_AVAILABLE
                payment_method_not_accepted:
                  value:
                    type: https://menta.dance/problems/payment_method_not_accepted
                    title: Unprocessable Entity
                    status: 422
                    detail: El plan no acepta el método de pago solicitado.
                    code: PAYMENT_METHOD_NOT_ACCEPTED
                    acceptedPaymentMethods: [MERCADO_PAGO]
        '503':
          description: No fue posible crear la preferencia; no se creó un cobro.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                payment_preference_unavailable:
                  value:
                    type: https://menta.dance/problems/payment_preference_unavailable
                    title: Service Unavailable
                    status: 503
                    detail: No pudimos iniciar el pago en este momento. Intentá de nuevo en unos minutos.
                    code: PAYMENT_PREFERENCE_UNAVAILABLE

  /api/v1/billing/subscriptions/me:
    delete:
      tags: [Suscripciones]
      summary: Cancelar la propia suscripción activa
      description: |
        Cancela el auto-renovado de la suscripción `ACTIVE` del usuario autenticado.
        `endDate` no cambia — el acceso se mantiene hasta el final del período ya pagado
        (US-BILLING-011 escenario 1).

        El body de la respuesta nunca incluye `cancellationReason`: no existe ese campo en
        este contrato, no se serializa como `null` ni se filtra — su ausencia es estructural.
      operationId: cancelOwnSubscription
      responses:
        '200':
          description: Suscripción cancelada; el acceso persiste hasta `accessEndsAt`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelSubscriptionResponse'
        '401':
          description: Falta un access token válido.
        '404':
          description: El usuario no tiene una suscripción `ACTIVE` para cancelar.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                sin_suscripcion_cancelable:
                  value:
                    type: https://menta.dance/problems/subscription_not_found
                    title: Not Found
                    status: 404
                    detail: No se encontró una suscripción cancelable.
                    code: SUBSCRIPTION_NOT_FOUND

  /api/v1/admin/billing/subscriptions/{subscriptionId}:
    delete:
      tags: [Gestión de suscripciones]
      summary: Cancelar la suscripción de un alumno (ADMIN)
      description: |
        Cancela cualquier suscripción `ACTIVE` con un `reason` auditable, obligatorio.
        Actor y motivo quedan persistidos, pero `cancellationReason` nunca aparece en la
        respuesta — la misma garantía estructural que la ruta de autoservicio
        (US-BILLING-011 escenario 8).
      operationId: cancelSubscriptionAsAdmin
      security:
        - bearerAuth: []
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSubscriptionRequest'
      responses:
        '200':
          description: Suscripción cancelada; el acceso persiste hasta `accessEndsAt`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelSubscriptionResponse'
        '400':
          description: '`reason` ausente o en blanco. No se modifica la suscripción.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                motivo_requerido:
                  value:
                    type: https://menta.dance/problems/invalid_request
                    title: Bad Request
                    status: 400
                    detail: La solicitud contiene datos inválidos.
                    code: INVALID_REQUEST
        '401':
          description: Falta un access token válido.
        '403':
          description: El caller autenticado no tiene rol ADMIN.
        '404':
          description: >-
            La suscripción no existe o no está `ACTIVE` — mismo código para ambos casos, para
            no funcionar como oráculo de existencia de ids.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                sin_suscripcion_cancelable:
                  value:
                    type: https://menta.dance/problems/subscription_not_found
                    title: Not Found
                    status: 404
                    detail: No se encontró una suscripción cancelable.
                    code: SUBSCRIPTION_NOT_FOUND

  /api/v1/billing/payments/mercadopago/webhook:
    post:
      tags: [Webhooks]
      summary: Recibir notificación de pago de Mercado Pago
      description: |
        Verifica `HMAC-SHA256` de `x-signature` (comparación timing-safe) y
        rechaza timestamps con más de 5 minutos de antigüedad. Persiste y
        deduplica la notificación como `RECEIVED` en el inbox durable —
        responde `200` incluso ante un duplicado, sólo después de comprobar
        esa persistencia. Nunca consulta al proveedor ni aplica ningún efecto
        de pago en este hilo: eso corre en un worker asíncrono
        (docs/06-BILLING-API.md, ADR-0038).
      operationId: receiveMercadoPagoWebhook
      security: []
      parameters:
        - name: data.id
          in: query
          required: true
          schema:
            type: string
          description: Id del pago en Mercado Pago.
        - name: x-request-id
          in: header
          required: true
          schema:
            type: string
        - name: x-signature
          in: header
          required: true
          schema:
            type: string
          description: Formato `ts=<epoch-seconds>,v1=<hmac-sha256-hex>`.
      responses:
        '200':
          description: Notificación verificada y persistida (o ya vista antes — idempotente).
        '401':
          description: Firma inválida o timestamp vencido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                firma_invalida:
                  value:
                    type: https://menta.dance/problems/webhook_signature_invalid
                    title: Unauthorized
                    status: 401
                    detail: Webhook signature verification failed.
                    code: WEBHOOK_SIGNATURE_INVALID
                timestamp_vencido:
                  value:
                    type: https://menta.dance/problems/webhook_timestamp_expired
                    title: Unauthorized
                    status: 401
                    detail: Webhook timestamp is too old.
                    code: WEBHOOK_TIMESTAMP_EXPIRED

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT emitido por Auth.

  responses:
    PlanRateLimited:
      description: Presupuesto de 60 req/min por IP agotado.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Segundos hasta poder reintentar.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            rate_limited:
              value:
                type: https://menta.dance/problems/plan_rate_limited
                title: Too Many Requests
                status: 429
                detail: Demasiadas solicitudes; reintentá más tarde.
                code: PLAN_RATE_LIMITED

    BillingDegraded:
      description: El limitador de Redis no está disponible; fail-closed.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            degraded:
              value:
                type: https://menta.dance/problems/billing_degraded
                title: Service Unavailable
                status: 503
                detail: El servicio de facturación no está disponible temporalmente.
                code: BILLING_DEGRADED

  schemas:
    Problem:
      type: object
      description: |
        RFC 9457 Problem Details con el miembro adicional `code`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        currentEndDate:
          type: string
          format: date-time
          description: Fecha de vencimiento de la suscripción que bloquea el checkout, si ya fue activada.
        acceptedPaymentMethods:
          type: array
          description: Medios de pago que acepta el plan cuando se rechaza el solicitado.
          items:
            type: string

    CreateSubscriptionCheckoutRequest:
      type: object
      required: [planId, paymentMethod, idempotencyKey]
      properties:
        planId:
          type: string
          format: uuid
        paymentMethod:
          type: string
          enum: [MERCADO_PAGO]
          description: Este endpoint implementa exclusivamente Checkout Pro. La transferencia bancaria se incorporará con su propio flujo en US-BILLING-003.
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 128

    SubscriptionCheckoutResponse:
      type: object
      required:
        [
          subscriptionId, paymentId, planId, status, providerPreferenceId, externalReference, checkoutUrl,
          overlapNotice,
        ]
      properties:
        subscriptionId:
          type: string
          format: uuid
        paymentId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING]
        providerPreferenceId:
          type: string
          description: Identificador de la preferencia de Checkout Pro, no del pago.
        externalReference:
          type: string
          description: Referencia local usada para correlacionar el webhook verificado.
        checkoutUrl:
          type: string
          format: uri
          description: URL de redirección al Checkout Pro.
        overlapNotice:
          description: |
            Presente y no bloqueante (`null` en caso contrario) cuando este checkout se
            superpone con una suscripción `CANCELLED` del mismo plan cuyo `endDate` todavía no
            venció (US-BILLING-011 D3). Se recalcula también en la respuesta de un replay por
            `idempotencyKey`.
          oneOf:
            - $ref: "#/components/schemas/OverlapNotice"
            - type: "null"

    OverlapNotice:
      type: object
      required: [code, currentAccessEndsAt]
      properties:
        code:
          type: string
          enum: [OVERLAPPING_PAID_PERIOD]
        currentAccessEndsAt:
          type: string
          format: date-time
          description: >-
            `endDate` de la suscripción cancelada más reciente que aún otorga acceso para
            este plan.

    CancelSubscriptionResponse:
      type: object
      description: |
        Compartido por ambas rutas de cancelación. No declara `cancellationReason` — esa
        ausencia es intencional (US-BILLING-011 D2), no un campo opcional omitido.
      required: [subscriptionId, status, accessEndsAt, cancellationPolicy]
      properties:
        subscriptionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [CANCELLED]
        accessEndsAt:
          type: string
          format: date-time
          description: Igual al `endDate` ya vigente — la cancelación nunca lo mueve.
        cancellationPolicy:
          type: string
          description: Texto informativo del plan (`Plan.cancellationPolicy`).

    CancelSubscriptionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          description: Obligatorio y auditable en esta ruta; nunca se devuelve en la respuesta.

    PlanCourseResponse:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: UUID global del curso (propiedad de Virtual o Physical).
        name:
          type: [string, "null"]
          description: |
            Nombre del curso. `null` si el catálogo de Virtual/Physical no
            pudo resolverlo todavía (ver #40/#46).

    PlanSummaryResponse:
      type: object
      required: [id, name, description, price, currency, durationDays, featured, courses]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: decimal
        currency:
          type: string
          example: ARS
        durationDays:
          type: integer
        featured:
          type: boolean
        courses:
          type: array
          items:
            $ref: '#/components/schemas/PlanCourseResponse'

    PlanListResponse:
      type: object
      required: [plans]
      properties:
        plans:
          type: array
          items:
            $ref: '#/components/schemas/PlanSummaryResponse'

    PlanDetailResponse:
      type: object
      required: [id, name, description, price, currency, durationDays, featured, termsAndConditions, cancellationPolicy, courses]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: decimal
        currency:
          type: string
        durationDays:
          type: integer
        featured:
          type: boolean
        termsAndConditions:
          type: string
        cancellationPolicy:
          type: string
        courses:
          type: array
          items:
            $ref: '#/components/schemas/PlanCourseResponse'

security:
  - bearerAuth: []
