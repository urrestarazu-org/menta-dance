openapi: 3.1.0

# Contrato HTTP de la superficie Billing v1.
#
# Escrito y versionado a mano, mismo criterio que auth-v1.yaml: el diff se
# revisa en el PR igual que la colección Bruno.
#
# Sólo describe endpoints IMPLEMENTADOS. Cubre todas las rutas de producción
# de los controllers de billing: planes, suscripciones, compras presenciales,
# pagos (comprobante, verificación manual y corrección), precios y cotizaciones
# presenciales y el webhook de Mercado Pago. Quedan fuera los endpoints de
# soporte del perfil e2e-mercadopago (no son superficie de producción).
#
# La conciliación de docs/06-BILLING-API.md (GET .../admin/reconciliation y
# POST .../admin/reconciliation/{paymentId}/resolve) está planificada y NO
# existe todavía: no se documenta acá. Hoy un pago en RECONCILIATION_REQUIRED
# se resuelve con POST /api/v1/admin/billing/payments/{paymentId}/corrections.

info:
  title: Menta Dance — Billing API
  version: "1.0.0"
  description: |
    Catálogo público de planes de suscripción (US-BILLING-001), alta de planes
    por un admin (#762), inicio de checkout por Checkout Pro o transferencia
    bancaria (US-BILLING-010, US-BILLING-003), confirmación de pago por webhook
    de Mercado Pago (US-BILLING-002), comprobantes y verificación manual de
    transferencias (#31, #33), y precios y cotizaciones de cursos presenciales
    (US-BILLING-009, US-BILLING-006).

    ## Errores

    Todos los errores usan `application/problem+json` (RFC 9457) con un
    miembro adicional `code` estable. Los clientes deben discriminar por
    `code`, no por `detail`.

    ## No enumeración

    `GET /plans/{planId}` no distingue un plan inexistente de uno inactivo —
    ambos responden el mismo `404 PLAN_NOT_FOUND`.

servers:
  - url: http://localhost:8081
    description: Desarrollo local
  - url: https://api.mentadance.com
    description: Producción

tags:
  - name: Planes
    description: Catálogo público de planes de suscripción.
  - name: Gestión de planes
    description: Alta de planes de facturación (ADMIN, #762).
  - name: Suscripciones
    description: Inicio de checkout y cancelación autogestionada de la propia suscripción.
  - name: Gestión de suscripciones
    description: >-
      Cancelación administrativa y asignación de suscripciones de prueba para un alumno
      (ADMIN).
  - name: Compras presenciales
    description: Compra de cursos presenciales (#41, US-PHYSICAL-004).
  - name: Precios y cotizaciones presenciales
    description: >-
      Precio vigente de un curso presencial (lectura pública, edición ADMIN o profesor del curso)
      y cotización de una compra por el alumno (US-BILLING-009, US-BILLING-006).
  - name: Excepciones de compras presenciales
    description: Inventario y cierre auditable de compras presenciales en EXCEPTION (#237, #539).
  - name: Pagos
    description: Listado de los pagos propios (#767) y consulta del estado de uno (#559).
  - name: Webhooks
    description: Notificaciones asíncronas de proveedores de pago.
  - name: Verificación manual de pagos
    description: >-
      Admin inbox, detalle con comprobante firmado, y corrección auditada de pagos por
      transferencia bancaria (#33, US-BILLING-005). El servido del comprobante en sí no requiere
      ADMIN — el token firmado es la credencial.

paths:
  /api/v1/billing/plans:
    get:
      tags: [Planes]
      summary: Listar planes activos
      description: |
        Devuelve únicamente planes con `status = ACTIVE`, ordenados por
        precio ascendente. Sin planes activos, responde `200` con una lista
        vacía — nunca `404`.
      operationId: listPlans
      security: []
      responses:
        '200':
          description: Lista de planes activos (posiblemente vacía).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanListResponse'
        '429':
          $ref: '#/components/responses/PlanRateLimited'
        '503':
          $ref: '#/components/responses/BillingDegraded'

  /api/v1/billing/plans/{planId}:
    get:
      tags: [Planes]
      summary: Detalle de un plan
      description: |
        Devuelve el detalle completo de un plan sólo si existe y está
        `ACTIVE`. Un `planId` inexistente y uno inactivo responden
        idénticamente `404` — el motivo real no es distinguible.
      operationId: getPlan
      security: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle completo del plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDetailResponse'
        '404':
          description: Plan inexistente o inactivo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                no_encontrado:
                  value:
                    type: https://menta.dance/problems/plan_not_found
                    title: Not Found
                    status: 404
                    detail: Plan no encontrado o no disponible.
                    code: PLAN_NOT_FOUND
        '429':
          $ref: '#/components/responses/PlanRateLimited'
        '503':
          $ref: '#/components/responses/BillingDegraded'

  /api/v1/admin/billing/plans:
    post:
      tags: [Gestión de planes]
      summary: Crear un plan (ADMIN)
      description: |
        Crea un plan de facturación con un `id` generado por el servidor y responde con el mismo
        contrato que el detalle público (`GET /api/v1/billing/plans/{planId}`). Un plan `ACTIVE`
        aparece desde ese momento en el catálogo público; uno `INACTIVE` se guarda pero nunca se
        lista ni se muestra públicamente.

        Los `courseIds` son ids de cursos de Virtual o Physical, tomados por valor: Billing no
        valida que existan. Un curso que no se puede resolver se devuelve con `name: null`, igual
        que en el catálogo público. La lista puede ser vacía.

        No hay tabla de auditoría para planes: el alta queda registrada en el log de la API con el
        id del plan y el del admin.
      operationId: createPlan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      responses:
        '201':
          description: Plan creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDetailResponse'
        '400':
          description: >-
            Cuerpo incompleto o ilegible, precio cero o negativo, más de dos decimales o más de
            ocho dígitos enteros, moneda que no es un código ISO-4217, `durationDays` cero o
            negativo, `status` o medio de pago desconocidos, sin medios de pago, o un `courseId`
            en blanco o de más de 64 caracteres. No se crea ningún plan.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                datos_invalidos:
                  value:
                    type: https://menta.dance/problems/invalid_request
                    title: Bad Request
                    status: 400
                    detail: La solicitud contiene datos inválidos.
                    code: INVALID_REQUEST
        '401':
          description: Falta un access token válido.
        '403':
          description: El caller autenticado no tiene rol ADMIN.

  /api/v1/billing/subscriptions:
    post:
      tags: [Suscripciones]
      summary: Iniciar el checkout de una suscripción (Checkout Pro o transferencia bancaria)
      description: |
        El usuario siempre se obtiene del access token, nunca del body.

        Con `paymentMethod: MERCADO_PAGO` crea localmente un pago y una suscripción `PENDING`
        antes de pedir la preferencia a Mercado Pago. Repetir la misma `idempotencyKey` para ese
        usuario devuelve el checkout original y no crea un segundo cobro. `checkoutUrl` sólo sirve
        para navegar al Checkout Pro. La confirmación financiera llega exclusivamente por el
        webhook firmado.

        Con `paymentMethod: BANK_TRANSFER` (#31, US-BILLING-003) el pago nace en espera de
        verificación manual y la respuesta trae `bankTransferInstructions`; `providerPreferenceId`,
        `checkoutUrl` y `overlapNotice` van en `null` y no se llama a Mercado Pago. Esta rama no
        busca replays por `idempotencyKey`. Consume el cupo diario de 10 creaciones por
        transferencia y usuario, compartido con `POST /api/v1/billing/physical/purchases`; el
        comprobante se sube después con `POST /api/v1/billing/payments/{paymentId}/proof`.
      operationId: createSubscriptionCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionCheckoutRequest'
      responses:
        '201':
          description: >-
            Suscripción pendiente creada, con la preferencia de Checkout Pro (`MERCADO_PAGO`) o con
            las instrucciones de transferencia (`BANK_TRANSFER`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionCheckoutResponse'
        '400':
          description: Body inválido o `planId` mal formado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Falta un access token válido.
        '409':
          description: >-
            El usuario ya tiene un checkout pendiente o una suscripción activa, o la
            suscripción fue modificada por otra operación concurrente (US-BILLING-012 A14 — el
            barrido automático de vencimiento puede correr en el mismo instante).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                subscription_already_active:
                  value:
                    type: https://menta.dance/problems/subscription_already_active
                    title: Conflict
                    status: 409
                    detail: Ya tenés una suscripción vigente.
                    code: SUBSCRIPTION_ALREADY_ACTIVE
                    currentEndDate: '2026-09-17T12:00:00Z'
                subscription_conflict:
                  value:
                    type: https://menta.dance/problems/subscription_conflict
                    title: Conflict
                    status: 409
                    detail: La suscripción fue modificada por otra operación. Reintentá la solicitud.
                    code: SUBSCRIPTION_CONFLICT
        '422':
          description: El plan no está disponible o no acepta el medio de pago.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                plan_not_available:
                  value:
                    type: https://menta.dance/problems/plan_not_available
                    title: Unprocessable Entity
                    status: 422
                    detail: El plan no está disponible para suscribirse.
                    code: PLAN_NOT_AVAILABLE
                payment_method_not_accepted:
                  value:
                    type: https://menta.dance/problems/payment_method_not_accepted
                    title: Unprocessable Entity
                    status: 422
                    detail: El plan no acepta el método de pago solicitado.
                    code: PAYMENT_METHOD_NOT_ACCEPTED
                    acceptedPaymentMethods: [MERCADO_PAGO]
        '429':
          $ref: '#/components/responses/BankTransferRateLimited'
        '503':
          description: >-
            `PAYMENT_PREFERENCE_UNAVAILABLE` (`MERCADO_PAGO`): no fue posible crear la preferencia;
            no se creó un cobro. `BILLING_DEGRADED` (`BANK_TRANSFER`): el limitador de Redis no
            está disponible y la ruta falla cerrada, con `Retry-After`.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Segundos hasta poder reintentar; sólo con `BILLING_DEGRADED`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                payment_preference_unavailable:
                  value:
                    type: https://menta.dance/problems/payment_preference_unavailable
                    title: Service Unavailable
                    status: 503
                    detail: No pudimos iniciar el pago en este momento. Intentá de nuevo en unos minutos.
                    code: PAYMENT_PREFERENCE_UNAVAILABLE
                billing_degraded:
                  value:
                    type: https://menta.dance/problems/billing_degraded
                    title: Service Unavailable
                    status: 503
                    detail: El servicio de facturación no está disponible temporalmente.
                    code: BILLING_DEGRADED

  /api/v1/billing/subscriptions/me:
    get:
      tags: [Suscripciones]
      summary: Consultar la propia suscripción
      description: |
        Devuelve la suscripción vigente del usuario autenticado (US-BILLING-004). El usuario sale
        del token: no hay parámetro de usuario. Resuelve un único estado, en este orden: la
        suscripción `PENDING` o `ACTIVE` que ocupa el lugar del alumno y, si no tiene ninguna, la
        `EXPIRED` más reciente. Una suscripción `CANCELLED` nunca se resuelve aquí, aunque todavía
        otorgue acceso: se lee desde `GET /me/history`.

        `type` (#766) distingue una prueba asignada por un admin (`TRIAL`) de una suscripción
        pagada (`PAID`). Es un campo agregado: ningún otro campo cambió, y un cliente que lo
        ignora sigue funcionando.
      operationId: getOwnSubscription
      responses:
        '200':
          description: Suscripción vigente del usuario, en estado `ACTIVE`, `EXPIRED` o `PENDING`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSubscriptionResponse'
              examples:
                prueba_activa:
                  value:
                    subscriptionId: 6f1c2a9e-0d4b-4a57-9a43-2f6f3c1d8e10
                    planId: 0b6e9d3a-5c1f-4e2b-8a7d-1c9f0e2d3b4a
                    status: ACTIVE
                    startDate: '2026-11-10T12:00:00Z'
                    endDate: '2026-11-17T12:00:00Z'
                    daysRemaining: 7
                    expiringSoon: true
                    checkoutUrl: null
                    plansUrl: null
                    type: TRIAL
        '401':
          description: Falta un access token válido.
        '404':
          description: El usuario no tiene ninguna suscripción `PENDING`, `ACTIVE` ni `EXPIRED`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                sin_suscripcion:
                  value:
                    type: https://menta.dance/problems/no_subscription
                    title: Not Found
                    status: 404
                    detail: No tenés ninguna suscripción.
                    code: NO_SUBSCRIPTION
                    plansUrl: /api/v1/billing/plans
    delete:
      tags: [Suscripciones]
      summary: Cancelar la propia suscripción activa
      description: |
        Cancela el auto-renovado de la suscripción `ACTIVE` del usuario autenticado.
        `endDate` no cambia — el acceso se mantiene hasta el final del período ya pagado
        (US-BILLING-011 escenario 1).

        El body de la respuesta nunca incluye `cancellationReason`: no existe ese campo en
        este contrato, no se serializa como `null` ni se filtra — su ausencia es estructural.
      operationId: cancelOwnSubscription
      responses:
        '200':
          description: Suscripción cancelada; el acceso persiste hasta `accessEndsAt`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelSubscriptionResponse'
        '401':
          description: Falta un access token válido.
        '404':
          description: El usuario no tiene una suscripción `ACTIVE` para cancelar.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                sin_suscripcion_cancelable:
                  value:
                    type: https://menta.dance/problems/subscription_not_found
                    title: Not Found
                    status: 404
                    detail: No se encontró una suscripción cancelable.
                    code: SUBSCRIPTION_NOT_FOUND
        '409':
          description: >-
            La suscripción fue modificada por otra operación concurrente (US-BILLING-012 A14 —
            por ejemplo, el barrido automático de vencimiento la marcó `EXPIRED` en el mismo
            instante). Reintentar la solicitud resuelve la carrera de forma determinística.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                subscription_conflict:
                  value:
                    type: https://menta.dance/problems/subscription_conflict
                    title: Conflict
                    status: 409
                    detail: La suscripción fue modificada por otra operación. Reintentá la solicitud.
                    code: SUBSCRIPTION_CONFLICT

  /api/v1/billing/subscriptions/me/history:
    get:
      tags: [Suscripciones]
      summary: Listar el historial de suscripciones propio
      description: |
        Devuelve todas las suscripciones del usuario autenticado, de la más nueva a la más vieja
        por fecha de creación, en cualquier estado (US-BILLING-004). El usuario sale del token.
        Sin suscripciones responde `200 []`. Nunca incluye los cursos de cada suscripción.

        `type` (#766) distingue una prueba asignada por un admin (`TRIAL`) de una suscripción
        pagada (`PAID`) en cada elemento.
      operationId: listOwnSubscriptionHistory
      responses:
        '200':
          description: Suscripciones del usuario, de la más nueva a la más vieja; `[]` si no tiene.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionHistoryItemResponse'
        '401':
          description: Falta un access token válido.

  /api/v1/admin/billing/subscriptions/{subscriptionId}:
    delete:
      tags: [Gestión de suscripciones]
      summary: Cancelar la suscripción de un alumno (ADMIN)
      description: |
        Cancela cualquier suscripción `ACTIVE` con un `reason` auditable, obligatorio.
        Actor y motivo quedan persistidos, pero `cancellationReason` nunca aparece en la
        respuesta — la misma garantía estructural que la ruta de autoservicio
        (US-BILLING-011 escenario 8).
      operationId: cancelSubscriptionAsAdmin
      security:
        - bearerAuth: []
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSubscriptionRequest'
      responses:
        '200':
          description: Suscripción cancelada; el acceso persiste hasta `accessEndsAt`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelSubscriptionResponse'
        '400':
          description: '`reason` ausente o en blanco. No se modifica la suscripción.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                motivo_requerido:
                  value:
                    type: https://menta.dance/problems/invalid_request
                    title: Bad Request
                    status: 400
                    detail: La solicitud contiene datos inválidos.
                    code: INVALID_REQUEST
        '401':
          description: Falta un access token válido.
        '403':
          description: El caller autenticado no tiene rol ADMIN.
        '404':
          description: >-
            La suscripción no existe o no está `ACTIVE` — mismo código para ambos casos, para
            no funcionar como oráculo de existencia de ids.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                sin_suscripcion_cancelable:
                  value:
                    type: https://menta.dance/problems/subscription_not_found
                    title: Not Found
                    status: 404
                    detail: No se encontró una suscripción cancelable.
                    code: SUBSCRIPTION_NOT_FOUND
        '409':
          description: >-
            La suscripción fue modificada por otra operación concurrente (US-BILLING-012 A14 —
            por ejemplo, el barrido automático de vencimiento la marcó `EXPIRED` en el mismo
            instante). Reintentar la solicitud resuelve la carrera de forma determinística.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                subscription_conflict:
                  value:
                    type: https://menta.dance/problems/subscription_conflict
                    title: Conflict
                    status: 409
                    detail: La suscripción fue modificada por otra operación. Reintentá la solicitud.
                    code: SUBSCRIPTION_CONFLICT

  /api/v1/admin/billing/subscriptions/trial:
    post:
      tags: [Gestión de suscripciones]
      summary: Asignar una suscripción de prueba (ADMIN)
      description: |
        Crea una suscripción `ACTIVE` de tipo `TRIAL`, sin `Payment` asociado, usando el mismo
        snapshot de `courseIds` congelado que usaría una suscripción paga. La duración en días
        la decide el admin en la request — nunca se deriva de `Plan.durationDays`.

        `reason` es obligatorio y auditable, igual que en la cancelación administrativa; nunca
        se devuelve en la respuesta. `userId` se valida antes que cualquier otro chequeo: un
        `userId` inexistente devuelve `404` incluso si además el `planId` es inválido.
      operationId: assignTrialSubscription
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTrialRequest'
      responses:
        '201':
          description: Suscripción de prueba creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignTrialResponse'
        '400':
          description: >-
            `reason` ausente o en blanco, o `days` ausente, cero o negativo. No se crea
            ninguna suscripción.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                motivo_o_dias_invalido:
                  value:
                    type: https://menta.dance/problems/invalid_request
                    title: Bad Request
                    status: 400
                    detail: La solicitud contiene datos inválidos.
                    code: INVALID_REQUEST
        '401':
          description: Falta un access token válido.
        '403':
          description: El caller autenticado no tiene rol ADMIN.
        '404':
          description: El `userId` indicado no existe. Se evalúa antes que la disponibilidad del plan.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                usuario_no_encontrado:
                  value:
                    type: https://menta.dance/problems/user_not_found
                    title: Not Found
                    status: 404
                    detail: No se encontró un usuario para el userId indicado.
                    code: USER_NOT_FOUND
        '409':
          description: >-
            El usuario ya tiene una suscripción vigente (`ACTIVE` o `PENDING`), de cualquier
            tipo, o la suscripción fue modificada por otra operación concurrente (A14).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                subscription_already_active:
                  value:
                    type: https://menta.dance/problems/subscription_already_active
                    title: Conflict
                    status: 409
                    detail: Ya tenés una suscripción vigente.
                    code: SUBSCRIPTION_ALREADY_ACTIVE
                subscription_conflict:
                  value:
                    type: https://menta.dance/problems/subscription_conflict
                    title: Conflict
                    status: 409
                    detail: La suscripción fue modificada por otra operación. Reintentá la solicitud.
                    code: SUBSCRIPTION_CONFLICT
        '422':
          description: El plan no existe o no está `ACTIVE`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                plan_not_available:
                  value:
                    type: https://menta.dance/problems/plan_not_available
                    title: Unprocessable Entity
                    status: 422
                    detail: El plan no está disponible para suscribirse.
                    code: PLAN_NOT_AVAILABLE

  /api/v1/billing/physical/purchases:
    post:
      tags: [Compras presenciales]
      summary: Iniciar el checkout de una compra presencial (Checkout Pro o transferencia bancaria)
      description: |
        Toma un `quoteId` vigente (`POST /api/v1/billing/physical/quotes`),
        lo asocia al usuario autenticado y crea localmente un `Payment`
        `PENDING` antes de pedir la preferencia a Mercado Pago. El usuario
        siempre se obtiene del access token, nunca del body. Repetir la
        misma `idempotencyKey` para ese usuario devuelve el checkout
        original y no crea un segundo cobro.

        Con `paymentMethod: MERCADO_PAGO`, reserva capacidad de forma
        atómica antes de crear el `Payment` (#208, design B2/B4/D2): un
        request que responde `201` ya tiene un hold que cubre cada sesión
        elegible del plan, de modo que ningún otro comprador puede tomar
        ese cupo antes de la confirmación. El `409` de esta ruta ya no es
        una cortesía de lectura best-effort — es una garantía real
        respaldada por el hold.

        `checkoutUrl` sólo sirve para navegar al Checkout Pro. La
        confirmación financiera llega exclusivamente por el webhook firmado.

        Con `paymentMethod: BANK_TRANSFER` (#36, US-BILLING-008), el
        `Payment` nace directamente en `AwaitingManualVerification` con los
        datos de `bankTransferInstructions` — **nunca reserva capacidad ni
        llama a Mercado Pago** (design D1). El `409` en este camino es una
        lectura best-effort, no vinculante (design D7): la disponibilidad
        real se decide recién cuando un admin aprueba el comprobante, a
        través del mismo camino `HoldNotFound` que ya resuelve el
        checkout sin hold. Comparte el cupo diario de 10 creaciones de
        transferencia/usuario con `POST /api/v1/billing/subscriptions`
        (design D4).
      operationId: createPhysicalPurchaseCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePhysicalPurchaseRequest'
      responses:
        '201':
          description: Pago pendiente y preferencia de Checkout Pro creados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalPurchaseCheckoutResponse'
        '400':
          description: Body inválido, `quoteId` ausente o `idempotencyKey` ausente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                solicitud_invalida:
                  value:
                    type: https://menta.dance/problems/invalid_request
                    title: Bad Request
                    status: 400
                    detail: La solicitud contiene datos inválidos.
                    code: INVALID_REQUEST
        '401':
          description: Falta un access token válido.
        '409':
          description: >-
            Dos casos, distinguibles por `code`. `CAPACITY_UNAVAILABLE`: no se pudo
            reservar capacidad para todas las sesiones elegibles de la cotización
            (#208, design B2/B4/D2) — ya sea porque una o más sesiones ya están
            llenas, o porque el curso no tiene suficientes sesiones elegibles para
            cubrir el plan completo. Esta es una garantía real: el hold atómico se
            intenta antes de crear cualquier `Payment`, así que no se crea ningún
            `Payment` para este request. Ningún otro comprador puede tomar un cupo
            ya reservado por un hold vigente entre este request y la confirmación.
            `NO_NEW_SESSIONS` (#541, #545): el alumno no sumaría ninguna sesión
            nueva (ambos métodos de pago), así que no hay nada para comprar;
            tampoco se crea hold ni `Payment`. Para `MONTHLY` ya tiene asignación
            confirmada en todas las sesiones que la mensualidad cubriría; para
            `INDIVIDUAL`, ya tiene asignada la sesión elegida. Mismo código en
            ambos casos; sólo cambia el `detail`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                capacity_unavailable:
                  value:
                    type: https://menta.dance/problems/capacity_unavailable
                    title: Conflict
                    status: 409
                    detail: No hay cupo disponible para los horarios elegibles de esta cotización.
                    code: CAPACITY_UNAVAILABLE
                no_new_sessions:
                  value:
                    type: https://menta.dance/problems/no_new_sessions
                    title: Conflict
                    status: 409
                    detail: Ya tenés lugar en todas las sesiones que cubriría esta mensualidad.
                    code: NO_NEW_SESSIONS
                no_new_sessions_individual:
                  value:
                    type: https://menta.dance/problems/no_new_sessions
                    title: Conflict
                    status: 409
                    detail: Ya tenés lugar en esta sesión.
                    code: NO_NEW_SESSIONS
        '410':
          description: >-
            La cotización no existe o su vigencia de 1 hora ya expiró. Deliberadamente
            no distingue ambos casos (anti-enumeración). El remedio es solicitar una
            cotización nueva.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                cotizacion_expirada:
                  value:
                    type: https://menta.dance/problems/physical_course_quote_expired
                    title: Gone
                    status: 410
                    detail: La cotización expiró o no existe. Solicitá una nueva.
                    code: PHYSICAL_COURSE_QUOTE_EXPIRED
        '429':
          $ref: '#/components/responses/BankTransferRateLimited'
        '503':
          description: >-
            `PAYMENT_PREFERENCE_UNAVAILABLE` (`MERCADO_PAGO`): no fue posible crear la preferencia;
            no se creó un cobro. `BILLING_DEGRADED` (`BANK_TRANSFER`): el limitador de Redis no
            está disponible y la ruta falla cerrada, con `Retry-After`.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Segundos hasta poder reintentar; sólo con `BILLING_DEGRADED`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                payment_preference_unavailable:
                  value:
                    type: https://menta.dance/problems/payment_preference_unavailable
                    title: Service Unavailable
                    status: 503
                    detail: No pudimos iniciar el pago en este momento. Intentá de nuevo en unos minutos.
                    code: PAYMENT_PREFERENCE_UNAVAILABLE
                billing_degraded:
                  value:
                    type: https://menta.dance/problems/billing_degraded
                    title: Service Unavailable
                    status: 503
                    detail: El servicio de facturación no está disponible temporalmente.
                    code: BILLING_DEGRADED

  /api/v1/billing/physical/courses/{courseId}/pricing:
    get:
      tags: [Precios y cotizaciones presenciales]
      summary: Consultar el precio vigente de un curso presencial
      description: |
        Devuelve el precio mensual vigente, el recargo por clase individual y la versión del precio
        publicado para el curso (US-BILLING-009). Lectura pública: no requiere cuenta.
      operationId: getPhysicalCoursePricing
      security: []
      parameters:
        - $ref: '#/components/parameters/CourseIdPath'
      responses:
        '200':
          description: Precio vigente del curso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalCoursePricingResponse'
        '404':
          description: Todavía no se publicó un precio para el curso.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                sin_precio:
                  value:
                    type: https://menta.dance/problems/physical_course_pricing_not_found
                    title: Not Found
                    status: 404
                    detail: Todavía no se publicó un precio para este curso.
                    code: PHYSICAL_COURSE_PRICING_NOT_FOUND
    put:
      tags: [Precios y cotizaciones presenciales]
      summary: Publicar o revisar el precio de un curso presencial (ADMIN o profesor del curso)
      description: |
        Crea la versión 1 del precio o publica la versión siguiente, y deja una revisión auditable
        con el `reason` (US-BILLING-009). Lo puede hacer un ADMIN o un INSTRUCTOR que sea el
        profesor responsable del curso. `currency` es opcional y por defecto `ARS`.
      operationId: updatePhysicalCoursePricing
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePhysicalCoursePricingRequest'
      responses:
        '200':
          description: Precio publicado; `version` es la nueva.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalCoursePricingResponse'
        '400':
          description: >-
            Cuerpo incompleto o ilegible, `monthlyPrice` negativo, `currency` que no es un código
            ISO-4217 de tres letras mayúsculas, o `reason` ausente o en blanco.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                datos_invalidos:
                  value:
                    type: https://menta.dance/problems/invalid_request
                    title: Bad Request
                    status: 400
                    detail: La solicitud contiene datos inválidos.
                    code: INVALID_REQUEST
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          description: >-
            `ACCESS_DENIED`: el caller no es ADMIN ni INSTRUCTOR. `PRICING_NOT_OWNED`: es
            INSTRUCTOR pero no el profesor responsable del curso.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                no_es_el_profesor:
                  value:
                    type: https://menta.dance/problems/pricing_not_owned
                    title: Forbidden
                    status: 403
                    detail: No sos el profesor responsable de este curso.
                    code: PRICING_NOT_OWNED
        '404':
          description: El curso presencial no existe.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                curso_inexistente:
                  value:
                    type: https://menta.dance/problems/physical_course_not_found
                    title: Not Found
                    status: 404
                    detail: El curso presencial no existe.
                    code: PHYSICAL_COURSE_NOT_FOUND
        '422':
          description: '`individualSurchargePercent` es cero o negativo. No se publica ninguna versión.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                recargo_invalido:
                  value:
                    type: https://menta.dance/problems/invalid_individual_surcharge
                    title: Unprocessable Entity
                    status: 422
                    detail: El recargo individual debe ser mayor a cero.
                    code: INVALID_INDIVIDUAL_SURCHARGE

  /api/v1/billing/physical/quotes:
    post:
      tags: [Precios y cotizaciones presenciales]
      summary: Cotizar la compra de un curso presencial
      description: |
        Calcula, con el precio vigente del curso, lo que costaría una compra `MONTHLY` (todas las
        sesiones del mes calendario en curso, en UTC) o `INDIVIDUAL` (una sesión elegida), y guarda
        la cotización durante 1 hora (US-BILLING-006). El `id` devuelto es el `quoteId` de
        `POST /api/v1/billing/physical/purchases`. `selectedSessionId` es obligatorio con
        `INDIVIDUAL` y está prohibido con `MONTHLY`. `availability` es informativa: nunca reserva
        cupo. El usuario sale del token y sólo se usa para saber qué sesiones ya tiene.
      operationId: createPhysicalCourseQuote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePhysicalCourseQuoteRequest'
      responses:
        '201':
          description: Cotización creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalCourseQuoteResponse'
        '400':
          description: Cuerpo incompleto o ilegible, `courseId` en blanco o `purchaseType` ausente o desconocido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                datos_invalidos:
                  value:
                    type: https://menta.dance/problems/invalid_request
                    title: Bad Request
                    status: 400
                    detail: La solicitud contiene datos inválidos.
                    code: INVALID_REQUEST
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          description: >-
            `PHYSICAL_COURSE_PRICING_NOT_FOUND`: el curso no tiene precio publicado.
            `PHYSICAL_SESSION_NOT_FOUND`: la sesión elegida no existe en el período cotizado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                sin_precio:
                  value:
                    type: https://menta.dance/problems/physical_course_pricing_not_found
                    title: Not Found
                    status: 404
                    detail: Todavía no se publicó un precio para este curso.
                    code: PHYSICAL_COURSE_PRICING_NOT_FOUND
                sesion_inexistente:
                  value:
                    type: https://menta.dance/problems/physical_session_not_found
                    title: Not Found
                    status: 404
                    detail: La sesión seleccionada no existe en el período cotizado.
                    code: PHYSICAL_SESSION_NOT_FOUND
        '409':
          description: >-
            `NO_NEW_SESSIONS`: el alumno ya tiene lugar en todas las sesiones que cubriría la
            mensualidad, o en la sesión elegida; no hay nada para comprar. Sólo cambia el `detail`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                no_new_sessions:
                  value:
                    type: https://menta.dance/problems/no_new_sessions
                    title: Conflict
                    status: 409
                    detail: Ya tenés lugar en todas las sesiones que cubriría esta mensualidad.
                    code: NO_NEW_SESSIONS
        '422':
          description: >-
            Una de `NO_SCHEDULED_SESSIONS` (el período no tiene sesiones programadas),
            `INDIVIDUAL_SURCHARGE_TOO_SMALL` (el recargo no cambia el precio tras el redondeo),
            `SELECTED_SESSION_REQUIRED` (`INDIVIDUAL` sin `selectedSessionId`) o
            `SELECTED_SESSION_NOT_ALLOWED` (`MONTHLY` con `selectedSessionId`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                sin_sesiones:
                  value:
                    type: https://menta.dance/problems/no_scheduled_sessions
                    title: Unprocessable Entity
                    status: 422
                    detail: No hay sesiones programadas para este período.
                    code: NO_SCHEDULED_SESSIONS
                sesion_requerida:
                  value:
                    type: https://menta.dance/problems/selected_session_required
                    title: Unprocessable Entity
                    status: 422
                    detail: Debés indicar una sesión para una cotización individual.
                    code: SELECTED_SESSION_REQUIRED

  /api/v1/admin/billing/payments:
    get:
      tags: [Verificación manual de pagos]
      summary: Listar pagos pendientes de verificación manual (ADMIN)
      description: |
        Devuelve, paginado y ordenado por antigüedad (más antiguos primero), los pagos por
        transferencia bancaria en `PENDING/AWAITING_MANUAL_VERIFICATION`. `pageSize` mayor a 50
        se **rechaza** con `400` — nunca se recorta (D3, decisión explícita de `sdd-tasks`,
        diverge de la propuesta de diseño que proponía recortar).
      operationId: listPendingVerificationPayments
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [PENDING]
        - name: substatus
          in: query
          required: true
          schema:
            type: string
            enum: [AWAITING_MANUAL_VERIFICATION]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Máximo 50. Un valor mayor responde `400`, sin resultados.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Página de pagos pendientes de verificación (posiblemente vacía).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingVerificationPageResponse'
        '400':
          description: '`size` mayor a 50. No se devuelven resultados.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                page_size_excedido:
                  value:
                    type: https://menta.dance/problems/invalid_request
                    title: Bad Request
                    status: 400
                    detail: La solicitud es inválida.
                    code: INVALID_REQUEST
        '401':
          description: Falta un access token válido.
        '403':
          description: El caller autenticado no tiene rol ADMIN.

  /api/v1/admin/billing/purchases:
    get:
      tags: [Excepciones de compras presenciales]
      summary: Listar compras presenciales en EXCEPTION (ADMIN)
      description: |
        Inventario de sólo lectura, paginado y ordenado por antigüedad (más antiguos primero,
        según `Payment.createdAt`), de compras presenciales varadas en `EXCEPTION` (#237). Una
        compra sale de este inventario únicamente al cerrarse con
        `POST /api/v1/admin/billing/purchases/{purchaseId}/resolution` (#539). `size` mayor a 50
        se **rechaza** con `400` — nunca se recorta (mismo criterio que el inbox de pagos
        pendientes).
      operationId: listPurchasesInException
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [EXCEPTION]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Máximo 50. Un valor mayor responde `400`, sin resultados.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Página de compras en EXCEPTION (posiblemente vacía).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionPurchasePageResponse'
        '400':
          description: '`size` mayor a 50. No se devuelven resultados.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                page_size_excedido:
                  value:
                    type: https://menta.dance/problems/invalid_request
                    title: Bad Request
                    status: 400
                    detail: La solicitud es inválida.
                    code: INVALID_REQUEST
        '401':
          description: Falta un access token válido.
        '403':
          description: El caller autenticado no tiene rol ADMIN.

  /api/v1/admin/billing/purchases/{purchaseId}/resolution:
    post:
      tags: [Excepciones de compras presenciales]
      summary: Cerrar una compra presencial en EXCEPTION con registro auditable (ADMIN)
      description: |
        Cierra una compra varada en `EXCEPTION` como `REFUNDED` (el dinero se devolvió fuera de
        la plataforma) o `COMPENSATED` (se compensó al alumno de otra forma), dejando una nota
        obligatoria (#539). La compra pasa al estado terminal `RESOLVED` y conserva quién la
        cerró, cuándo y por qué. El pago no se modifica y no se asigna ninguna sesión: la
        asistencia sigue sin habilitarse. En la misma transacción se publica
        `billing.PurchaseResolved` (sin la nota).

        Es idempotente: repetir la misma resolución con la misma nota responde `200` sin
        efectos ni eventos nuevos. Una resolución es definitiva: una decisión o nota distinta
        sobre una compra ya resuelta responde `409`.
      operationId: resolveExceptionPurchase
      security:
        - bearerAuth: []
      parameters:
        - name: purchaseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveExceptionPurchaseRequest'
      responses:
        '200':
          description: La compra quedó resuelta (o ya lo estaba con exactamente esta decisión y nota).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResolutionResponse'
        '400':
          description: >-
            `resolution` ausente o desconocida, `note` vacía o de más de 500 caracteres, o
            `purchaseId` que no es un UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                solicitud_invalida:
                  value:
                    type: https://menta.dance/problems/invalid_request
                    title: Bad Request
                    status: 400
                    detail: La solicitud es inválida.
                    code: INVALID_REQUEST
        '401':
          description: Falta un access token válido.
        '403':
          description: El caller autenticado no tiene rol ADMIN.
        '404':
          description: La compra no existe.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                compra_inexistente:
                  value:
                    type: https://menta.dance/problems/purchase_not_found
                    title: Not Found
                    status: 404
                    detail: No se encontró la compra indicada.
                    code: PURCHASE_NOT_FOUND
        '409':
          description: >-
            La compra no está en `EXCEPTION` (`ILLEGAL_PURCHASE_STATE_TRANSITION`) o ya fue
            resuelta con otra decisión o nota (`PURCHASE_ALREADY_RESOLVED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                estado_invalido:
                  value:
                    type: https://menta.dance/problems/illegal_purchase_state_transition
                    title: Conflict
                    status: 409
                    detail: La compra no está en un estado que admita esta operación.
                    code: ILLEGAL_PURCHASE_STATE_TRANSITION
                ya_resuelta:
                  value:
                    type: https://menta.dance/problems/purchase_already_resolved
                    title: Conflict
                    status: 409
                    detail: La compra ya fue resuelta de otra forma.
                    code: PURCHASE_ALREADY_RESOLVED

  /api/v1/admin/billing/payments/{paymentId}:
    get:
      tags: [Verificación manual de pagos]
      summary: Detalle de un pago con comprobante firmado (ADMIN)
      description: |
        Devuelve el pago, su comprador y su plan/curso destino. Cuando existe un comprobante
        subido, incluye `proofUrl`: una URL firmada con expiración embebida de 15 minutos,
        recién emitida en cada llamada — nunca una URL cacheada o persistida. Es una ruta relativa
        a la API.
      operationId: getPaymentDetail
      security:
        - bearerAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle del pago, con `proofUrl` en `null` si no hay un comprobante subido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDetailResponse'
        '400':
          $ref: '#/components/responses/InvalidPaymentId'
        '401':
          description: Falta un access token válido.
        '403':
          description: El caller autenticado no tiene rol ADMIN.
        '404':
          description: El pago indicado no existe.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                pago_no_encontrado:
                  value:
                    type: https://menta.dance/problems/payment_not_found
                    title: Not Found
                    status: 404
                    detail: No se encontró el pago indicado.
                    code: PAYMENT_NOT_FOUND

  /api/v1/admin/billing/payments/{paymentId}/corrections:
    post:
      tags: [Verificación manual de pagos]
      summary: Corregir excepcionalmente un pago en RECONCILIATION_REQUIRED (ADMIN)
      description: |
        Resuelve, con motivo y evidencia obligatorios, un pago varado en
        `PENDING/RECONCILIATION_REQUIRED` hacia un estado terminal (D9: una transición de
        estado, nunca una edición de datos — misma forma que `resolveManually`, aplicada a este
        estado de partida distinto). Marca resuelta la tarea de reconciliación ligada al pago
        (`resolved`/`resolved_at`/`resolved_by`) y escribe una fila en `billing_audit_log` con
        `reason` compuesto como `"{motivo} | evidencia: {evidencia}"` (D4). A diferencia de
        aprobar/rechazar, esta operación **no** envía email al comprador — fuera del alcance de
        este cambio (ni el requerimiento de spec ni los Success Criteria de la propuesta lo
        piden).
      operationId: correctPayment
      security:
        - bearerAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectPaymentRequest'
      responses:
        '200':
          description: Corrección aplicada; el pago pasó a su estado terminal elegido.
        '400':
          description: >-
            `reason` o `evidence` ausentes o en blanco, o `paymentId` que no es un UUID
            (`INVALID_REQUEST`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Falta un access token válido.
        '403':
          description: El caller autenticado no tiene rol ADMIN. No se modifica nada.
        '404':
          description: El pago indicado no existe.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >-
            El pago no está en `RECONCILIATION_REQUIRED` (por ejemplo, ya fue aprobado, rechazado
            o corregido antes). No se modifica ni el pago ni ninguna tarea de reconciliación.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                estado_no_admite_correccion:
                  value:
                    type: https://menta.dance/problems/illegal_payment_state_transition
                    title: Conflict
                    status: 409
                    detail: El pago no está en un estado que admita esta operación.
                    code: ILLEGAL_PAYMENT_STATE_TRANSITION

  /api/v1/admin/billing/payments/{paymentId}/approve:
    post:
      tags: [Verificación manual de pagos]
      summary: Aprobar un pago por transferencia en verificación manual (ADMIN)
      description: |
        Pasa el pago de `AWAITING_MANUAL_VERIFICATION` a `COMPLETED`, asegura el cumplimiento de
        lo comprado, registra la aprobación en `billing_audit_log` y avisa por email al comprador
        (#31, US-BILLING-003). No lleva body: el admin sale del token.
      operationId: approvePayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentIdPath'
      responses:
        '200':
          description: Pago aprobado. Sin body.
        '400':
          $ref: '#/components/responses/InvalidPaymentId'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/PaymentNotFound'
        '409':
          $ref: '#/components/responses/IllegalPaymentStateTransition'

  /api/v1/admin/billing/payments/{paymentId}/reject:
    post:
      tags: [Verificación manual de pagos]
      summary: Rechazar un pago por transferencia en verificación manual (ADMIN)
      description: |
        Pasa el pago de `AWAITING_MANUAL_VERIFICATION` a `REJECTED`, libera el cupo retenido,
        registra el rechazo con su `reason` en `billing_audit_log` y avisa por email al comprador
        (#31, US-BILLING-003). `reason` es obligatorio.
      operationId: rejectPayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectPaymentRequest'
      responses:
        '200':
          description: Pago rechazado. Sin body.
        '400':
          description: >-
            `paymentId` que no es un UUID (`INVALID_REQUEST`), o `reason` ausente o en blanco.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                payment_id_invalido:
                  value:
                    type: https://menta.dance/problems/invalid_request
                    title: Bad Request
                    status: 400
                    detail: La solicitud es inválida.
                    code: INVALID_REQUEST
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/PaymentNotFound'
        '409':
          $ref: '#/components/responses/IllegalPaymentStateTransition'

  /api/v1/billing/payments/me:
    get:
      tags: [Pagos]
      summary: Listar los pagos propios
      description: |
        Devuelve los pagos del usuario autenticado, del más nuevo al más viejo (por fecha de
        creación y, ante el mismo instante, por `paymentId` descendente). El usuario sale del
        token: no hay parámetro de usuario, así que nunca se ven los pagos de otro. Sin pagos
        responde `200 []`.

        Incluye todos los estados y los dos medios de pago (Mercado Pago y transferencia). `item`
        indica qué se compró: una suscripción a un plan (`id` del plan y su nombre) o un curso
        presencial (`id` del curso; `name` siempre `null`, porque el nombre vive en el módulo
        presencial y no se resuelve con otra consulta).

        Nunca expone el comprobante de una transferencia ni su archivo, identificadores ni
        respuestas del proveedor de pago, la referencia externa, la cuenta de cobro ni el motivo
        de una conciliación.
      operationId: listOwnPayments
      parameters:
        - name: limit
          in: query
          required: false
          description: Cantidad máxima de pagos a devolver.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Pagos del usuario, del más nuevo al más viejo; `[]` si no tiene.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OwnPaymentResponse'
        '400':
          description: "`limit` no es un entero entre 1 y 100."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                limit_invalido:
                  value:
                    type: https://menta.dance/problems/invalid_request
                    title: Bad Request
                    status: 400
                    detail: El parámetro limit debe ser un número entre 1 y 100.
                    code: INVALID_REQUEST
        '401':
          description: Falta un access token válido.

  /api/v1/billing/payments/{paymentId}:
    get:
      tags: [Pagos]
      summary: Consultar el estado de un pago propio
      description: |
        Devuelve el estado del pago del usuario autenticado y, cuando existe, el estado de
        cumplimiento (`fulfillment`) de su compra (#559).

        `fulfillment` es `null` cuando el pago no tiene una compra asociada — por ejemplo una
        suscripción, o un pago `COMPLETED` cuyo evento todavía no fue procesado por el outbox.
        Siempre se serializa: nunca está ausente.

        Sólo se expone el nombre del estado. El motivo de la excepción, el tipo de resolución y
        la nota administrativa no forman parte de este contrato.

        Un pago de otro usuario y un pago inexistente responden el mismo `404 PAYMENT_NOT_FOUND`
        (anti-enumeración): nunca `403`.
      operationId: getPaymentStatus
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estado actual del pago y de su compra, si existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatusResponse'
        '400':
          $ref: '#/components/responses/InvalidPaymentId'
        '401':
          description: Falta un access token válido.
        '404':
          description: El pago no existe o pertenece a otro usuario.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                pago_inexistente:
                  value:
                    type: https://menta.dance/problems/payment_not_found
                    title: Not Found
                    status: 404
                    detail: No se encontró el pago.
                    code: PAYMENT_NOT_FOUND

  /api/v1/billing/payments/{paymentId}/proof:
    get:
      tags: [Verificación manual de pagos]
      summary: Servir el archivo de un comprobante mediante token firmado
      description: |
        Sirve el archivo del comprobante cuando el token en `?token=` está presente, vigente
        (menos de 15 minutos desde su emisión) y su firma HMAC (`Mac` + `MessageDigest.isEqual`,
        mismo mecanismo que `HmacSha256WebhookSignatureVerifier`) verifica contra el payload.

        Este endpoint **no requiere rol ADMIN** — el token es la credencial (D1). No vive bajo
        `/api/v1/admin/**`: tiene su propia regla explícita `permitAll` en `SecurityConfig`, no
        una ausencia de regla.

        Un token **ausente** responde `401`. Un token presente pero alterado, expirado, o
        firmado para un `paymentId` distinto responde `403` — deliberadamente indistinguible
        entre sí (propiedad anti-oráculo: la respuesta nunca revela si un token "nunca fue
        válido" o "ya expiró").
      operationId: getPaymentProof
      security: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: Token HMAC firmado, emitido por el detalle del pago (ADMIN). Ausente ⇒ `401`.
      responses:
        '200':
          description: >-
            Bytes del comprobante, con `Content-Disposition: inline` y `Cache-Control: no-store`. El
            `Content-Type` es el que se declaró al subirlo.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/InvalidPaymentId'
        '401':
          description: El parámetro `token` está ausente.
        '403':
          description: >-
            El token está presente pero es inválido — alterado, expirado, o firmado para otro
            `paymentId`. Respuesta idéntica en los tres casos (anti-oráculo).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                token_invalido:
                  value:
                    type: https://menta.dance/problems/invalid_proof_token
                    title: Forbidden
                    status: 403
                    detail: El enlace de comprobante no es válido o expiró.
                    code: INVALID_PROOF_TOKEN

    post:
      tags: [Verificación manual de pagos]
      summary: Subir o reemplazar el comprobante de una transferencia propia
      description: |
        El dueño del pago sube el comprobante (PNG, JPEG o PDF, hasta 5 MB, con firma de contenido
        coincidente con el tipo declarado) mientras el pago está en `AWAITING_MANUAL_VERIFICATION`
        (#31, US-BILLING-003). Un comprobante nuevo reemplaza al anterior. La cuota de subidas
        sólo se consume si el archivo es válido: por defecto 3 subidas cada 72 horas por pago.

        Un pago inexistente, de otro usuario o que ya no espera verificación responden el mismo
        `404 PAYMENT_NOT_FOUND` (anti-enumeración): nunca `403`.
      operationId: submitPaymentProof
      parameters:
        - $ref: '#/components/parameters/PaymentIdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Comprobante, `image/png`, `image/jpeg` o `application/pdf`.
      responses:
        '200':
          description: Comprobante guardado. Sin body.
        '400':
          description: >-
            `PAYMENT_PROOF_REJECTED`: tipo no permitido, archivo vacío o de más de 5 MB, o contenido
            que no coincide con el tipo declarado. `INVALID_REQUEST`: `paymentId` que no es un UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                comprobante_rechazado:
                  value:
                    type: https://menta.dance/problems/payment_proof_rejected
                    title: Bad Request
                    status: 400
                    detail: "El comprobante no cumple los requisitos: debe ser PNG, JPG/JPEG o PDF de hasta 5MB."
                    code: PAYMENT_PROOF_REJECTED
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          $ref: '#/components/responses/PaymentNotFound'
        '429':
          $ref: '#/components/responses/BankTransferRateLimited'
        '503':
          $ref: '#/components/responses/BillingDegraded'

  /api/v1/billing/payments/mercadopago/webhook:
    post:
      tags: [Webhooks]
      summary: Recibir notificación de pago de Mercado Pago
      description: |
        Verifica `HMAC-SHA256` de `x-signature` (comparación timing-safe) y
        rechaza timestamps con más de 5 minutos de antigüedad. Persiste y
        deduplica la notificación como `RECEIVED` en el inbox durable —
        responde `200` incluso ante un duplicado, sólo después de comprobar
        esa persistencia. Nunca consulta al proveedor ni aplica ningún efecto
        de pago en este hilo: eso corre en un worker asíncrono
        (docs/06-BILLING-API.md, ADR-0038).
      operationId: receiveMercadoPagoWebhook
      security: []
      parameters:
        - name: data.id
          in: query
          required: true
          schema:
            type: string
          description: Id del pago en Mercado Pago.
        - name: x-request-id
          in: header
          required: true
          schema:
            type: string
        - name: x-signature
          in: header
          required: true
          schema:
            type: string
          description: Formato `ts=<epoch-seconds>,v1=<hmac-sha256-hex>`.
      responses:
        '200':
          description: Notificación verificada y persistida (o ya vista antes — idempotente).
        '401':
          description: Firma inválida o timestamp vencido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                firma_invalida:
                  value:
                    type: https://menta.dance/problems/webhook_signature_invalid
                    title: Unauthorized
                    status: 401
                    detail: Webhook signature verification failed.
                    code: WEBHOOK_SIGNATURE_INVALID
                timestamp_vencido:
                  value:
                    type: https://menta.dance/problems/webhook_timestamp_expired
                    title: Unauthorized
                    status: 401
                    detail: Webhook timestamp is too old.
                    code: WEBHOOK_TIMESTAMP_EXPIRED

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT emitido por Auth.

  parameters:
    PaymentIdPath:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CourseIdPath:
      name: courseId
      in: path
      required: true
      description: Id del curso presencial.
      schema:
        type: string

  responses:
    AuthenticationRequired:
      description: Falta un access token válido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            authentication_required:
              value:
                type: https://menta.dance/problems/authentication_required
                title: Unauthorized
                status: 401
                detail: Authentication is required.
                code: AUTHENTICATION_REQUIRED

    AccessDenied:
      description: El caller autenticado no tiene rol ADMIN.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            access_denied:
              value:
                type: https://menta.dance/problems/access_denied
                title: Forbidden
                status: 403
                detail: You are not authorized to access this resource.
                code: ACCESS_DENIED

    InvalidPaymentId:
      description: '`paymentId` no es un UUID.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            payment_id_invalido:
              value:
                type: https://menta.dance/problems/invalid_request
                title: Bad Request
                status: 400
                detail: La solicitud es inválida.
                code: INVALID_REQUEST

    PaymentNotFound:
      description: >-
        El pago no existe. En las rutas del alumno también cuando es de otro usuario o ya no espera
        verificación (anti-enumeración).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            pago_no_encontrado:
              value:
                type: https://menta.dance/problems/payment_not_found
                title: Not Found
                status: 404
                detail: No se encontró el pago indicado.
                code: PAYMENT_NOT_FOUND

    IllegalPaymentStateTransition:
      description: >-
        El pago no está en `AWAITING_MANUAL_VERIFICATION` (por ejemplo, ya fue aprobado o rechazado).
        No se modifica nada.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            estado_no_admite_la_operacion:
              value:
                type: https://menta.dance/problems/illegal_payment_state_transition
                title: Conflict
                status: 409
                detail: El pago no está en un estado que admita esta operación.
                code: ILLEGAL_PAYMENT_STATE_TRANSITION

    BankTransferRateLimited:
      description: >-
        Se agotó el cupo por transferencia bancaria: las creaciones por usuario (compartidas entre
        suscripciones y compras presenciales) o las subidas de comprobante por pago.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Segundos hasta poder reintentar.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            bank_transfer_rate_limited:
              value:
                type: https://menta.dance/problems/bank_transfer_rate_limited
                title: Too Many Requests
                status: 429
                detail: Demasiadas solicitudes de suscripción por transferencia; reintentá más tarde.
                code: BANK_TRANSFER_RATE_LIMITED

    PlanRateLimited:
      description: Presupuesto de 60 req/min por IP agotado.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Segundos hasta poder reintentar.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            rate_limited:
              value:
                type: https://menta.dance/problems/plan_rate_limited
                title: Too Many Requests
                status: 429
                detail: Demasiadas solicitudes; reintentá más tarde.
                code: PLAN_RATE_LIMITED

    BillingDegraded:
      description: El limitador de Redis no está disponible; fail-closed.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            degraded:
              value:
                type: https://menta.dance/problems/billing_degraded
                title: Service Unavailable
                status: 503
                detail: El servicio de facturación no está disponible temporalmente.
                code: BILLING_DEGRADED

  schemas:
    Problem:
      type: object
      description: |
        RFC 9457 Problem Details con el miembro adicional `code`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        currentEndDate:
          type: string
          format: date-time
          description: Fecha de vencimiento de la suscripción que bloquea el checkout, si ya fue activada.
        acceptedPaymentMethods:
          type: array
          description: Medios de pago que acepta el plan cuando se rechaza el solicitado.
          items:
            type: string
        plansUrl:
          type: string
          description: Ruta del catálogo de planes; sólo en el `404 NO_SUBSCRIPTION`.

    CreateSubscriptionCheckoutRequest:
      type: object
      required: [planId, paymentMethod, idempotencyKey]
      properties:
        planId:
          type: string
          format: uuid
        paymentMethod:
          type: string
          enum: [MERCADO_PAGO, BANK_TRANSFER]
          description: >-
            `MERCADO_PAGO` usa Checkout Pro. `BANK_TRANSFER` (US-BILLING-003) deja el pago en espera
            de verificación manual y devuelve `bankTransferInstructions`.
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 128

    SubscriptionCheckoutResponse:
      type: object
      description: |
        Todos los campos están siempre presentes; los que no aplican al medio de pago van en `null`.
      required:
        [
          subscriptionId, paymentId, planId, status, providerPreferenceId, externalReference, checkoutUrl,
          overlapNotice, bankTransferInstructions,
        ]
      properties:
        subscriptionId:
          type: string
          format: uuid
        paymentId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, ACTIVE, EXPIRED, CANCELLED]
          description: >-
            `PENDING` al crear el checkout. Un replay por `idempotencyKey` (`MERCADO_PAGO`)
            devuelve la suscripción con su estado actual, que puede haber avanzado.
        providerPreferenceId:
          type: ["string", "null"]
          description: >-
            Identificador de la preferencia de Checkout Pro, no del pago. `null` con
            `BANK_TRANSFER`.
        externalReference:
          type: string
          description: Referencia local usada para correlacionar el webhook verificado.
        checkoutUrl:
          type: ["string", "null"]
          format: uri
          description: URL de redirección al Checkout Pro. `null` con `BANK_TRANSFER`.
        overlapNotice:
          description: |
            Presente y no bloqueante (`null` en caso contrario) cuando este checkout se
            superpone con una suscripción `CANCELLED` del mismo plan cuyo `endDate` todavía no
            venció (US-BILLING-011 D3). Se recalcula también en la respuesta de un replay por
            `idempotencyKey`. Siempre `null` con `BANK_TRANSFER`.
          oneOf:
            - $ref: "#/components/schemas/OverlapNotice"
            - type: "null"
        bankTransferInstructions:
          description: Presente sólo con `BANK_TRANSFER` (US-BILLING-003); `null` con Checkout Pro.
          oneOf:
            - $ref: "#/components/schemas/BankTransferInstructions"
            - type: "null"

    OverlapNotice:
      type: object
      required: [code, currentAccessEndsAt]
      properties:
        code:
          type: string
          enum: [OVERLAPPING_PAID_PERIOD]
        currentAccessEndsAt:
          type: string
          format: date-time
          description: >-
            `endDate` de la suscripción cancelada más reciente que aún otorga acceso para
            este plan.

    CurrentSubscriptionResponse:
      type: object
      description: |
        Un único objeto plano discriminado por `status`. Todos los campos están siempre presentes;
        los que no aplican a un estado van en `null`, nunca se omiten:

        - `ACTIVE`: `startDate`, `endDate`, `daysRemaining` y `expiringSoon` con valor;
          `checkoutUrl` y `plansUrl` en `null`.
        - `EXPIRED`: `startDate`, `endDate` y `plansUrl` (catálogo de planes, para renovar) con
          valor; `daysRemaining`, `expiringSoon` y `checkoutUrl` en `null`.
        - `PENDING`: sólo `checkoutUrl`; fechas y campos calculados en `null`.

        `type` tiene valor en los tres estados.
      required:
        [subscriptionId, planId, status, startDate, endDate, daysRemaining, expiringSoon, checkoutUrl, plansUrl, type]
      properties:
        subscriptionId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACTIVE, EXPIRED, PENDING]
        startDate:
          type: ["string", "null"]
          format: date-time
        endDate:
          type: ["string", "null"]
          format: date-time
        daysRemaining:
          type: ["integer", "null"]
          description: Días que faltan hasta `endDate`; sólo en `ACTIVE`.
        expiringSoon:
          type: ["boolean", "null"]
          description: "`true` si faltan 7 días o menos para `endDate`; sólo en `ACTIVE`."
        checkoutUrl:
          type: ["string", "null"]
          format: uri
          description: URL de Checkout Pro para completar el pago; sólo en `PENDING`.
        plansUrl:
          type: ["string", "null"]
          description: Ruta del catálogo de planes, para renovar; sólo en `EXPIRED`.
        type:
          type: string
          enum: [PAID, TRIAL]
          description: "`TRIAL`: prueba asignada por un admin. `PAID`: suscripción pagada."

    SubscriptionHistoryItemResponse:
      type: object
      description: |
        Una suscripción del historial. `startDate` y `endDate` van en `null` (nunca se omiten)
        mientras la suscripción está `PENDING`.
      required: [id, planId, status, startDate, endDate, type]
      properties:
        id:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, ACTIVE, EXPIRED, CANCELLED]
        startDate:
          type: ["string", "null"]
          format: date-time
        endDate:
          type: ["string", "null"]
          format: date-time
        type:
          type: string
          enum: [PAID, TRIAL]
          description: "`TRIAL`: prueba asignada por un admin. `PAID`: suscripción pagada."

    CancelSubscriptionResponse:
      type: object
      description: |
        Compartido por ambas rutas de cancelación. No declara `cancellationReason` — esa
        ausencia es intencional (US-BILLING-011 D2), no un campo opcional omitido.
      required: [subscriptionId, status, accessEndsAt, cancellationPolicy]
      properties:
        subscriptionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [CANCELLED]
        accessEndsAt:
          type: string
          format: date-time
          description: Igual al `endDate` ya vigente — la cancelación nunca lo mueve.
        cancellationPolicy:
          type: string
          description: Texto informativo del plan (`Plan.cancellationPolicy`).

    CancelSubscriptionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          description: Obligatorio y auditable en esta ruta; nunca se devuelve en la respuesta.

    AssignTrialRequest:
      type: object
      required: [userId, planId, reason, days]
      properties:
        userId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          description: Obligatorio y auditable en esta ruta; nunca se devuelve en la respuesta.
        days:
          type: integer
          minimum: 1
          description: >-
            Duración de la prueba en días, a criterio exclusivo del admin. Nunca se sustituye
            por `Plan.durationDays`.

    AssignTrialResponse:
      type: object
      required: [subscriptionId, userId, planId, type, status, startDate, endDate, days]
      properties:
        subscriptionId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        type:
          type: string
          enum: [TRIAL]
        status:
          type: string
          enum: [ACTIVE]
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        days:
          type: integer
          description: Igual al `days` solicitado por el admin — nunca `Plan.durationDays`.

    CreatePhysicalPurchaseRequest:
      type: object
      required: [quoteId, paymentMethod, idempotencyKey]
      properties:
        quoteId:
          type: string
          description: Id de una `PhysicalCourseQuote` vigente (no vencida).
        paymentMethod:
          type: string
          enum: [MERCADO_PAGO, BANK_TRANSFER]
          description: >-
            `MERCADO_PAGO` usa Checkout Pro. `BANK_TRANSFER` (#36, US-BILLING-008) crea el
            `Payment` directamente en `AwaitingManualVerification`, sin reservar capacidad ni
            llamar a ningún proveedor (design D1) — la capacidad se decide recién en la
            aprobación manual, a través del camino `HoldNotFound` ya existente.
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 128

    BankTransferInstructions:
      type: object
      description: >-
        Datos para completar una transferencia bancaria manual (#31/#36). Presente sólo cuando
        `paymentMethod` fue `BANK_TRANSFER`; `null` en una respuesta de Checkout Pro.
      required: [cbu, alias, holder, cuit, amount, reference]
      properties:
        cbu:
          type: string
        alias:
          type: string
        holder:
          type: string
        cuit:
          type: string
        amount:
          type: object
          required: [amount, currency]
          properties:
            amount:
              type: number
              format: decimal
            currency:
              type: string
              example: ARS
        reference:
          type: string
          description: Igual a `externalReference` — la referencia que el comprador debe citar en la transferencia.

    PhysicalPurchaseCheckoutResponse:
      type: object
      required:
        [
          paymentId, quoteId, status, providerPreferenceId, checkoutUrl, externalReference,
          bankTransferInstructions,
        ]
      properties:
        paymentId:
          type: string
          format: uuid
        quoteId:
          type: string
          description: Referencia de `PaymentTarget.Physical` — la cotización comprada, no una sesión (design A5).
        status:
          type: string
          enum: [PENDING, COMPLETED, REJECTED, CANCELLED, EXPIRED]
          description: >-
            `PENDING` al crear el checkout. Un replay por `idempotencyKey` devuelve el pago con su
            estado actual, que puede haber avanzado.
        providerPreferenceId:
          type: [string, "null"]
          description: >-
            Identificador de la preferencia de Checkout Pro, no del pago. `null` para un
            checkout `BANK_TRANSFER` (#36) — esta ruta nunca abre una preferencia.
        checkoutUrl:
          type: [string, "null"]
          format: uri
          description: URL de redirección al Checkout Pro. `null` para un checkout `BANK_TRANSFER` (#36).
        externalReference:
          type: string
          description: >-
            Referencia local usada para correlacionar el webhook verificado (`PHY-`) o, para
            `BANK_TRANSFER` (#36), la referencia que el comprador debe citar (`PHY-BT-`) —
            prefijos distintos y nunca colisionan entre sí (design C1).
        bankTransferInstructions:
          description: Presente sólo para un checkout `BANK_TRANSFER` (#36); `null` para Checkout Pro.
          oneOf:
            - $ref: "#/components/schemas/BankTransferInstructions"
            - type: "null"

    PlanCourseResponse:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: UUID global del curso (propiedad de Virtual o Physical).
        name:
          type: [string, "null"]
          description: |
            Título del curso resuelto en el catálogo de Virtual (curso
            `PUBLISHED`) o de Physical (curso `ACTIVE`); si el id existe en
            ambos gana el virtual. `null` cuando no se puede resolver: id
            inexistente, curso no visible públicamente, id que no es un UUID o
            falla del catálogo. El curso se devuelve igual, con su `id`.

    PlanSummaryResponse:
      type: object
      required: [id, name, description, price, currency, durationDays, featured, courses]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: decimal
        currency:
          type: string
          example: ARS
        durationDays:
          type: integer
        featured:
          type: boolean
        courses:
          type: array
          items:
            $ref: '#/components/schemas/PlanCourseResponse'

    PlanListResponse:
      type: object
      required: [plans]
      properties:
        plans:
          type: array
          items:
            $ref: '#/components/schemas/PlanSummaryResponse'

    PlanDetailResponse:
      type: object
      required: [id, name, description, price, currency, durationDays, featured, termsAndConditions, cancellationPolicy, courses]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: decimal
        currency:
          type: string
        durationDays:
          type: integer
        featured:
          type: boolean
        termsAndConditions:
          type: string
        cancellationPolicy:
          type: string
        courses:
          type: array
          items:
            $ref: '#/components/schemas/PlanCourseResponse'

    CreatePlanRequest:
      type: object
      required:
        [
          name, description, price, currency, durationDays, featured, status, termsAndConditions,
          cancellationPolicy, paymentMethods, courseIds,
        ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          minLength: 1
          maxLength: 16000
        price:
          type: number
          format: decimal
          exclusiveMinimum: 0
          description: Mayor a cero, con hasta ocho dígitos enteros y dos decimales.
          example: 15000.00
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Código ISO-4217.
          example: ARS
        durationDays:
          type: integer
          minimum: 1
        featured:
          type: boolean
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          description: Sólo un plan `ACTIVE` aparece en el catálogo público.
        termsAndConditions:
          type: string
          minLength: 1
          maxLength: 16000
        cancellationPolicy:
          type: string
          minLength: 1
          maxLength: 16000
        paymentMethods:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [MERCADO_PAGO, BANK_TRANSFER]
        courseIds:
          type: array
          description: Ids de cursos de Virtual o Physical que cubre el plan; puede ser vacía.
          items:
            type: string
            minLength: 1
            maxLength: 64

    PendingVerificationItemResponse:
      type: object
      description: |
        Una fila del inbox de admin (#33, US-BILLING-005, design C10). `targetReference`
        representa "plan": la referencia del destino del pago (plan de suscripción o curso
        presencial); `targetModality` distingue cuál de los dos.
      required:
        [paymentId, userId, targetModality, targetReference, amount, currency, statusType, hasProof, createdAt]
      properties:
        paymentId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        targetModality:
          type: string
          enum: [PHYSICAL, VIRTUAL]
        targetReference:
          type: string
        amount:
          type: number
          format: decimal
        currency:
          type: string
          example: ARS
        statusType:
          type: string
          enum: [AWAITING_MANUAL_VERIFICATION]
        hasProof:
          type: boolean
        createdAt:
          type: string
          format: date-time

    PendingVerificationPageResponse:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PendingVerificationItemResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    ExceptionPurchaseItemResponse:
      type: object
      description: |
        Una fila del inbox de compras en EXCEPTION (#237). No incluye `reason` (no persistido en
        `billing_purchases`) ni el email del comprador (identificado sólo por `userId`).
        `physicalSessionIds` es siempre un arreglo — `[]`, nunca `null`, cuando la excepción se
        originó sin sesiones cubiertas.
      required:
        [
          purchaseId, paymentId, userId, targetModality, targetReference, amount, currency,
          createdAt, physicalSessionIds
        ]
      properties:
        purchaseId:
          type: string
          format: uuid
        paymentId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        targetModality:
          type: string
          enum: [PHYSICAL, VIRTUAL]
        targetReference:
          type: string
        amount:
          type: number
          format: decimal
        currency:
          type: string
          example: ARS
        createdAt:
          type: string
          format: date-time
        physicalSessionIds:
          type: array
          items:
            type: string

    ExceptionPurchasePageResponse:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExceptionPurchaseItemResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    ResolveExceptionPurchaseRequest:
      type: object
      required: [resolution, note]
      properties:
        resolution:
          type: string
          enum: [REFUNDED, COMPENSATED]
          description: |
            `REFUNDED`: el dinero se devolvió al alumno. `COMPENSATED`: se lo compensó de otra
            forma (por ejemplo, una clase equivalente).
        note:
          type: string
          minLength: 1
          maxLength: 500
          description: Justificación obligatoria; se guarda sin espacios sobrantes en los extremos.

    PurchaseResolutionResponse:
      type: object
      description: La compra tras la resolución. Todos los campos de resolución están siempre presentes.
      required:
        [purchaseId, paymentId, status, resolution, note, resolvedBy, resolvedAt, physicalSessionIds]
      properties:
        purchaseId:
          type: string
          format: uuid
        paymentId:
          type: string
          format: uuid
        status:
          type: string
          enum: [RESOLVED]
        resolution:
          type: string
          enum: [REFUNDED, COMPENSATED]
        note:
          type: string
        resolvedBy:
          type: string
          format: uuid
          description: Id del ADMIN que tomó la decisión.
        resolvedAt:
          type: string
          format: date-time
        physicalSessionIds:
          type: array
          description: Sesiones que cubría la compra; nunca se asignaron. `[]` si no tenía ninguna.
          items:
            type: string

    OwnPaymentResponse:
      type: object
      description: |
        Un pago propio (#767). Monto y moneda van planos, como en el resto de Billing. Nunca
        expone datos internos del pago ni de su comprobante.
      required: [paymentId, status, amount, currency, paymentMethod, createdAt, item]
      properties:
        paymentId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            [AWAITING_PROVIDER, AWAITING_MANUAL_VERIFICATION, RECONCILIATION_REQUIRED, COMPLETED, REJECTED, CANCELLED, EXPIRED]
        amount:
          type: number
          format: decimal
        currency:
          type: string
          description: Código ISO-4217.
        paymentMethod:
          type: string
          enum: [MERCADO_PAGO, BANK_TRANSFER]
          description: Medio con el que se creó el pago; se guarda con el pago, no se deduce al leer.
        createdAt:
          type: string
          format: date-time
        item:
          $ref: '#/components/schemas/OwnPaymentItem'

    OwnPaymentItem:
      type: object
      description: Qué se compró con el pago.
      required: [type, id, name]
      properties:
        type:
          type: string
          enum: [SUBSCRIPTION, PHYSICAL_COURSE]
          description: "`SUBSCRIPTION`: suscripción a un plan virtual. `PHYSICAL_COURSE`: compra de un curso presencial."
        id:
          type: string
          description: Id del plan (`SUBSCRIPTION`) o del curso presencial (`PHYSICAL_COURSE`).
        name:
          type: ["string", "null"]
          description: Nombre del plan; siempre `null` para un curso presencial.

    PaymentStatusResponse:
      type: object
      description: |
        Estado de un pago propio. `fulfillment` refleja la compra asociada (#559) y es `null`
        cuando no existe una; nunca expone motivo, tipo de resolución ni nota.
      required: [status, createdAt, updatedAt, fulfillment]
      properties:
        status:
          type: string
          enum:
            [AWAITING_PROVIDER, AWAITING_MANUAL_VERIFICATION, RECONCILIATION_REQUIRED, COMPLETED, REJECTED, CANCELLED, EXPIRED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: Momento del último cambio de estado; igual a `createdAt` si nunca cambió.
        fulfillment:
          type: ["string", "null"]
          enum: [PENDING_FULFILLMENT, ASSIGNED, EXCEPTION, RESOLVED, null]
          description: Estado de cumplimiento de la compra, o `null` si el pago no tiene una.

    PaymentDetailResponse:
      type: object
      description: |
        `proofUrl` siempre se serializa: es `null` cuando nunca se subió un comprobante; en caso
        contrario embebe un token firmado recién emitido con expiración de 15 minutos, nunca uno
        cacheado.
      required:
        [paymentId, userId, targetModality, targetReference, amount, currency, statusType, createdAt, proofUrl]
      properties:
        paymentId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        targetModality:
          type: string
          enum: [PHYSICAL, VIRTUAL]
        targetReference:
          type: string
        amount:
          type: number
          format: decimal
        currency:
          type: string
        statusType:
          type: string
          enum:
            [AWAITING_PROVIDER, AWAITING_MANUAL_VERIFICATION, RECONCILIATION_REQUIRED, COMPLETED, REJECTED, CANCELLED, EXPIRED]
        createdAt:
          type: string
          format: date-time
        proofUrl:
          type: ["string", "null"]
          description: >-
            Ruta relativa a la API (`/api/v1/billing/payments/{paymentId}/proof?token=...`) con el
            token firmado; `null` si el pago no tiene un comprobante subido.

    CorrectPaymentRequest:
      type: object
      description: |
        A diferencia de `RejectPaymentRequest`, tanto `reason` como `evidence` son obligatorios
        sin importar `decision` (D9).
      required: [decision, reason, evidence]
      properties:
        decision:
          type: string
          enum: [APPROVED, REJECTED]
        reason:
          type: string
          minLength: 1
          description: Motivo de la corrección — auditable, compuesto en `billing_audit_log`.
        evidence:
          type: string
          minLength: 1
          description: Evidencia verificable presentada por el admin — compuesta en `billing_audit_log` (D4).

    RejectPaymentRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          description: Motivo del rechazo — obligatorio, auditable y enviado al comprador por email.

    PhysicalCoursePricingResponse:
      type: object
      description: Precio vigente de un curso presencial. Todos los campos están siempre presentes.
      required: [courseId, monthlyPrice, currency, individualSurchargePercent, version, updatedAt]
      properties:
        courseId:
          type: string
        monthlyPrice:
          type: number
          format: decimal
        currency:
          type: string
          description: Código ISO-4217.
          example: ARS
        individualSurchargePercent:
          type: number
          format: decimal
          description: Recargo porcentual de una clase individual sobre su parte del precio mensual.
        version:
          type: integer
          description: Número de versión del precio; la primera publicación es la 1.
        updatedAt:
          type: string
          format: date-time

    UpdatePhysicalCoursePricingRequest:
      type: object
      required: [monthlyPrice, individualSurchargePercent, reason]
      properties:
        monthlyPrice:
          type: number
          format: decimal
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          default: ARS
          description: Código ISO-4217. Si se omite o va en blanco, `ARS`.
        individualSurchargePercent:
          type: number
          format: decimal
          exclusiveMinimum: 0
          description: Debe ser mayor a cero; si no, `422 INVALID_INDIVIDUAL_SURCHARGE`.
        reason:
          type: string
          minLength: 1
          description: Motivo del cambio — obligatorio y auditable.

    CreatePhysicalCourseQuoteRequest:
      type: object
      required: [courseId, purchaseType]
      properties:
        courseId:
          type: string
          minLength: 1
        purchaseType:
          type: string
          enum: [MONTHLY, INDIVIDUAL]
        selectedSessionId:
          type: string
          description: Obligatorio con `INDIVIDUAL`; prohibido con `MONTHLY`.

    PhysicalCourseQuoteResponse:
      type: object
      description: Cotización vigente durante 1 hora. Todos los campos están siempre presentes.
      required:
        [
          id, courseId, purchaseType, scheduledSessionCount, selectedSessionId, amount, currency, availability,
          pricingVersion, createdAt, expiresAt,
        ]
      properties:
        id:
          type: string
          format: uuid
          description: Es el `quoteId` de `POST /api/v1/billing/physical/purchases`.
        courseId:
          type: string
        purchaseType:
          type: string
          enum: [MONTHLY, INDIVIDUAL]
        scheduledSessionCount:
          type: integer
          description: Sesiones programadas del período cotizado.
        selectedSessionId:
          type: ["string", "null"]
          description: La sesión elegida; `null` con `MONTHLY`.
        amount:
          type: number
          format: decimal
        currency:
          type: string
          example: ARS
        availability:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
          description: Informativa; nunca reserva cupo.
        pricingVersion:
          type: integer
          description: Versión del precio con la que se calculó `amount`.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

security:
  - bearerAuth: []
