openapi: 3.1.0

# Contrato HTTP de la superficie Virtual v1.
#
# Escrito y versionado a mano, mismo criterio que auth-v1.yaml/billing-v1.yaml/
# physical-v1.yaml: el diff se revisa en el PR igual que la colección Bruno.
#
# Sólo describe endpoints IMPLEMENTADOS. Cubre todas las rutas de producción
# de los controllers de virtual (20): gestión de cursos, módulos y lecciones
# (ADMIN/INSTRUCTOR), detalle y streaming público de lecciones con autorización
# resuelta del lado del servidor (US-VIRTUAL-003/004/007) y progreso del alumno
# (guardar, leer y completar una lección; progreso y cursos en progreso por
# curso, US-VIRTUAL-005, #765).
#
# Un test (VirtualOpenApiContractTest) lee los controllers y los records reales
# y falla si una ruta, un campo o un enum cambian sin este contrato.

info:
  title: Menta Dance — Virtual API
  version: "1.0.0"
  description: |
    Gestión de cursos, módulos y lecciones virtuales (US-VIRTUAL-006) para
    ADMIN/PROFESOR, detalle y streaming de lecciones con autorización por
    suscripción (US-VIRTUAL-003/004) y progreso del alumno en lecciones y
    cursos (US-VIRTUAL-005, #765).

    ## Errores

    Todos los errores usan `application/problem+json` (RFC 9457) con un
    miembro adicional `code` estable. Los clientes deben discriminar por
    `code`, no por `detail`.

    ## Autorización

    `/api/v1/admin/virtual/courses/**`, `/api/v1/admin/virtual/modules/**` y
    `/api/v1/admin/virtual/lessons/**` aceptan tanto `ADMIN` como
    `INSTRUCTOR` (rol interno de `PROFESOR`) — la coincidencia de rol se
    verifica en el filtro de seguridad; la propiedad del curso dueño de un
    módulo o lección se verifica en el caso de uso (`403 COURSE_NOT_OWNED`).
    Ni un módulo ni una lección tienen `professorId` propio: la autorización
    siempre se resuelve a través del curso padre. Sin token responde
    `401 AUTHENTICATION_REQUIRED`; con otro rol, `403 ACCESS_DENIED`.
    `GET /api/v1/admin/virtual/courses/{courseId}` también comprueba la
    propiedad del curso (`403 COURSE_NOT_OWNED`; un id inexistente responde
    `404 COURSE_NOT_FOUND`).

    Las rutas de progreso del alumno aceptan cualquier rol autenticado y el
    usuario sale siempre del token. Las dos lecturas públicas de lecciones
    aceptan el token de forma opcional.

    ## Fechas

    Los instantes (`expiresAt`, `completedAt`) van en UTC, ISO-8601 con `Z`.

servers:
  - url: http://localhost:8081
    description: Desarrollo local
  - url: https://api.mentadance.com
    description: Producción

tags:
  - name: Gestión de cursos
    description: Administración de cursos virtuales (ADMIN/PROFESOR).
  - name: Gestión de módulos
    description: Administración de módulos de un curso virtual (ADMIN/PROFESOR).
  - name: Gestión de lecciones
    description: Administración de lecciones de un módulo (ADMIN/PROFESOR).
  - name: Lecciones públicas
    description: Detalle y streaming de lecciones con autorización de suscripción.
  - name: Progreso del alumno
    description: Progreso del usuario autenticado en los cursos virtuales.

paths:
  /api/v1/virtual/lessons/{lessonId}:
    get:
      tags: [Lecciones públicas]
      summary: Obtener detalle de una lección publicada
      description: |
        No requiere autenticación para las rutas públicas: lección gratuita o
        lección de un módulo preview. Una lección gratuita responde la variante
        con `subscription` y `lesson.videoId: null`; el resto de las lecciones
        accesibles (módulo preview o suscripción vigente) responde la variante
        sin `subscription` y con `lesson.videoId`, que es `null` si la lección
        todavía no tiene video. `access.preview` es `true` sólo en la variante
        gratuita. El detalle nunca contiene una URL de streaming. Una lección
        protegida sin entitlement actual responde 403 RFC 9457 y no expone
        `videoId`.
      operationId: getPublicVirtualLesson
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LessonId'
      responses:
        '200':
          description: Lección pública o protegida autorizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicLessonDetailResponse'
        '403':
          $ref: '#/components/responses/LessonForbidden'
        '404':
          description: Lección inexistente, inválida o cuyo curso no está publicado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                no_encontrada:
                  value:
                    type: https://menta.dance/problems/lesson_not_found
                    title: Not Found
                    status: 404
                    detail: Lección no encontrada.
                    code: LESSON_NOT_FOUND

  /api/v1/virtual/lessons/{lessonId}/stream:
    get:
      tags: [Lecciones públicas]
      summary: Emitir una URL temporal de streaming para una lección autorizada
      description: |
        Evalúa la misma política de acceso que el detalle. Sólo una respuesta
        200 contiene `stream.url`; los 403 son `application/problem+json` y
        nunca contienen URL, `videoId` ni otra capacidad de media.
      operationId: getPublicVirtualLessonStream
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LessonId'
      responses:
        '200':
          description: >-
            URL firmada temporalmente (Token Authentication de la CDN) para una lección autorizada. Hoy apunta a
            un archivo MP4; `stream.type` conserva el valor constante `HLS` por compatibilidad del contrato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicLessonStreamResponse'
        '403':
          $ref: '#/components/responses/LessonForbidden'
        '404':
          description: Lección inexistente, inválida o no publicada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                no_encontrada:
                  value:
                    type: https://menta.dance/problems/lesson_not_found
                    title: Not Found
                    status: 404
                    detail: Lección no encontrada.
                    code: LESSON_NOT_FOUND

  /api/v1/virtual/courses/me/in-progress:
    get:
      tags: [Progreso del alumno]
      summary: Listar los cursos en progreso del alumno autenticado
      description: |
        Devuelve los cursos que el usuario del token está cursando, con la
        lección para continuar cada uno (#765). El usuario sale siempre del
        token: no hay parámetro de usuario. Cualquier rol autenticado puede
        consultarlo.

        Un curso aparece solo si está publicado, el usuario tiene progreso en
        al menos una de sus lecciones, no completó todas (`percentage < 100`) y
        hoy tiene acceso con la misma regla que `GET .../{courseId}/progress`
        (suscripción vigente). Un curso al que perdió acceso no aparece, en vez
        de responder `403`.

        Orden: actividad más reciente primero (último guardado de posición en
        el curso; un curso con lecciones solo completadas y nunca reproducidas
        va al final). `percentage`, `completedLessons`, `totalLessons` y
        `resumeLesson` tienen la misma definición que en el progreso por curso.
      operationId: listMyInProgressVirtualCourses
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Cantidad máxima de cursos a devolver.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Cursos en progreso; arreglo vacío si no hay ninguno.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/InProgressCourseResponse'
        '400':
          description: '`limit` no es un entero entre 1 y 50.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                limite_invalido:
                  value:
                    type: https://menta.dance/problems/invalid_request
                    title: Bad Request
                    status: 400
                    detail: El parámetro limit debe ser un número entre 1 y 50.
                    code: INVALID_REQUEST
        '401':
          $ref: '#/components/responses/AuthenticationRequired'

  /api/v1/virtual/courses/{courseId}/progress:
    get:
      tags: [Progreso del alumno]
      summary: Obtener el progreso del alumno autenticado en un curso
      description: |
        Lecciones completadas sobre el total del curso, porcentaje y lección
        para continuar (la de posición guardada más reciente). El porcentaje se
        redondea hacia arriba desde la mitad y vale 100 solo si todas las
        lecciones están completadas. Cualquier rol autenticado puede
        consultarlo; requiere acceso vigente al curso.
      operationId: getMyVirtualCourseProgress
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Progreso del usuario en el curso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseProgressResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          description: El usuario no tiene un entitlement vigente para el curso.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                subscription_required:
                  value:
                    type: https://menta.dance/problems/course_progress_forbidden_subscription_required
                    title: Forbidden
                    status: 403
                    detail: Este curso requiere una suscripción activa
                    code: COURSE_PROGRESS_FORBIDDEN_SUBSCRIPTION_REQUIRED
        '404':
          description: Curso inexistente, con id inválido o no publicado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                no_encontrado:
                  value:
                    type: https://menta.dance/problems/course_not_found
                    title: Not Found
                    status: 404
                    detail: Curso no encontrado.
                    code: COURSE_NOT_FOUND

  /api/v1/virtual/lessons/{lessonId}/progress:
    put:
      tags: [Progreso del alumno]
      summary: Guardar la posición de reproducción del alumno en una lección
      description: |
        Guarda la posición (en segundos) del usuario del token; no altera el
        estado de completada. La posición debe estar entre 0 y la duración de
        la lección (`durationMinutes * 60`). `positionSeconds` es obligatorio:
        un body sin él (o `null`), vacío o ilegible responde
        `400 INVALID_REQUEST` y no modifica la posición guardada. Aplica la misma regla de acceso que el
        detalle de la lección: lección gratuita, módulo preview o suscripción
        vigente.
      operationId: saveMyVirtualLessonProgress
      parameters:
        - $ref: '#/components/parameters/LessonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveLessonProgressRequest'
      responses:
        '200':
          description: Progreso guardado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonProgressResponse'
        '400':
          description: >-
            La posición es negativa o supera la duración de la lección (`INVALID_LESSON_POSITION`), o el
            body es ilegible, está vacío o no trae `positionSeconds` (`INVALID_REQUEST`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                posicion_invalida:
                  value:
                    type: https://menta.dance/problems/invalid_lesson_position
                    title: Bad Request
                    status: 400
                    detail: Posición inválida.
                    code: INVALID_LESSON_POSITION
                body_invalido:
                  value:
                    type: https://menta.dance/problems/invalid_request
                    title: Bad Request
                    status: 400
                    detail: La solicitud contiene datos inválidos.
                    code: INVALID_REQUEST
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/LessonForbidden'
        '404':
          $ref: '#/components/responses/LessonNotFound'

    get:
      tags: [Progreso del alumno]
      summary: Obtener el progreso del alumno en una lección
      description: |
        Si el usuario todavía no tiene progreso en la lección devuelve 200 con
        `positionSeconds: 0`, `completed: false` y `completedAt: null`, no 404.
        La posición se recorta a la duración actual de la lección. Misma regla
        de acceso que el detalle de la lección.
      operationId: getMyVirtualLessonProgress
      parameters:
        - $ref: '#/components/parameters/LessonId'
      responses:
        '200':
          description: Progreso del usuario en la lección.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonProgressResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/LessonForbidden'
        '404':
          $ref: '#/components/responses/LessonNotFound'

  /api/v1/virtual/lessons/{lessonId}/complete:
    post:
      tags: [Progreso del alumno]
      summary: Marcar una lección como completada
      description: |
        Sin body. Es idempotente: repetirla no cambia `completedAt` y nunca
        mueve la posición guardada. Misma regla de acceso que el detalle de la
        lección.
      operationId: completeMyVirtualLesson
      parameters:
        - $ref: '#/components/parameters/LessonId'
      responses:
        '200':
          description: Lección completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonProgressResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/LessonForbidden'
        '404':
          $ref: '#/components/responses/LessonNotFound'

  /api/v1/admin/virtual/courses:
    post:
      tags: [Gestión de cursos]
      summary: Crear un curso virtual (en borrador)
      description: |
        El curso se crea siempre en `DRAFT`. `professorId` es opcional: un
        PROFESOR que lo omite queda asignado a sí mismo; si lo envía debe
        coincidir con su propio id, o responde `400 PROFESSOR_MISMATCH`.
        Sólo un ADMIN puede asignar el curso a un `professorId` arbitrario.
      operationId: createVirtualCourse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVirtualCourseRequest'
      responses:
        '201':
          description: Curso creado en DRAFT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualCourseManagementResponse'
        '400':
          $ref: '#/components/responses/InvalidCourseRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'

    get:
      tags: [Gestión de cursos]
      summary: Listar cursos de gestión
      description: |
        A diferencia del catálogo público (`GET /api/v1/catalog/courses`),
        devuelve cursos de cualquier estado. ADMIN ve todos los cursos;
        PROFESOR ve únicamente los propios.
      operationId: listManagedVirtualCourses
      responses:
        '200':
          description: Cursos visibles para el actor autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualCourseManagementListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'

  /api/v1/admin/virtual/courses/{courseId}:
    get:
      tags: [Gestión de cursos]
      summary: Obtener el detalle de gestión de un curso
      description: |
        Devuelve el curso completo con sus módulos y lecciones, incluidos los
        `videoId`, en cualquier estado (`DRAFT`, `PUBLISHED` o `ARCHIVED`): a
        diferencia del catálogo público, un curso no publicado no se oculta.
        Un id inexistente o mal formado responde `404 COURSE_NOT_FOUND`; esta
        lectura no tiene 400.

        Además del rol (ADMIN o INSTRUCTOR), comprueba la propiedad del curso,
        igual que las operaciones de escritura: un ADMIN lee cualquier curso,
        un PROFESOR sólo los suyos y uno ajeno responde `403 COURSE_NOT_OWNED`.
      operationId: getManagedVirtualCourse
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Detalle del curso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualCourseAdminDetailResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/NotOwned'
        '404':
          $ref: '#/components/responses/CourseNotFound'

    put:
      tags: [Gestión de cursos]
      summary: Actualizar un curso virtual (parcial)
      description: Sólo los campos presentes en el body cambian.
      operationId: updateVirtualCourse
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVirtualCourseRequest'
      responses:
        '200':
          description: Curso actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualCourseManagementResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/NotOwned'
        '404':
          $ref: '#/components/responses/CourseNotFound'

    delete:
      tags: [Gestión de cursos]
      summary: Eliminar un curso (sólo DRAFT)
      description: |
        Un curso que nunca fue publicado no puede tener suscriptores por
        construcción — esta restricción es suficiente sin consultar a
        Billing.
      operationId: deleteVirtualCourse
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '204':
          description: Curso eliminado.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/NotOwned'
        '404':
          $ref: '#/components/responses/CourseNotFound'
        '409':
          description: El curso no está en DRAFT.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                no_draft:
                  value:
                    type: https://menta.dance/problems/course_not_draft
                    title: Conflict
                    status: 409
                    detail: Only a DRAFT course can be deleted.
                    code: COURSE_NOT_DRAFT

  /api/v1/admin/virtual/courses/{courseId}/publish:
    put:
      tags: [Gestión de cursos]
      summary: Publicar un curso
      description: |
        Exige al menos un módulo con al menos una lección completa (título
        no vacío y `videoId` asignado) — si no, `400 COURSE_NOT_PUBLISHABLE`
        con el detalle de qué falta.
      operationId: publishVirtualCourse
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Curso publicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualCourseManagementResponse'
        '400':
          description: >-
            El curso no cumple los requisitos mínimos para publicarse, o el id no es un UUID
            (`INVALID_REQUEST`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                sin_modulos:
                  value:
                    type: https://menta.dance/problems/course_not_publishable
                    title: Bad Request
                    status: 400
                    detail: El curso no tiene ningún módulo.
                    code: COURSE_NOT_PUBLISHABLE
                id_invalido:
                  value:
                    type: https://menta.dance/problems/invalid_request
                    title: Bad Request
                    status: 400
                    detail: Malformed request.
                    code: INVALID_REQUEST
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/NotOwned'
        '404':
          $ref: '#/components/responses/CourseNotFound'

  /api/v1/admin/virtual/courses/{courseId}/unpublish:
    put:
      tags: [Gestión de cursos]
      summary: Despublicar un curso
      description: |
        Vuelve el curso a DRAFT. El acceso temporal de suscriptores
        activos es responsabilidad de la autorización de contenido
        (US-VIRTUAL-007, #56), no de este endpoint.
      operationId: unpublishVirtualCourse
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Curso despublicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualCourseManagementResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/NotOwned'
        '404':
          $ref: '#/components/responses/CourseNotFound'

  /api/v1/admin/virtual/courses/{courseId}/modules:
    post:
      tags: [Gestión de módulos]
      summary: Agregar un módulo a un curso
      description: '`order` es opcional — si se omite, se agrega al final.'
      operationId: createVirtualModule
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVirtualModuleRequest'
      responses:
        '201':
          description: Módulo creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualModuleManagementResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/NotOwned'
        '404':
          $ref: '#/components/responses/CourseNotFound'

  /api/v1/admin/virtual/courses/{courseId}/modules/reorder:
    put:
      tags: [Gestión de módulos]
      summary: Reordenar los módulos de un curso
      description: |
        `moduleIds` debe contener exactamente el conjunto actual de módulos
        del curso, en el nuevo orden deseado — ni de más ni de menos, o
        `400 MODULE_REORDER_MISMATCH`.
      operationId: reorderVirtualModules
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderVirtualModulesRequest'
      responses:
        '200':
          description: Módulos reordenados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualModuleManagementListResponse'
        '400':
          description: >-
            La lista no coincide con el conjunto actual de módulos, o el body es inválido, ilegible o
            está vacío, o un id no es válido (`INVALID_REQUEST`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                mismatch:
                  value:
                    type: https://menta.dance/problems/module_reorder_mismatch
                    title: Bad Request
                    status: 400
                    detail: The reorder list must contain exactly the course's current modules, no more, no less.
                    code: MODULE_REORDER_MISMATCH
                body_invalido:
                  value:
                    type: https://menta.dance/problems/invalid_request
                    title: Bad Request
                    status: 400
                    detail: La solicitud contiene datos inválidos.
                    code: INVALID_REQUEST
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/NotOwned'
        '404':
          $ref: '#/components/responses/CourseNotFound'

  /api/v1/admin/virtual/modules/{moduleId}:
    put:
      tags: [Gestión de módulos]
      summary: Actualizar un módulo (parcial)
      operationId: updateVirtualModule
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVirtualModuleRequest'
      responses:
        '200':
          description: Módulo actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualModuleManagementResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/NotOwned'
        '404':
          $ref: '#/components/responses/ModuleNotFound'

  /api/v1/admin/virtual/modules/{moduleId}/lessons:
    post:
      tags: [Gestión de lecciones]
      summary: Agregar una lección a un módulo
      description: |
        `durationMinutes` es un entero — no el string `"mm:ss"` que
        mostraba el borrador original de la historia, ya que la columna es
        `INT` desde #46. `videoId` es una referencia opaca a Bunny.net que
        el cliente ya conoce; Virtual sólo la guarda por valor. Es opcional:
        una lección puede crearse sin video (queda `videoId: null`), pero un
        curso sólo se publica si tiene al menos una lección con video. Un
        `videoId` en blanco (vacío o sólo espacios) no equivale a omitirlo y
        responde `400 INVALID_REQUEST`.
      operationId: createVirtualLesson
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVirtualLessonRequest'
      responses:
        '201':
          description: Lección creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualLessonManagementResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/NotOwned'
        '404':
          $ref: '#/components/responses/ModuleNotFound'

  /api/v1/admin/virtual/lessons/{lessonId}:
    put:
      tags: [Gestión de lecciones]
      summary: Actualizar una lección (parcial)
      description: |
        Sólo se aplican los campos presentes. `videoId` omitido o `null` deja
        el video como está; un `videoId` en blanco (vacío o sólo espacios) se
        rechaza con `400 INVALID_REQUEST` y no modifica la lección, porque un
        video no se puede quitar una vez asignado (sólo reemplazar por otro).
      operationId: updateVirtualLesson
      parameters:
        - $ref: '#/components/parameters/LessonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVirtualLessonRequest'
      responses:
        '200':
          description: Lección actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualLessonManagementResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/NotOwned'
        '404':
          description: Lección inexistente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                no_encontrada:
                  value:
                    type: https://menta.dance/problems/lesson_not_found
                    title: Not Found
                    status: 404
                    detail: Lesson not found.
                    code: LESSON_NOT_FOUND

    delete:
      tags: [Gestión de lecciones]
      summary: Eliminar una lección
      description: |
        Mismo acceso y misma regla de propiedad que la edición de la lección:
        un ADMIN borra cualquier lección; un PROFESOR sólo las de sus cursos
        (`403 COURSE_NOT_OWNED` en otro caso).

        - **Progreso de los alumnos**: se borra en cascada, en la misma
          transacción, todo el progreso guardado de la lección (posición y
          completado de cada alumno). Es la única tabla que referencia a una
          lección y no guarda datos de pago ni de auditoría; el porcentaje de
          un curso usa como denominador las lecciones que existen, así que
          sigue siendo coherente. El borrado no se rechaza por tener progreso.
        - **Orden**: las lecciones que quedan en el módulo se renumeran de
          forma contigua (`order` 0..n-1) conservando su orden relativo, en la
          misma transacción.
        - **Curso publicado**: se permite. Borrar un curso entero exige
          `DRAFT`, pero quitar una lección de un curso publicado es una
          edición normal del contenido, igual que el `PUT` de la lección. El
          curso sigue `PUBLISHED` aunque se quede sin lecciones completas: la
          validación de publicación sólo se aplica al publicar.
        - Queda una fila de auditoría `DELETE_LESSON` con los datos de la
          lección y la cantidad de filas de progreso borradas.
      operationId: deleteVirtualLesson
      parameters:
        - $ref: '#/components/parameters/LessonId'
      responses:
        '204':
          description: Lección eliminada, junto con su progreso; sin cuerpo.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/NotOwned'
        '404':
          description: Lección inexistente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                no_encontrada:
                  value:
                    type: https://menta.dance/problems/lesson_not_found
                    title: Not Found
                    status: 404
                    detail: Lesson not found.
                    code: LESSON_NOT_FOUND

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token JWT de 15 minutos, emitido por `POST /api/v1/auth/login`
        (ver auth-v1.yaml). Claims: `sub`, `roles`, `jti`, `tokenVersion`,
        `iat`, `exp`, `iss`, `aud`.

        El rol (`ADMIN`/`INSTRUCTOR`) se verifica en el filtro de seguridad y no
        es expresable en este esquema. Las rutas públicas de lecciones aceptan
        el token de forma opcional (`security: [{}, {bearerAuth: []}]`): sin
        token se resuelven como visitante anónimo.

  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModuleId:
      name: moduleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LessonId:
      name: lessonId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    InvalidRequest:
      description: >-
        Un id del path no es un UUID, un valor de enum (`level`) no existe, un número es negativo,
        el body no pasa la validación o es ilegible (JSON mal formado) o está vacío.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            id_invalido:
              value:
                type: https://menta.dance/problems/invalid_request
                title: Bad Request
                status: 400
                detail: Malformed request.
                code: INVALID_REQUEST
            body_invalido:
              value:
                type: https://menta.dance/problems/invalid_request
                title: Bad Request
                status: 400
                detail: La solicitud contiene datos inválidos.
                code: INVALID_REQUEST

    InvalidCourseRequest:
      description: >-
        Body inválido, ilegible (JSON mal formado) o vacío (`INVALID_REQUEST`), o `professorId` no
        coincide con el PROFESOR autenticado (`PROFESSOR_MISMATCH`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            body_invalido:
              value:
                type: https://menta.dance/problems/invalid_request
                title: Bad Request
                status: 400
                detail: La solicitud contiene datos inválidos.
                code: INVALID_REQUEST
            professor_mismatch:
              value:
                type: https://menta.dance/problems/professor_mismatch
                title: Bad Request
                status: 400
                detail: professorId must match the authenticated instructor.
                code: PROFESSOR_MISMATCH

    AccessDenied:
      description: El usuario autenticado no tiene rol ADMIN ni INSTRUCTOR.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            acceso_denegado:
              value:
                type: https://menta.dance/problems/access_denied
                title: Forbidden
                status: 403
                detail: You are not authorized to access this resource.
                code: ACCESS_DENIED

    NotOwned:
      description: >-
        El usuario autenticado no tiene rol ADMIN ni INSTRUCTOR (`ACCESS_DENIED`), o es un PROFESOR
        que no es dueño del curso (`COURSE_NOT_OWNED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            no_es_dueno:
              value:
                type: https://menta.dance/problems/course_not_owned
                title: Forbidden
                status: 403
                detail: You do not own this course.
                code: COURSE_NOT_OWNED
            acceso_denegado:
              value:
                type: https://menta.dance/problems/access_denied
                title: Forbidden
                status: 403
                detail: You are not authorized to access this resource.
                code: ACCESS_DENIED

    CourseNotFound:
      description: Curso inexistente.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            no_encontrado:
              value:
                type: https://menta.dance/problems/course_not_found
                title: Not Found
                status: 404
                detail: Course not found.
                code: COURSE_NOT_FOUND

    ModuleNotFound:
      description: Módulo inexistente.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            no_encontrado:
              value:
                type: https://menta.dance/problems/module_not_found
                title: Not Found
                status: 404
                detail: Module not found.
                code: MODULE_NOT_FOUND

    LessonForbidden:
      description: >-
        La lección protegida no tiene un entitlement actual para el caller — incluye cursos sin plan
        asociado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            subscription_required:
              value:
                type: https://menta.dance/problems/lesson_forbidden_subscription_required
                title: Forbidden
                status: 403
                detail: Esta lección requiere una suscripción activa
                code: LESSON_FORBIDDEN_SUBSCRIPTION_REQUIRED

    LessonNotFound:
      description: Lección inexistente o con id inválido (no se distinguen).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            no_encontrada:
              value:
                type: https://menta.dance/problems/lesson_not_found
                title: Not Found
                status: 404
                detail: Lección no encontrada.
                code: LESSON_NOT_FOUND

    AuthenticationRequired:
      description: Falta el token o no es válido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            sin_token:
              value:
                type: https://menta.dance/problems/authentication_required
                title: Unauthorized
                status: 401
                detail: Authentication is required.
                code: AUTHENTICATION_REQUIRED

  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details con el miembro adicional `code`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string

    PublicLessonDetailResponse:
      description: >-
        Variante con `subscription` (lección gratuita) o sin ella (lección de un módulo preview o con
        suscripción vigente). Se usa `anyOf` porque la respuesta gratuita también cumple la variante
        sin `subscription` (`videoId` puede ser `null` en ambas); se distingue por la presencia de
        `subscription`.
      anyOf:
        - $ref: '#/components/schemas/PublicLessonPreviewResponse'
        - $ref: '#/components/schemas/PublicLessonEntitledResponse'

    PublicLessonPreviewResponse:
      type: object
      description: Lección gratuita.
      required: [lesson, navigation, subscription, access]
      properties:
        lesson:
          $ref: '#/components/schemas/PublicLessonPreview'
        navigation:
          $ref: '#/components/schemas/PublicLessonNavigation'
        subscription:
          $ref: '#/components/schemas/PublicLessonSubscriptionPrompt'
        access:
          $ref: '#/components/schemas/PublicLessonAccessMetadata'

    PublicLessonEntitledResponse:
      type: object
      description: Lección de un módulo preview o accesible por suscripción vigente; no lleva `subscription`.
      required: [lesson, navigation, access]
      properties:
        lesson:
          $ref: '#/components/schemas/PublicLessonEntitled'
        navigation:
          $ref: '#/components/schemas/PublicLessonNavigation'
        access:
          $ref: '#/components/schemas/PublicLessonAccessMetadata'

    PublicLessonDetailBase:
      type: object
      required: [lessonId, title, description, duration, isFree, order, module, course, thumbnailUrl]
      properties:
        lessonId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        duration:
          type: string
          example: '15:00'
        isFree:
          type: boolean
        order:
          type: integer
        module:
          $ref: '#/components/schemas/PublicModuleRef'
        course:
          $ref: '#/components/schemas/PublicCourseRef'
        thumbnailUrl:
          type: string

    PublicLessonPreview:
      allOf:
        - $ref: '#/components/schemas/PublicLessonDetailBase'
        - type: object
          required: [videoId]
          properties:
            videoId:
              type: 'null'
              description: Siempre `null` en una lección gratuita (la clave viaja igual).

    PublicLessonEntitled:
      allOf:
        - $ref: '#/components/schemas/PublicLessonDetailBase'
        - type: object
          required: [videoId]
          properties:
            videoId:
              type: [string, 'null']
              description: >-
                Identificador opaco de Bunny.net; `null` si la lección todavía no tiene video asignado.

    PublicModuleRef:
      type: object
      required: [moduleId, title]
      properties:
        moduleId:
          type: string
          format: uuid
        title:
          type: string

    PublicCourseRef:
      type: object
      required: [courseId, title]
      properties:
        courseId:
          type: string
          format: uuid
        title:
          type: string

    PublicLessonNavigation:
      type: object
      required: [previousLesson, nextLesson]
      properties:
        previousLesson:
          oneOf:
            - $ref: '#/components/schemas/PublicLessonNavigationRef'
            - type: 'null'
        nextLesson:
          oneOf:
            - $ref: '#/components/schemas/PublicLessonNavigationRef'
            - type: 'null'

    PublicLessonNavigationRef:
      type: object
      required: [lessonId, title, isFree]
      properties:
        lessonId:
          type: string
          format: uuid
        title:
          type: string
        isFree:
          type: boolean

    PublicLessonSubscriptionPrompt:
      type: object
      required: [message, plansUrl]
      properties:
        message:
          type: string
        plansUrl:
          type: string

    PublicLessonAccessMetadata:
      type: object
      description: Metadatos seguros de autorización, sin capacidad de media.
      required: [preview, requiresSubscription]
      properties:
        preview:
          type: boolean
          description: >-
            `true` sólo en la variante de lección gratuita. Una lección de un módulo preview responde
            hoy la variante sin `subscription`, con `preview: false`.
        requiresSubscription:
          type: boolean
          description: Siempre false en una respuesta 200; los casos protegidos se expresan con 403 Problem Details.

    PublicLessonStreamResponse:
      type: object
      required: [stream, lesson]
      properties:
        stream:
          type: object
          required: [url, type, qualities, expiresAt]
          properties:
            url:
              type: string
              format: uri
            type:
              type: string
              enum: [HLS]
            qualities:
              type: array
              items:
                type: object
                required: [label, bitrate]
                properties:
                  label:
                    type: string
                  bitrate:
                    type: integer
                    format: int64
            expiresAt:
              type: string
              format: date-time
        lesson:
          type: object
          required: [lessonId, title, duration]
          properties:
            lessonId:
              type: string
              format: uuid
            title:
              type: string
            duration:
              type: string

    CreateVirtualCourseRequest:
      type: object
      required: [title, shortDescription, description, imageUrl, category, level]
      properties:
        title:
          type: string
        shortDescription:
          type: string
        description:
          type: string
        professorId:
          type: [string, "null"]
          format: uuid
          description: Omitido por un PROFESOR (se asigna a sí mismo); requerido para que un ADMIN asigne a otro profesor.
        imageUrl:
          type: string
        category:
          type: string
          example: tango
        level:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED]

    UpdateVirtualCourseRequest:
      type: object
      description: Todos los campos son opcionales — sólo los presentes se aplican.
      properties:
        title:
          type: string
        shortDescription:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        category:
          type: string
        level:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED]
        premium:
          type: boolean

    VirtualCourseManagementResponse:
      type: object
      required: [courseId, title, shortDescription, description, professorId, imageUrl, category, level, premium, status]
      properties:
        courseId:
          type: string
          format: uuid
        title:
          type: string
        shortDescription:
          type: string
        description:
          type: string
        professorId:
          type: string
          format: uuid
        imageUrl:
          type: string
        category:
          type: string
        level:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED]
        premium:
          type: boolean
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]

    VirtualCourseManagementListResponse:
      type: object
      required: [courses]
      properties:
        courses:
          type: array
          items:
            $ref: '#/components/schemas/VirtualCourseManagementResponse'

    CreateVirtualModuleRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        preview:
          type: boolean
          default: false
          description: >-
            Marca el módulo como preview: sus lecciones se sirven sin suscripción (ver
            `GET /api/v1/virtual/lessons/{lessonId}`).
        order:
          type: [integer, "null"]
          minimum: 0

    UpdateVirtualModuleRequest:
      type: object
      description: Todos los campos son opcionales — sólo los presentes se aplican.
      properties:
        title:
          type: string
        preview:
          type: boolean
        order:
          type: integer
          minimum: 0

    VirtualModuleManagementResponse:
      type: object
      required: [moduleId, courseId, title, preview, order]
      properties:
        moduleId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        title:
          type: string
        preview:
          type: boolean
        order:
          type: integer

    VirtualModuleManagementListResponse:
      type: object
      required: [modules]
      properties:
        modules:
          type: array
          items:
            $ref: '#/components/schemas/VirtualModuleManagementResponse'

    ReorderVirtualModulesRequest:
      type: object
      required: [moduleIds]
      properties:
        moduleIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    CreateVirtualLessonRequest:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
        description:
          type: string
        videoId:
          type: [string, 'null']
          example: bunny-video-id-123
          pattern: '\S'
          description: >-
            Se omite o va `null` para crear la lección sin video todavía. Un valor en blanco
            (vacío o sólo espacios) se rechaza con `400 INVALID_REQUEST`.
        durationMinutes:
          type: integer
          minimum: 0
          default: 0
        free:
          type: boolean
          default: false
        order:
          type: [integer, "null"]
          minimum: 0

    UpdateVirtualLessonRequest:
      type: object
      description: Todos los campos son opcionales — sólo los presentes se aplican.
      properties:
        title:
          type: string
        description:
          type: string
        videoId:
          type: [string, 'null']
          example: bunny-video-id-123
          pattern: '\S'
          description: >-
            Se omite o va `null` para dejar el video como está. Un valor en blanco (vacío o sólo
            espacios) se rechaza con `400 INVALID_REQUEST`: un video no se puede quitar una vez
            asignado, sólo reemplazar.
        durationMinutes:
          type: integer
          minimum: 0
        free:
          type: boolean
        order:
          type: integer
          minimum: 0

    VirtualLessonManagementResponse:
      type: object
      required: [lessonId, moduleId, courseId, title, description, videoId, durationMinutes, free, order]
      properties:
        lessonId:
          type: string
          format: uuid
        moduleId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        videoId:
          type: [string, 'null']
        durationMinutes:
          type: integer
        free:
          type: boolean
        order:
          type: integer

    SaveLessonProgressRequest:
      type: object
      required: [positionSeconds]
      properties:
        positionSeconds:
          type: integer
          minimum: 0
          description: >-
            Posición de reproducción en segundos, entre 0 y `durationMinutes * 60` de la lección.
            Obligatorio y no nulo.

    LessonProgressResponse:
      type: object
      required: [lessonId, positionSeconds, completed, completedAt]
      properties:
        lessonId:
          type: string
          format: uuid
        positionSeconds:
          type: integer
          minimum: 0
        completed:
          type: boolean
        completedAt:
          type: [string, 'null']
          format: date-time
          description: '`null` mientras la lección no esté completada.'

    VirtualCourseAdminDetailResponse:
      type: object
      required: [courseId, title, shortDescription, description, professorId, thumbnailUrl, category, level,
                 isPremium, status, modules, stats]
      properties:
        courseId:
          type: string
          format: uuid
        title:
          type: string
        shortDescription:
          type: string
          description: Descripción corta del curso, la que se muestra en los listados.
          example: Aprendé los pasos fundamentales del tango argentino.
        description:
          type: string
        professorId:
          type: string
          format: uuid
          description: >-
            Id del profesor dueño del curso. Sólo lo ven el ADMIN y el INSTRUCTOR dueño, que son quienes pueden
            leer este detalle.
          example: 11111111-1111-4111-8111-111111111111
        thumbnailUrl:
          type: string
          description: Es el `imageUrl` del curso (en las respuestas de gestión se llama `imageUrl`).
        category:
          type: string
        level:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED]
        isPremium:
          type: boolean
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        modules:
          type: array
          items:
            type: object
            required: [moduleId, title, preview, order, lessons]
            properties:
              moduleId:
                type: string
                format: uuid
              title:
                type: string
              preview:
                type: boolean
                description: Si es `true`, las lecciones del módulo se sirven sin suscripción.
              order:
                type: integer
              lessons:
                type: array
                items:
                  type: object
                  required: [lessonId, title, description, durationMinutes, isFree, order, videoId]
                  properties:
                    lessonId:
                      type: string
                      format: uuid
                    title:
                      type: string
                    description:
                      type: string
                    durationMinutes:
                      type: integer
                    isFree:
                      type: boolean
                    order:
                      type: integer
                    videoId:
                      type: [string, 'null']
        stats:
          type: object
          required: [moduleCount, lessonCount, totalDuration]
          properties:
            moduleCount:
              type: integer
            lessonCount:
              type: integer
            totalDuration:
              type: string
              description: Duración total como `Xm` por debajo de una hora y `Xh Ym` desde ahí.
              examples: ['45m', '2h 30m']

    InProgressCourseResponse:
      type: object
      required: [courseId, courseTitle, completedLessons, totalLessons, percentage, resumeLesson]
      properties:
        courseId:
          type: string
          format: uuid
        courseTitle:
          type: string
        completedLessons:
          type: integer
          minimum: 0
        totalLessons:
          type: integer
          minimum: 1
        percentage:
          type: integer
          minimum: 0
          maximum: 99
          description: Nunca 100 en este listado (un curso completo no aparece).
        resumeLesson:
          type: object
          required: [lessonId, moduleId, lessonTitle, positionSeconds]
          properties:
            lessonId:
              type: string
              format: uuid
            moduleId:
              type: string
              format: uuid
            lessonTitle:
              type: string
            positionSeconds:
              type: integer
              minimum: 0

    CourseProgressResponse:
      type: object
      required: [courseId, completedLessons, totalLessons, percentage, resumeLesson]
      properties:
        courseId:
          type: string
          format: uuid
        completedLessons:
          type: integer
          minimum: 0
        totalLessons:
          type: integer
          minimum: 0
        percentage:
          type: integer
          minimum: 0
          maximum: 100
        resumeLesson:
          description: '`null` si el curso no tiene lecciones o el usuario no tiene progreso.'
          oneOf:
            - type: 'null'
            - type: object
              required: [lessonId, moduleId, positionSeconds, completed]
              properties:
                lessonId:
                  type: string
                  format: uuid
                moduleId:
                  type: string
                  format: uuid
                positionSeconds:
                  type: integer
                  minimum: 0
                completed:
                  type: boolean

security:
  - bearerAuth: []
