openapi: 3.1.0

# Contrato HTTP de la superficie Catalog v1.
#
# Escrito y versionado a mano, mismo criterio que auth-v1.yaml, billing-v1.yaml,
# physical-v1.yaml y virtual-v1.yaml: el diff se revisa en el PR igual que la
# colección Bruno.
#
# Primer endpoint público propio de api:app fuera de auth (#95). Compone,
# sin tabla compartida ni HTTP interno, los puertos de Physical (#40) y
# Virtual (#46) — ver docs/07-CATALOG-API.md y docs/adr/0037-catalog-course-id-routing.md.
# Cubre las 2 rutas de CatalogController, las únicas del catálogo.
#
# Un test (CatalogOpenApiContractTest) lee el controller y los records reales y
# falla si una ruta, un campo, un enum, un código de error o el conjunto de
# respuestas cambian sin este contrato.

info:
  title: Menta Dance — Catalog API
  version: "1.0.0"
  description: |
    Única lectura pública de cursos para alumnos/visitantes (docs/07-CATALOG-API.md).
    Cada curso tiene exactamente una modalidad (`PHYSICAL` o `VIRTUAL`); la
    respuesta lleva campos comunes más un bloque específico de modalidad.

    ## Errores

    Todos los errores usan `application/problem+json` (RFC 9457) con un
    miembro adicional `code` estable. Los clientes deben discriminar por
    `code`, no por `detail`.

    ## No enumeración

    `GET /courses/{courseId}` no distingue un curso inexistente de uno no
    publicado/inactivo, ni de un `courseId` que no es un UUID — todos responden
    el mismo `404 COURSE_NOT_FOUND`.

    ## Fechas

    El `dayOfWeek` y el `startTime` de un curso presencial van en UTC y el
    cliente los convierte a la zona del usuario (ADR-0048). `startTime` se
    responde como `HH:mm` y sólo lleva `:ss` cuando los segundos no son cero;
    `scheduledAt` es un instante ISO-8601 con `Z`.

servers:
  - url: http://localhost:8081
    description: Desarrollo local
  - url: https://api.mentadance.com
    description: Producción

tags:
  - name: Catálogo
    description: Catálogo público compuesto de cursos (Physical + Virtual).

paths:
  /api/v1/catalog/courses:
    get:
      tags: [Catálogo]
      summary: Listar cursos del catálogo público
      description: |
        Devuelve cursos de ambas modalidades combinados. Sin filtro, búsqueda
        ni paginación pública (fuera de alcance de #95). Sin cursos, responde
        `200` con una lista vacía — nunca `404`.
      operationId: listCatalogCourses
      security: []
      responses:
        '200':
          description: Lista combinada de cursos (posiblemente vacía).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogListResponse'
        '503':
          $ref: '#/components/responses/CatalogDegraded'
  /api/v1/catalog/courses/{courseId}:
    get:
      tags: [Catálogo]
      summary: Obtener el detalle de un curso por id, sin indicar la modalidad
      description: |
        `api:app` determina la modalidad consultando primero Virtual y, si no
        hay un curso publicado con ese id, Physical. Un id virtual
        responde el detalle virtual (sin `sessions`); un id presencial activo
        responde el detalle presencial con sus próximas sesiones.

        La ventana de sesiones es `[ahora, ahora + W)`, con `W` en días tomado
        de la propiedad `catalog.physical.sessions.window-days` (por defecto
        30, rango 1 a 90). El endpoint no acepta `from`/`to`: si se envían,
        se ignoran. Las sesiones salen en orden ascendente por `scheduledAt`
        y se limitan a 100 (las 100 más próximas, sin señal de truncado). Una
        sesión agotada se lista con `availableSpots` 0; una cancelada no se
        lista. Si la consulta de sesiones falla, toda la respuesta es `503`:
        nunca se devuelve un detalle parcial.
      operationId: getCatalogCourse
      security: []
      parameters:
        - name: courseId
          in: path
          required: true
          description: Un valor que no es un UUID responde `404 COURSE_NOT_FOUND`, no `400`.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: >-
            Curso encontrado. Detalle virtual o presencial según la modalidad
            del id; las dos formas son excluyentes por sus campos requeridos
            (no hay discriminador).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CatalogVirtualCourseDetail'
                  - $ref: '#/components/schemas/CatalogPhysicalCourseDetail'
        '404':
          $ref: '#/components/responses/CourseNotFound'
        '503':
          $ref: '#/components/responses/CatalogDegraded'

components:
  schemas:
    CatalogListResponse:
      type: object
      properties:
        courses:
          type: array
          items:
            $ref: '#/components/schemas/CatalogCourseResponse'
      required: [courses]
    CatalogCourseResponse:
      type: object
      properties:
        courseId:
          type: string
          format: uuid
        modality:
          type: string
          enum: [PHYSICAL, VIRTUAL]
        title:
          type: string
        level:
          $ref: '#/components/schemas/CourseLevel'
        physical:
          description: Presente (no nulo) sólo en cursos `PHYSICAL`; en los `VIRTUAL` es `null`.
          oneOf:
            - $ref: '#/components/schemas/PhysicalCatalogBlock'
            - type: 'null'
        virtual:
          description: Presente (no nulo) sólo en cursos `VIRTUAL`; en los `PHYSICAL` es `null`.
          oneOf:
            - $ref: '#/components/schemas/VirtualCatalogBlock'
            - type: 'null'
      required: [courseId, modality, title, level, physical, virtual]
    PhysicalCatalogBlock:
      type: object
      required: [professorName, dayOfWeek, startTime, capacity]
      properties:
        professorName:
          type: string
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeek'
        startTime:
          $ref: '#/components/schemas/StartTime'
        capacity:
          type: integer
    VirtualCatalogBlock:
      type: object
      required: [shortDescription, imageUrl, category, premium, moduleCount, lessonCount, totalDurationMinutes]
      properties:
        shortDescription:
          type: string
        imageUrl:
          type: string
        category:
          type: string
        premium:
          type: boolean
        moduleCount:
          type: integer
        lessonCount:
          type: integer
        totalDurationMinutes:
          type: integer
    CatalogVirtualCourseDetail:
      type: object
      description: >-
        Detalle de un curso VIRTUAL publicado (#47). No lleva `modality`,
        `physical` ni `sessions`; los lessons nunca exponen video.
      properties:
        courseId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        thumbnailUrl:
          type: string
        category:
          type: string
        level:
          $ref: '#/components/schemas/CourseLevel'
        isPremium:
          type: boolean
        modules:
          type: array
          items:
            type: object
            properties:
              moduleId:
                type: string
                format: uuid
              title:
                type: string
              order:
                type: integer
              lessons:
                type: array
                items:
                  type: object
                  properties:
                    lessonId:
                      type: string
                      format: uuid
                    title:
                      type: string
                    duration:
                      type: string
                      description: '`mm:ss` bajo 60 minutos, `h:mm` desde 60.'
                    isFree:
                      type: boolean
                    order:
                      type: integer
                  required: [lessonId, title, duration, isFree, order]
            required: [moduleId, title, order, lessons]
        stats:
          type: object
          properties:
            moduleCount:
              type: integer
            lessonCount:
              type: integer
            totalDuration:
              type: string
              description: '`Xm` bajo 60 minutos, `Xh Ym` desde 60.'
          required: [moduleCount, lessonCount, totalDuration]
      required: [courseId, title, description, thumbnailUrl, category, level, isPremium, modules, stats]
    CatalogPhysicalCourseDetail:
      type: object
      description: >-
        Detalle de un curso PRESENCIAL activo (#107): datos del curso más las
        próximas sesiones programadas con su disponibilidad. No lleva precios
        ni `quoteEndpoint`; las cotizaciones siguen en Billing.
      properties:
        courseId:
          type: string
          format: uuid
        modality:
          type: string
          const: PHYSICAL
        title:
          type: string
        level:
          $ref: '#/components/schemas/CourseLevel'
        physical:
          type: object
          properties:
            professorName:
              type: string
            dayOfWeek:
              $ref: '#/components/schemas/DayOfWeek'
            startTime:
              $ref: '#/components/schemas/StartTime'
            capacity:
              type: integer
            sessions:
              type: array
              maxItems: 100
              description: >-
                Sesiones SCHEDULED en `[ahora, ahora + W)`, ascendentes por
                `scheduledAt`, hasta 100. Vacío (nunca nulo) si no hay ninguna.
              items:
                $ref: '#/components/schemas/CatalogPublicSession'
          required: [professorName, dayOfWeek, startTime, capacity, sessions]
      required: [courseId, modality, title, level, physical]
    CatalogPublicSession:
      type: object
      description: >-
        Sesión pública. Sólo se publica `availableSpots`; los cupos asignados y
        los holds activos son datos internos y no se serializan.
      properties:
        sessionId:
          type: string
          format: uuid
        scheduledAt:
          type: string
          format: date-time
          description: Instante ISO-8601 en UTC (termina en `Z`).
        capacity:
          type: integer
        availableSpots:
          type: integer
          minimum: 0
          description: Cupos libres; 0 si la sesión está agotada.
      required: [sessionId, scheduledAt, capacity, availableSpots]
    CourseLevel:
      type: string
      description: Nivel del curso, igual para las dos modalidades.
      enum: [BEGINNER, INTERMEDIATE, ADVANCED]
      example: BEGINNER
    DayOfWeek:
      type: string
      description: >-
        Día de la semana de la recurrencia del curso, **en UTC** (no en la zona
        del usuario). El cliente lo convierte junto con `startTime` para
        mostrarlo; la conversión puede cambiar el día (ADR-0048).
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
      example: WEDNESDAY
    StartTime:
      type: string
      description: >-
        Hora de inicio de cada clase, **en UTC**, como `HH:mm`; sólo lleva `:ss`
        (y fracción) cuando no son cero. El cliente la convierte a su zona,
        junto con `dayOfWeek`, para mostrarla: `WEDNESDAY` a las `01:00` UTC es
        martes 22:00 en Buenos Aires (UTC-3).
      pattern: '^\d{2}:\d{2}(:\d{2}(\.\d{1,9})?)?$'
      example: "01:00"
    ProblemDetail:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          format: uri
          description: '`https://menta.dance/problems/<code en minúsculas>`.'
        title:
          type: string
          description: Frase de estado HTTP.
        status:
          type: integer
        detail:
          type: string
          description: Texto legible. No apto para lógica de cliente.
        code:
          type: string
          description: Identificador estable por el que un cliente debe discriminar.
          enum: [COURSE_NOT_FOUND, CATALOG_DEGRADED]
  responses:
    CourseNotFound:
      description: Ningún módulo dueño tiene ese courseId (o existe pero no está publicado/activo).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://menta.dance/problems/course_not_found
            title: Not Found
            status: 404
            detail: Course not found in any modality.
            code: COURSE_NOT_FOUND
    CatalogDegraded:
      description: El módulo dueño (Physical o Virtual) falló al resolver la consulta.
      headers:
        Retry-After:
          description: Segundos a esperar antes de reintentar; siempre `30`.
          required: true
          schema:
            type: integer
          example: 30
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://menta.dance/problems/catalog_degraded
            title: Service Unavailable
            status: 503
            detail: The physical catalog is temporarily unavailable
            code: CATALOG_DEGRADED
