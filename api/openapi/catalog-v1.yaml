openapi: 3.1.0

# Contrato HTTP de la superficie Catalog v1.
#
# Escrito y versionado a mano, mismo criterio que auth-v1.yaml y
# billing-v1.yaml: el diff se revisa en el PR igual que la colección Bruno.
#
# Primer endpoint público propio de api:app fuera de auth (#95). Compone,
# sin tabla compartida ni HTTP interno, los puertos de Physical (#40) y
# Virtual (#46) — ver docs/07-CATALOG-API.md y docs/adr/0037-catalog-course-id-routing.md.

info:
  title: Menta Dance — Catalog API
  version: "1.0.0"
  description: |
    Única lectura pública de cursos para alumnos/visitantes (docs/07-CATALOG-API.md).
    Cada curso tiene exactamente una modalidad (`PHYSICAL` o `VIRTUAL`); la
    respuesta lleva campos comunes más un bloque específico de modalidad.

    ## Errores

    Todos los errores usan `application/problem+json` (RFC 9457) con un
    miembro adicional `code` estable. Los clientes deben discriminar por
    `code`, no por `detail`.

    ## No enumeración

    `GET /courses/{courseId}` no distingue un curso inexistente de uno no
    publicado/inactivo — ambos responden el mismo `404 COURSE_NOT_FOUND`.

servers:
  - url: http://localhost:8081
    description: Desarrollo local
  - url: https://api.mentadance.com
    description: Producción

tags:
  - name: Catálogo
    description: Catálogo público compuesto de cursos (Physical + Virtual).

paths:
  /api/v1/catalog/courses:
    get:
      tags: [Catálogo]
      summary: Listar cursos del catálogo público
      description: |
        Devuelve cursos de ambas modalidades combinados. Sin filtro, búsqueda
        ni paginación pública (fuera de alcance de #95). Sin cursos, responde
        `200` con una lista vacía — nunca `404`.
      operationId: listCatalogCourses
      security: []
      responses:
        '200':
          description: Lista combinada de cursos (posiblemente vacía).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogListResponse'
        '503':
          $ref: '#/components/responses/CatalogDegraded'
  /api/v1/catalog/courses/{courseId}:
    get:
      tags: [Catálogo]
      summary: Obtener el detalle de un curso por id, sin indicar la modalidad
      description: |
        `api:app` determina la modalidad consultando primero Virtual y, si no
        hay un curso publicado con ese id, Physical. Un id virtual
        responde el detalle virtual (sin `sessions`); un id presencial activo
        responde el detalle presencial con sus próximas sesiones.

        La ventana de sesiones es `[ahora, ahora + W)`, con `W` en días tomado
        de la propiedad `catalog.physical.sessions.window-days` (por defecto
        30, rango 1 a 90). El endpoint no acepta `from`/`to`: si se envían,
        se ignoran. Las sesiones salen en orden ascendente por `scheduledAt`
        y se limitan a 100 (las 100 más próximas, sin señal de truncado). Una
        sesión agotada se lista con `availableSpots` 0; una cancelada no se
        lista. Si la consulta de sesiones falla, toda la respuesta es `503`:
        nunca se devuelve un detalle parcial.
      operationId: getCatalogCourse
      security: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: >-
            Curso encontrado. Detalle virtual o presencial según la modalidad
            del id; las dos formas son excluyentes por sus campos requeridos
            (no hay discriminador).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CatalogVirtualCourseDetail'
                  - $ref: '#/components/schemas/CatalogPhysicalCourseDetail'
        '404':
          $ref: '#/components/responses/CourseNotFound'
        '503':
          $ref: '#/components/responses/CatalogDegraded'

components:
  schemas:
    CatalogListResponse:
      type: object
      properties:
        courses:
          type: array
          items:
            $ref: '#/components/schemas/CatalogCourseResponse'
      required: [courses]
    CatalogCourseResponse:
      type: object
      properties:
        courseId:
          type: string
          format: uuid
        modality:
          type: string
          enum: [PHYSICAL, VIRTUAL]
        title:
          type: string
        level:
          type: string
        physical:
          $ref: '#/components/schemas/PhysicalCatalogBlock'
          nullable: true
        virtual:
          $ref: '#/components/schemas/VirtualCatalogBlock'
          nullable: true
      required: [courseId, modality, title, level]
    PhysicalCatalogBlock:
      type: object
      properties:
        professorName:
          type: string
        dayOfWeek:
          type: string
        startTime:
          type: string
        capacity:
          type: integer
    VirtualCatalogBlock:
      type: object
      properties:
        shortDescription:
          type: string
        imageUrl:
          type: string
        category:
          type: string
        premium:
          type: boolean
        moduleCount:
          type: integer
        lessonCount:
          type: integer
        totalDurationMinutes:
          type: integer
    CatalogVirtualCourseDetail:
      type: object
      description: >-
        Detalle de un curso VIRTUAL publicado (#47). No lleva `modality`,
        `physical` ni `sessions`; los lessons nunca exponen video.
      properties:
        courseId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        thumbnailUrl:
          type: string
        category:
          type: string
        level:
          type: string
        isPremium:
          type: boolean
        modules:
          type: array
          items:
            type: object
            properties:
              moduleId:
                type: string
                format: uuid
              title:
                type: string
              order:
                type: integer
              lessons:
                type: array
                items:
                  type: object
                  properties:
                    lessonId:
                      type: string
                      format: uuid
                    title:
                      type: string
                    duration:
                      type: string
                      description: '`mm:ss` bajo 60 minutos, `h:mm` desde 60.'
                    isFree:
                      type: boolean
                    order:
                      type: integer
                  required: [lessonId, title, duration, isFree, order]
            required: [moduleId, title, order, lessons]
        stats:
          type: object
          properties:
            moduleCount:
              type: integer
            lessonCount:
              type: integer
            totalDuration:
              type: string
              description: '`Xm` bajo 60 minutos, `Xh Ym` desde 60.'
          required: [moduleCount, lessonCount, totalDuration]
      required: [courseId, title, level, isPremium, modules, stats]
    CatalogPhysicalCourseDetail:
      type: object
      description: >-
        Detalle de un curso PRESENCIAL activo (#107): datos del curso más las
        próximas sesiones programadas con su disponibilidad. No lleva precios
        ni `quoteEndpoint`; las cotizaciones siguen en Billing.
      properties:
        courseId:
          type: string
          format: uuid
        modality:
          type: string
          const: PHYSICAL
        title:
          type: string
        level:
          type: string
        physical:
          type: object
          properties:
            professorName:
              type: string
            dayOfWeek:
              type: string
            startTime:
              type: string
            capacity:
              type: integer
            sessions:
              type: array
              maxItems: 100
              description: >-
                Sesiones SCHEDULED en `[ahora, ahora + W)`, ascendentes por
                `scheduledAt`, hasta 100. Vacío (nunca nulo) si no hay ninguna.
              items:
                $ref: '#/components/schemas/CatalogPublicSession'
          required: [professorName, dayOfWeek, startTime, capacity, sessions]
      required: [courseId, modality, title, level, physical]
    CatalogPublicSession:
      type: object
      description: >-
        Sesión pública. Sólo se publica `availableSpots`; los cupos asignados y
        los holds activos son datos internos y no se serializan.
      properties:
        sessionId:
          type: string
          format: uuid
        scheduledAt:
          type: string
          format: date-time
          description: Instante ISO-8601 en UTC (termina en `Z`).
        capacity:
          type: integer
        availableSpots:
          type: integer
          minimum: 0
          description: Cupos libres; 0 si la sesión está agotada.
      required: [sessionId, scheduledAt, capacity, availableSpots]
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
      required: [status, code]
  responses:
    CourseNotFound:
      description: Ningún módulo dueño tiene ese courseId (o existe pero no está publicado/activo).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    CatalogDegraded:
      description: El módulo dueño (Physical o Virtual) falló al resolver la consulta.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
